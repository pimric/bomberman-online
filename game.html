<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Bomber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/ile.css">
    <style>
        /* ---- Page de jeu ---- */
        .app {
            position: relative;
            z-index: 1;
            max-width: 1040px;
            margin: 0 auto;
            padding: 16px 16px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .topbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .topbar .logo { font-size: clamp(28px, 5vw, 40px); }
        .topbar-actions { display: flex; gap: 8px; }

        /* Menu de choix de partie */
        #roomControls {
            width: min(560px, 100%);
            text-align: center;
        }
        #roomControls h2 { margin: 0 0 14px; }
        .solo-btn { width: 100%; }
        .level-picker {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
            font-weight: 700;
            color: var(--wood);
        }
        .level-picker button {
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 999px;
            border: 2px solid var(--sand-deep);
            background: #fff;
            color: var(--wood);
            cursor: pointer;
        }
        .level-picker button[aria-checked="true"] {
            background: var(--wood);
            border-color: var(--wood);
            color: #fff;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0 14px;
            color: var(--wood);
            font-weight: 700;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-top: 2px dashed var(--sand-deep);
        }
        .online-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .online-row input { flex: 1 1 160px; }

        #gameInfo {
            min-height: 1.4em;
            padding: 8px 18px;
            border-radius: 999px;
            background: var(--sand-light);
            color: var(--ink);
            font-weight: 700;
            box-shadow: 0 3px 0 var(--sand-deep);
            text-align: center;
        }

        /* Zone de jeu : fiches joueurs + plateau */
        .arena {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 18px;
            width: 100%;
        }
        .hud {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 190px;
        }
        .hud:empty { display: none; }

        .player-card {
            display: grid;
            grid-template-columns: 52px 1fr;
            gap: 4px 10px;
            align-items: center;
            padding: 10px 12px;
            border-radius: 16px;
            background: var(--sand-light);
            color: var(--ink);
            box-shadow: 0 4px 0 var(--sand-deep), 0 10px 20px rgba(0, 40, 60, .25);
            border-left: 6px solid var(--accent, var(--wood));
        }
        .player-card.dead { opacity: .55; filter: grayscale(.8); }
        .player-card .portrait { grid-row: span 2; width: 52px; height: 52px; }
        .player-card .name { font-weight: 800; line-height: 1.1; }
        .player-card .name small { display: block; font-weight: 600; color: var(--wood); }
        .player-card .stats { display: flex; gap: 8px; font-weight: 800; }
        .pips { display: flex; gap: 3px; margin-top: 3px; }
        .player-card .powers { grid-column: 1 / -1; display: flex; gap: 4px; }
        .player-card .powers i { width: 22px; height: 22px; }
        .player-card .powers i.malus { animation: tide-pulse .6s ease-in-out infinite; }
        .pip {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #efe0bd;
            border: 2px solid var(--sand-deep);
        }
        .pip.won { background: var(--accent); border-color: var(--accent); }

        .round-bar {
            padding: 4px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .22);
            color: #fff;
            font-weight: 800;
            text-shadow: 0 1px 2px rgba(0, 40, 60, .5);
        }
        .round-bar.tide { background: var(--sunset); animation: tide-pulse 1s ease-in-out infinite; }
        @keyframes tide-pulse { 50% { transform: scale(1.05); } }
        .player-card .stat { display: flex; align-items: center; gap: 2px; }
        .player-card .stat i { width: 20px; height: 20px; display: inline-block; }

        .board-frame {
            position: relative;
            width: min(544px, calc(100vw - 32px), calc(100vh - 190px));
            min-width: 300px;
            aspect-ratio: 1;
            border-radius: 22px;
            box-shadow: 0 0 0 6px var(--sand-light), 0 0 0 10px var(--wood),
                        0 22px 40px rgba(0, 30, 50, .45);
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Écran de fin, par-dessus le plateau */
        #gameControls {
            position: absolute;
            inset: 0;
            background: rgba(6, 60, 80, .55);
            backdrop-filter: blur(2px);
            transition: opacity .25s ease-out;
        }
        /* Invisible tant que l'animation de mort n'est pas finie (classe
           « ready » posée par updateHud) */
        #gameControls:not(.ready) {
            opacity: 0;
            pointer-events: none;
        }
        .end-card {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(360px, 86%);
            text-align: center;
        }
        #gameControls.ready .end-card {
            animation: pop-in .35s cubic-bezier(.2, 1.4, .4, 1);
        }
        #endTitle {
            font-family: 'Pacifico', cursive;
            font-size: 42px;
            line-height: 1.2;
            margin: 0 0 4px;
        }
        #endTitle.win { color: var(--palm-dark); }
        #endTitle.lose { color: var(--sunset-dark); }
        #endText { margin: 0 0 16px; font-weight: 700; }
        .end-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .keys-hint {
            color: #e8fbff;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0, 40, 60, .6);
        }

        @media (max-width: 860px) {
            .arena { flex-direction: column; align-items: center; }
            .hud { flex-direction: row; width: 100%; flex-wrap: wrap; justify-content: center; gap: 8px; }
            .player-card { width: calc(50% - 4px); max-width: 190px; grid-template-columns: 40px 1fr; padding: 8px 10px; }
            /* le sprite est calé pour 52 px : on réduit le bloc entier */
            .player-card .portrait { transform: scale(.77); transform-origin: left center; }
            .player-card .stats { gap: 5px; font-size: 15px; }
            .keys-hint { display: none; }
        }

        #debug {
            display: none;
            margin-top: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="ocean" aria-hidden="true"><div class="wave"></div><div class="wave wave2"></div></div>

    <main class="app">
        <header class="topbar">
            <a href="index.html" class="logo">Island Bomber</a>
            <div class="topbar-actions">
                <button id="soundBtn" class="btn btn-small btn-ghost" type="button" aria-pressed="true">Son : oui</button>
                <a href="index.html" class="btn btn-small btn-ghost">Accueil</a>
            </div>
        </header>

        <section id="roomControls" class="card">
            <h2 class="card-title">Choisis ta partie</h2>
            <button id="singlePlayerBtn" class="btn btn-primary btn-big solo-btn">Jouer contre l'IA</button>
            <div class="level-picker" role="radiogroup" aria-label="Niveau de l'IA">
                <span>Niveau :</span>
                <button type="button" role="radio" data-level="facile">Facile</button>
                <button type="button" role="radio" data-level="normal">Normal</button>
                <button type="button" role="radio" data-level="difficile">Difficile</button>
            </div>
            <div class="divider">ou entre amis</div>
            <div class="online-row">
                <input type="text" id="roomInput" placeholder="Code de partie" autocomplete="off">
                <button id="createBtn" class="btn">Créer</button>
                <button id="joinBtn" class="btn btn-secondary">Rejoindre</button>
            </div>
        </section>

        <div id="gameInfo">Bienvenue sur l'île !</div>
        <div id="roundBar" class="round-bar" hidden></div>

        <div class="arena">
            <aside id="hud" class="hud" aria-live="polite"></aside>
            <div class="board-frame">
                <canvas id="gameCanvas" width="544" height="544"></canvas>
                <div id="gameControls" style="display: none;">
                    <div class="end-card card">
                        <p id="endTitle">Fin</p>
                        <p id="endText"></p>
                        <div class="end-actions">
                            <button id="restartBtn" class="btn btn-primary">Rejouer</button>
                            <button id="homeBtn" class="btn btn-secondary">Accueil</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <p class="keys-hint"><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> se déplacer · <kbd>Espace</kbd> poser une bombe · <kbd>Entrée</kbd> déclencher (détonateur)</p>
    </main>

    <!-- Panneau de debug (caché) -->
    <div id="debug" style="display: none;">
        <div>IA - Position: <span id="aiGridX">0</span>, <span id="aiGridY">0</span> | Bombes: <span id="aiBombs">1</span> | Puissance: <span id="aiPower">2</span></div>
        <div>Joueur - Position: <span id="playerGridX">0</span>, <span id="playerGridY">0</span> | Bombes: <span id="playerBombs">1</span> | Puissance: <span id="playerPower">2</span></div>
        <div>Action IA: <span id="aiAction">-</span></div>
    </div>

    <!-- Import Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.9.0/firebase-app-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.9.0/firebase-database-compat.js"></script>
    <script src="assets/sprites.js"></script>

    <script>
        // Ajout d'un système de journalisation simple
        function log(message) {
            console.log(`[${new Date().toISOString()}] ${message}`);
        }

        log("Script démarré");

        //--------------------------------------------------
        // CONFIGURATION DU JEU
        //--------------------------------------------------
        const GRID_SIZE = 15;
        const TILE_SIZE = 32;

        // Déplacement case par case (grille classique). MOVE_DURATION = temps
        // pour traverser une case à vitesse normale (speedMultiplier = 1).
        const MOVE_DURATION = 200; // ms par case

        // Définir les types de cases
        const TILE_TYPES = {
            EMPTY: 0,  // Sable
            WALL: 1,   // Palmiers
            BRICK: 2   // Tonneaux
        };

        // Configuration des bombes
        const BOMB_TIMER = 3000; // Délai avant explosion (ms)
        const EXPLOSION_DURATION = 1000; // Durée d'affichage de l'explosion (ms)
        const BOMB_OWNER_GRACE = 500; // Retard toléré avant qu'un autre onglet explose la bombe à la place de son propriétaire (ms)

        // Configuration de l'IA, par niveau (choisi dans le menu, retenu dans
        // le navigateur). « difficile » = l'ancien réglage unique.
        //   moveDelay   : délai entre deux décisions (ms)
        //   bombChance  : probabilité de poser quand c'est stratégique
        //   wander      : probabilité de flâner au hasard au lieu de chasser
        //   bonusRadius : distance max à laquelle elle va chercher un bonus
        const AI_LEVELS = {
            facile:    { label: 'Facile',    moveDelay: 380, bombChance: 0.25, wander: 0.35, bonusRadius: 2 },
            normal:    { label: 'Normal',    moveDelay: 270, bombChance: 0.45, wander: 0.12, bonusRadius: 4 },
            difficile: { label: 'Difficile', moveDelay: 200, bombChance: 0.6,  wander: 0,    bonusRadius: 5 }
        };
        let aiLevel = 'normal';
        try {
            const saved = localStorage.getItem('islandBomber.aiLevel');
            if (AI_LEVELS[saved]) aiLevel = saved;
        } catch (e) { /* stockage indisponible : niveau par défaut */ }

        function aiSettings() {
            return AI_LEVELS[aiLevel];
        }

        // Nombre de pas que l'IA peut GARANTIR avant l'explosion de sa bombe.
        // Pire cas par pas : la case se traverse en MOVE_DURATION, mais le tick
        // de décision suivant peut tomber juste avant la fin du pas → un tick
        // perdu. Dépend du niveau (une IA lente fuit moins loin).
        function aiEscapeMaxSteps() {
            const delay = aiSettings().moveDelay;
            return Math.floor((BOMB_TIMER - delay) / (MOVE_DURATION + delay)); // difficile = 7, facile = 4
        }

        // Champs de déplacement gérés localement pour les entités simulées dans
        // cet onglet (jamais réécrits par le retour Firebase, voir joinGame)
        const LOCAL_MOVEMENT_KEYS = ['x', 'y', 'moving', 'fromX', 'fromY', 'toX', 'toY', 'moveStart'];

        // Fréquence d'envoi de la position du joueur vers Firebase (ms).
        // On bouge localement à chaque frame, mais on ne synchronise le réseau
        // qu'à cet intervalle pour éviter un déplacement saccadé.
        const POSITION_SYNC_INTERVAL = 100;
        let lastPositionSync = 0;
        let lastAiPositionSync = 0;

        // Lissage de l'affichage des joueurs distants (voir getDisplayPosition)
        const REMOTE_CATCHUP = 1.3;                 // vitesse d'affichage = vitesse de marche x 1.3
        const REMOTE_SNAP_DISTANCE = TILE_SIZE * 3; // au-delà : téléport direct
        const remoteDisplay = {};

        // Gestion des déconnexions (voir applyDisconnectPolicy)
        let connectedListener = null; // écouteur .info/connected de la partie en cours
        let disconnectAlone = null;   // politique actuellement programmée côté serveur
        let lastKnownAlone = true;    // dernier état « seul humain présent » observé
        let lastRoundKey = null;      // numéro de la manche affichée (détection de nouvelle manche)

        // Configuration des bonus
        const BONUS_PROBABILITY = 0.5; // 50% de chance qu'un tonneau détruit laisse un bonus
        // Les bonus restent au sol jusqu'à être ramassés ou brûlés (plus
        // d'expiration : choix de jeu classique)

        // Types de bonus
        const BONUS_TYPES = {
            BOMB: 0,      // Bombe supplémentaire
            POWER: 1,     // Augmente la portée des bombes
            SPEED: 2,     // Augmente la vitesse de déplacement
            KICK: 3,      // Pousser une bombe en marchant dessus
            DETONATOR: 4, // Bombes déclenchées à la main (Entrée)
            PIERCE: 5,    // Flammes qui traversent les tonneaux
            MALUS: 6      // Noix de coco pourrie : effet négatif temporaire
        };

        // Fréquence relative de chaque bonus à la destruction d'un tonneau
        const BONUS_WEIGHTS = [
            [BONUS_TYPES.BOMB, 24], [BONUS_TYPES.POWER, 24], [BONUS_TYPES.SPEED, 14],
            [BONUS_TYPES.KICK, 10], [BONUS_TYPES.DETONATOR, 6], [BONUS_TYPES.PIERCE, 8],
            [BONUS_TYPES.MALUS, 14]
        ];

        // Malus de la noix de coco pourrie (tiré au hasard, dure MALUS_DURATION)
        const MALUS_DURATION = 10000;
        const MALUS_TYPES = {
            inverse: 'Commandes inversées !',
            diarrhee: 'Bombes incontrôlables !',
            lent: 'Tout mou…'
        };
        const DETONATOR_FUSE = 10000;     // une bombe télécommandée oubliée finit par exploser
        const KICK_SLIDE_MS = 70;         // ms par case pour une bombe qui glisse

        // Configuration Firebase
        // databaseURL explicite obligatoire : la base vit en europe-west1, pas
        // dans la région US par défaut que le SDK devine depuis projectId seul.
        // Sans cette ligne, le SDK affiche un warning et le comportement de
        // secours dépend de la version du SDK — les écritures peuvent échouer
        // silencieusement plutôt que d'être redirigées vers la bonne région.
        const firebaseConfig = {
            apiKey: "AIzaSyDEDfD0gETLAra2wu9e0V8YVECdshVWAEc",
            authDomain: "bomberman-10e44.firebaseapp.com",
            databaseURL: "https://bomberman-10e44-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bomberman-10e44",
            storageBucket: "bomberman-10e44.firebasestorage.app",
            messagingSenderId: "734188613745",
            appId: "1:734188613745:web:96b85d282821b3613d2bd0"
        };

        // Initialiser Firebase
        log("Initialisation de Firebase");
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // État du jeu global
        const gameState = {
            roomId: null,
            playerId: null,
            map: [],
            players: {},
            bombs: [],
            explosions: [],
            bonuses: [],
            gameStarted: false,
            keys: {},
            lastKeys: {}, // Pour détecter les nouvelles pressions
            aiActive: true,
            // Textes flottants affichés localement (ex: nom du bonus ramassé).
            // Purement visuel, jamais synchronisé sur Firebase.
            floatingTexts: []
        };

        // Libellés affichés quand un bonus est ramassé
        const BONUS_LABELS = {
            0: '+1 Bombe',          // BONUS_TYPES.BOMB
            1: '+1 Puissance',      // BONUS_TYPES.POWER
            2: '+Vitesse',          // BONUS_TYPES.SPEED
            3: 'Coup de pied !',    // BONUS_TYPES.KICK
            4: 'Détonateur !',      // BONUS_TYPES.DETONATOR
            5: 'Flamme perçante !'  // BONUS_TYPES.PIERCE
            // MALUS : libellé selon l'effet tiré (MALUS_TYPES)
        };
        const FLOATING_TEXT_DURATION = 1200; // ms

        // Variables de l'IA
        let aiMode = false;
        let aiPlayerId = 'playerAI';
        let aiMoveInterval;
        let aiLastMove = { dx: 0, dy: 0 };
        // Repère de debug : dernières décisions de l'IA (case + action), vidées
        // dans la console à la mort d'un joueur pour comprendre comment c'est arrivé
        const AI_HISTORY_SIZE = 15;
        let aiHistory = [];
        let aiLastTargetUpdate = 0;

        // Références DOM
        log("Récupération des références DOM");
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Taille d'affichage : plateau + une case de mer de chaque côté.
        // Le canvas est dimensionné à sa taille ÉCRAN réelle (x devicePixelRatio)
        // pour que les sprites restent nets, puis tout est dessiné en
        // coordonnées logiques via renderScale.
        const BOARD_MARGIN = TILE_SIZE;
        const VIEW_SIZE = GRID_SIZE * TILE_SIZE + 2 * BOARD_MARGIN; // 544
        let renderScale = 1;

        function resizeCanvas() {
            const cssSize = canvas.getBoundingClientRect().width || VIEW_SIZE;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(cssSize * dpr);
            canvas.height = Math.round(cssSize * dpr);
            renderScale = canvas.width / VIEW_SIZE;
            ctx.imageSmoothingQuality = 'high';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const gameInfo = document.getElementById('gameInfo');
        const roomInput = document.getElementById('roomInput');
        const debugDiv = document.getElementById('debug');

        //--------------------------------------------------
        // FONCTIONS DE BASE DU JEU
        //--------------------------------------------------

        // Générer une carte aléatoire avec des chemins garantis
        function generateMap() {
            const map = [];
            
            // Initialiser la carte avec des murs fixes et le reste vide
            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (x % 2 === 0 && y % 2 === 0) {
                        // Murs fixes qui ne peuvent pas être détruits (palmiers)
                        row.push(TILE_TYPES.WALL);
                    } else {
                        // Tout le reste est vide au départ (sable)
                        row.push(TILE_TYPES.EMPTY);
                    }
                }
                map.push(row);
            }
            
            // Garantir des zones de départ vides pour les joueurs
            // Pour le joueur 1 (coin supérieur gauche)
            map[0][0] = TILE_TYPES.EMPTY;
            map[0][1] = TILE_TYPES.EMPTY;
            map[1][0] = TILE_TYPES.EMPTY;
            
            // Pour l'IA ou le joueur 2 (coin inférieur droit)
            map[GRID_SIZE-1][GRID_SIZE-1] = TILE_TYPES.EMPTY;
            map[GRID_SIZE-1][GRID_SIZE-2] = TILE_TYPES.EMPTY;
            map[GRID_SIZE-2][GRID_SIZE-1] = TILE_TYPES.EMPTY;
            
            // Ajouter des briques destructibles de manière aléatoire (tonneaux)
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Si c'est un emplacement vide (pas un palmier) et pas dans les zones de départ
                    if (map[y][x] === TILE_TYPES.EMPTY && 
                        !((x <= 1 && y <= 1) || (x >= GRID_SIZE-2 && y >= GRID_SIZE-2))) {
                        
                        // Probabilité de 60% d'avoir un tonneau
                        if (Math.random() < 0.6) {
                            map[y][x] = TILE_TYPES.BRICK;
                        }
                    }
                }
            }
            
            // Garantir un chemin entre le coin supérieur gauche et le coin inférieur droit
            
            // Chemin horizontal
            for (let x = 2; x < GRID_SIZE - 2; x += 2) {
                map[1][x] = TILE_TYPES.EMPTY;
            }
            
            // Chemin vertical
            for (let y = 3; y < GRID_SIZE - 1; y += 2) {
                map[y][GRID_SIZE - 2] = TILE_TYPES.EMPTY;
            }
            
            return map;
        }

        // Créer un joueur
        function createPlayer(x, y, color) {
            const px = x * TILE_SIZE + TILE_SIZE / 2;
            const py = y * TILE_SIZE + TILE_SIZE / 2;
            return {
                x: px,
                y: py,
                radius: TILE_SIZE / 2 - 4,
                color: color,
                maxBombs: 1,
                bombRange: 2,
                speedMultiplier: 1,
                canKick: false,
                hasDetonator: false,
                pierce: false,
                malus: null,       // clé de MALUS_TYPES, ou null
                malusUntil: 0,     // Date.now() de l'onglet qui simule ce joueur
                alive: true,
                // État de déplacement grille : tant que moving = true, l'entité
                // interpole de (fromX,fromY) vers (toX,toY), sans pouvoir dévier.
                moving: false,
                fromX: px,
                fromY: py,
                toX: px,
                toY: py,
                moveStart: 0
            };
        }

        // Avancer une entité d'une case dans la direction (dx, dy), en grille.
        // Ne fait rien si l'entité est déjà en train de se déplacer entre deux
        // cases, ou si la case cible n'est pas libre. `now` = Date.now() courant.
        function stepEntityOnGrid(entity, dx, dy, now) {
            if (entity.moving) return false;
            if (dx === 0 && dy === 0) return false;
            if (hasMalus(entity, 'inverse')) {
                dx = -dx;
                dy = -dy;
            }

            const gridX = Math.floor(entity.x / TILE_SIZE);
            const gridY = Math.floor(entity.y / TILE_SIZE);
            const targetGridX = gridX + dx;
            const targetGridY = gridY + dy;

            if (entity.canKick && isGridAccessible(targetGridX, targetGridY) && hasBomb(targetGridX, targetGridY)) {
                // Coup de pied : la bombe glisse, le joueur reste sur place
                kickBomb(targetGridX, targetGridY, dx, dy);
                return false;
            }

            if (!isGridAccessible(targetGridX, targetGridY) || hasBomb(targetGridX, targetGridY)) {
                return false;
            }

            entity.moving = true;
            entity.fromX = entity.x;
            entity.fromY = entity.y;
            entity.toX = targetGridX * TILE_SIZE + TILE_SIZE / 2;
            entity.toY = targetGridY * TILE_SIZE + TILE_SIZE / 2;
            entity.moveStart = now;
            return true;
        }

        // Faire progresser l'interpolation de mouvement d'une entité. Renvoie
        // true si la position a changé (donc à synchroniser sur Firebase).
        function advanceEntityMovement(entity, now) {
            if (!entity.moving) return false;

            const speedMultiplier = (entity.speedMultiplier || 1) * (hasMalus(entity, 'lent') ? 0.5 : 1);
            const duration = MOVE_DURATION / speedMultiplier;
            const elapsed = now - entity.moveStart;
            const t = Math.min(1, elapsed / duration);

            entity.x = entity.fromX + (entity.toX - entity.fromX) * t;
            entity.y = entity.fromY + (entity.toY - entity.fromY) * t;

            if (t >= 1) {
                entity.x = entity.toX;
                entity.y = entity.toY;
                entity.moving = false;
            }

            return true;
        }

        // Générer un ID unique
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        // Vérifier si une grille est accessible
        function isGridAccessible(gridX, gridY) {
            if (gridX < 0 || gridX >= GRID_SIZE || gridY < 0 || gridY >= GRID_SIZE) {
                return false;
            }
            
            return gameState.map[gridY][gridX] === TILE_TYPES.EMPTY && !isFlooded(gridX, gridY);
        }
        
        // Entités simulées par CET onglet : son joueur, plus l'IA en solo. En
        // multi, chaque onglet n'a autorité que sur les siennes (mort, bonus,
        // explosion de ses bombes) : les positions distantes ont du retard, et
        // si les deux onglets traitaient tout, chaque bombe explosait deux fois
        // et un joueur pouvait être tué sur une position déjà quittée.
        function localEntityIds() {
            const ids = [gameState.playerId];
            if (aiMode) ids.push(aiPlayerId);
            return ids;
        }

        // Vérifier si une case contient une bombe
        function hasBomb(gridX, gridY) {
            return gameState.bombs.some(bomb => bomb.x === gridX && bomb.y === gridY);
        }

        //--------------------------------------------------
        // MANCHES, SCORE ET MARÉE MONTANTE
        //--------------------------------------------------
        // Le match se joue en manches gagnantes. L'état est dans Firebase
        // (games/<salle>/match) : { round, scores, roundStart, roundOver,
        // lastWinner, matchWinner, roundsToWin, roundTime }.
        // Autorité : l'hôte (player1, donc aussi l'onglet solo) décide de la
        // fin de manche et lance la suivante ; les autres ne font qu'afficher.
        const DEFAULT_ROUNDS_TO_WIN = 3;
        const DEFAULT_ROUND_TIME = 90000;  // ms de jeu avant que la marée monte
        const TIDE_STEP_MS = 600;          // ms entre deux cases inondées sur un côté
        const TIDE_WARNING_MS = 1500;      // case qui clignote avant d'être inondée
        const ROUND_END_SETTLE = 500;      // attente avant de juger (double KO possible)
        const ROUND_PAUSE = 3200;          // pause entre deux manches

        // Réglages de test par l'URL du CRÉATEUR de la partie (?manches=1&maree=5),
        // recopiés dans l'état du match pour que tous les onglets les partagent
        function matchSettingsFromUrl() {
            const params = new URLSearchParams(location.search);
            const rounds = parseInt(params.get('manches'), 10);
            const tide = parseFloat(params.get('maree'));
            return {
                roundsToWin: rounds > 0 ? rounds : DEFAULT_ROUNDS_TO_WIN,
                roundTime: tide >= 0 ? tide * 1000 : DEFAULT_ROUND_TIME
            };
        }

        function newMatch(ids, startNow) {
            const scores = {};
            ids.forEach(id => { scores[id] = 0; });
            return {
                round: 1,
                scores,
                roundStart: startNow ? firebase.database.ServerValue.TIMESTAMP : null,
                roundOver: false,
                lastWinner: null,
                matchWinner: null,
                ...matchSettingsFromUrl()
            };
        }

        // Heure du serveur Firebase : la marée et le décompte sont calés
        // dessus pour que tous les onglets voient la même chose au même moment
        let serverOffset = 0;
        database.ref('.info/serverTimeOffset').on('value', s => { serverOffset = s.val() || 0; });
        function serverNow() {
            return Date.now() + serverOffset;
        }

        // Coins de départ
        const SPAWNS = {
            player1: [0, 0, '#ff6b6b'],
            player2: [GRID_SIZE - 1, GRID_SIZE - 1, '#4ecdc4'],
            [aiPlayerId]: [GRID_SIZE - 1, GRID_SIZE - 1, '#4ecdc4']
        };
        function spawnPlayer(id) {
            const [x, y, color] = SPAWNS[id];
            return createPlayer(x, y, color);
        }

        // Ordre d'inondation : anneau par anneau depuis le bord. Dans un
        // anneau, les 4 côtés avancent EN MÊME TEMPS depuis leur coin (sens
        // horaire) : les 4 coins de départ sont inondés au même instant, aucun
        // joueur n'est avantagé.
        const TIDE_STEPS = (() => {
            const steps = {};
            let base = 0;
            for (let r = 0; r <= Math.floor((GRID_SIZE - 1) / 2); r++) {
                const a = r, b = GRID_SIZE - 1 - r, len = b - a;
                if (len === 0) { steps[`${a},${a}`] = base; break; }
                for (let t = 0; t < len; t++) {
                    steps[`${a + t},${a}`] = base + t;  // haut, vers la droite
                    steps[`${b},${a + t}`] = base + t;  // droite, vers le bas
                    steps[`${b - t},${b}`] = base + t;  // bas, vers la gauche
                    steps[`${a},${b - t}`] = base + t;  // gauche, vers le haut
                }
                base += len;
            }
            return steps;
        })();

        function tideStart() {
            const m = gameState.match;
            if (!m || typeof m.roundStart !== 'number' || m.roundOver) return Infinity;
            return m.roundStart + COUNTDOWN_MS + m.roundTime;
        }
        function floodTime(x, y) {
            return tideStart() + TIDE_STEPS[`${x},${y}`] * TIDE_STEP_MS;
        }
        function isFlooded(x, y) {
            return serverNow() >= floodTime(x, y);
        }

        function matchIds() {
            const m = gameState.match;
            return m && m.scores ? Object.keys(m.scores) : [];
        }
        function isHost() {
            return gameState.playerId === 'player1';
        }
        function nameOf(id) {
            return (PLAYER_LABELS[id] || { name: id }).name;
        }
        function opponentOf(id) {
            return matchIds().find(other => other !== id);
        }
        function scoreText(m) {
            const me = gameState.playerId;
            return `${m.scores[me] || 0} à ${m.scores[opponentOf(me)] || 0}`;
        }

        function matchEndMessage(m) {
            const w = m.matchWinner;
            if (w === gameState.playerId) {
                return aiMode ? `Victoire - Vous avez battu l'IA ${scoreText(m)} !` : `Victoire - Vous avez gagné ${scoreText(m)} !`;
            }
            const who = w === aiPlayerId ? "L'IA" : 'Le ' + nameOf(w).toLowerCase();
            return `Défaite - ${who} a gagné ${scoreText(m)} !`;
        }
        function roundEndMessage(m) {
            if (!m.lastWinner) return `Égalité - personne ne marque (${scoreText(m)})`;
            const won = m.lastWinner === gameState.playerId;
            return `${won ? 'Manche gagnée' : 'Manche perdue'} - ${scoreText(m)}`;
        }

        let roundEndTimer = null;

        // Appelée à chaque image. Renvoie true quand le jeu doit être figé
        // (fin de manche, fin de match, adversaire parti).
        function checkGameOver() {
            if (!gameState.gameStarted || !gameState.match) return false;
            const m = gameState.match;
            const ids = matchIds();
            const endScreen = document.getElementById('gameControls');

            // La partie n'a démarré qu'avec tous les joueurs : si l'un manque
            // maintenant, c'est qu'il a quitté (onDisconnect)
            if (!aiMode && ids.some(id => !gameState.players[id])) {
                gameInfo.textContent = `L'adversaire a quitté la partie`;
                endScreen.style.display = 'block';
                return true;
            }
            if (m.matchWinner) {
                gameInfo.textContent = matchEndMessage(m);
                endScreen.style.display = 'block';
                return true;
            }
            if (m.roundOver) {
                gameInfo.textContent = roundEndMessage(m);
                return true;
            }

            const alive = ids.filter(id => gameState.players[id] && gameState.players[id].alive);
            if (alive.length <= 1 && isHost() && !roundEndTimer) {
                // Petit délai : deux joueurs pris dans la même explosion
                // meurent à quelques ms d'écart (chacun dans son onglet)
                roundEndTimer = setTimeout(finishRound, ROUND_END_SETTLE);
            }
            return false;
        }

        // Hôte : juge la manche, met à jour le score, lance la suivante
        function finishRound() {
            roundEndTimer = null;
            const m = gameState.match;
            if (!m || m.roundOver || m.matchWinner) return;
            const alive = matchIds().filter(id => gameState.players[id] && gameState.players[id].alive);
            if (alive.length > 1) return;

            const winner = alive.length === 1 ? alive[0] : null;
            const scores = { ...m.scores };
            if (winner) scores[winner] = (scores[winner] || 0) + 1;
            const matchWinner = winner && scores[winner] >= m.roundsToWin ? winner : null;
            log(`Fin de manche ${m.round} : ${winner || 'égalité'} - scores ${JSON.stringify(scores)}`);

            const roomId = gameState.roomId;
            database.ref(`games/${roomId}/match`).update({ roundOver: true, lastWinner: winner, scores, matchWinner });
            if (!matchWinner) {
                setTimeout(() => { if (gameState.roomId === roomId) startRound(false); }, ROUND_PAUSE);
            }
        }

        // Nouvelle manche (resetScores = revanche : nouveau match dans la même
        // salle). Écrit tout en une seule mise à jour pour que les onglets
        // voient la nouvelle carte et les joueurs au coin en même temps.
        function startRound(resetScores) {
            const m = gameState.match;
            if (!m || !gameState.roomId) return;
            const ids = matchIds();
            const players = {};
            const scores = {};
            ids.forEach(id => {
                players[id] = spawnPlayer(id);
                scores[id] = resetScores ? 0 : (m.scores[id] || 0);
            });
            database.ref(`games/${gameState.roomId}`).update({
                map: generateMap(),
                players,
                bombs: null,
                explosions: null,
                bonuses: null,
                match: {
                    ...m,
                    round: m.round + 1,
                    scores,
                    roundOver: false,
                    lastWinner: null,
                    matchWinner: null,
                    roundStart: firebase.database.ServerValue.TIMESTAMP
                }
            });
        }

        // Mettre à jour l'état du jeu
        function update() {
            if (!gameState.roomId || !gameState.playerId || !gameState.gameStarted) return;
            
            // Vérifier si le jeu est terminé
            if (checkGameOver()) return;
            
            const player = gameState.players[gameState.playerId];
            if (!player || !player.alive) return;

            const now = Date.now();

            // Démarrer un nouveau pas de grille si le joueur n'est pas déjà en train
            // d'en traverser un (une touche = une case, pas de mouvement libre)
            if (countdownActive()) {
                // décompte 3-2-1 : pas de déplacement
            } else if (gameState.keys['ArrowUp']) {
                stepEntityOnGrid(player, 0, -1, now);
            } else if (gameState.keys['ArrowDown']) {
                stepEntityOnGrid(player, 0, 1, now);
            } else if (gameState.keys['ArrowLeft']) {
                stepEntityOnGrid(player, -1, 0, now);
            } else if (gameState.keys['ArrowRight']) {
                stepEntityOnGrid(player, 1, 0, now);
            }

            // Faire avancer l'interpolation en cours (si le joueur est entre deux cases)
            const playerMoved = advanceEntityMovement(player, now);

            // Malus « bombes incontrôlables » : pose dès que possible
            if (hasMalus(player, 'diarrhee')) placeBomb();

            // Mettre à jour la position sur Firebase si le joueur a bougé
            // (throttlée pour ne pas envoyer une écriture réseau à chaque frame,
            // ce qui rendait le déplacement saccadé)
            // Toujours envoyer l'arrivée d'un pas (moving repasse à false) : sinon, si
            // elle tombe dans la fenêtre de throttle, l'autre onglet garde une
            // position à cheval entre deux cases jusqu'au mouvement suivant.
            if (playerMoved && (!player.moving || now - lastPositionSync >= POSITION_SYNC_INTERVAL)) {
                lastPositionSync = now;
                database.ref(`games/${gameState.roomId}/players/${gameState.playerId}`).update({
                    x: player.x,
                    y: player.y,
                    moving: player.moving,
                    fromX: player.fromX,
                    fromY: player.fromY,
                    toX: player.toX,
                    toY: player.toY,
                    moveStart: player.moveStart
                });
            }
            
            // Faire avancer l'interpolation de l'IA (elle décide toutes les
            // AI_MOVE_DELAY ms via startAI, mais doit avancer chaque frame comme
            // le joueur pour que sa vitesse affichée soit comparable)
            if (aiMode) {
                const aiPlayer = gameState.players[aiPlayerId];
                if (aiPlayer && aiPlayer.alive) {
                    const aiMoved = advanceEntityMovement(aiPlayer, now);
                    if (aiMoved && (!aiPlayer.moving || now - lastAiPositionSync >= POSITION_SYNC_INTERVAL)) {
                        lastAiPositionSync = now;
                        database.ref(`games/${gameState.roomId}/players/${aiPlayerId}`).update({
                            x: aiPlayer.x,
                            y: aiPlayer.y,
                            moving: aiPlayer.moving,
                            fromX: aiPlayer.fromX,
                            fromY: aiPlayer.fromY,
                            toX: aiPlayer.toX,
                            toY: aiPlayer.toY,
                            moveStart: aiPlayer.moveStart
                        });
                    }
                }
            }

            // Mettre à jour les explosions
            updateExplosions();

            // Les flammes tuent pendant toute leur durée, pas seulement à
            // l'instant de l'explosion (entrer dans une flamme active = mort)
            checkPlayersInFlames();

            // Purger d'éventuels bonus hérités d'anciennes parties (expireTime)
            updateBonuses();

            // Vérifier les bonus collectés
            checkBonusCollection();

            // Purger les textes flottants expirés (ex: "+1 Bombe" affiché à la
            // collecte d'un bonus)
            gameState.floatingTexts = gameState.floatingTexts.filter(
                ft => now - ft.startTime < FLOATING_TEXT_DURATION
            );
        }

        // Dessiner le jeu : la mer autour, puis le plateau décalé d'une
        // case (BOARD_MARGIN). Toute la logique de jeu reste en coordonnées
        // plateau (0..GRID_SIZE*TILE_SIZE) : seul le rendu est décalé.
        function render() {
            ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
            ctx.clearRect(0, 0, VIEW_SIZE, VIEW_SIZE);
            renderSea();

            const now = Date.now();
            ctx.save();
            ctx.translate(BOARD_MARGIN, BOARD_MARGIN);
            // Petite secousse à chaque explosion
            if (now < fx.shakeUntil) {
                ctx.translate((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);
            }
            if (!gameState.map || gameState.map.length === 0) {
                // Pas encore de partie : l'île vide, le menu est dans la page
                renderEmptyIsland();
            } else {
                renderBoard();
                renderParticles(now);
                renderDeaths(now);
            }
            ctx.restore();

            if (gameState.gameStarted) renderCountdown(now);
            renderRoundBanner();
        }

        // Entre deux manches : résultat de la manche et score, au centre
        function renderRoundBanner() {
            const m = gameState.match;
            if (!m || !m.roundOver || m.matchWinner || fx.deaths.length > 0) return;
            const title = !m.lastWinner ? 'Égalité' : (m.lastWinner === gameState.playerId ? 'Manche gagnée' : 'Manche perdue');
            ctx.save();
            ctx.translate(VIEW_SIZE / 2, VIEW_SIZE / 2);
            ctx.fillStyle = 'rgba(253, 241, 211, 0.95)';
            ctx.strokeStyle = '#dcb46e';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(-150, -62, 300, 124, 20);
            ctx.fill();
            ctx.stroke();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = !m.lastWinner ? '#8a5a2b' : (m.lastWinner === gameState.playerId ? '#2d7a2b' : '#d8611d');
            ctx.font = '34px Pacifico, cursive';
            ctx.fillText(title, 0, -18);
            ctx.fillStyle = '#3b2412';
            ctx.font = '700 20px "Baloo 2", sans-serif';
            ctx.fillText(`Score : ${scoreText(m)}`, 0, 30);
            ctx.restore();
        }

        // Mer : fond animé + une rangée de tuiles d'eau dont l'écume est
        // tournée vers l'île (le sprite a son écume sur le bord droit)
        function renderSea() {
            const now = Date.now();
            ctx.fillStyle = '#3ec6cf';
            ctx.fillRect(0, 0, VIEW_SIZE, VIEW_SIZE);
            if (!spritesReady()) return;

            const n = GRID_SIZE + 2;
            const half = TILE_SIZE / 2;
            // Léger ressac : l'écume avance et recule de 1,5 px
            const surf = Math.sin(now / 700) * 1.5;
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    const onEdge = i === 0 || j === 0 || i === n - 1 || j === n - 1;
                    if (!onEdge) continue;
                    const cx = i * TILE_SIZE + half;
                    const cy = j * TILE_SIZE + half;
                    const corner = (i === 0 || i === n - 1) && (j === 0 || j === n - 1);
                    if (corner) {
                        // Coin : eau seule (l'écume sort de la case, rognée)
                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(i * TILE_SIZE, j * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        ctx.clip();
                        drawSprite('water', cx + TILE_SIZE * 0.3, cy, TILE_SIZE * 1.6);
                        ctx.restore();
                        continue;
                    }
                    // Rotation pour que l'écume (côté droit du sprite) touche l'île
                    let rot = 0, ox = 0, oy = 0;
                    if (i === 0) { rot = 0; ox = surf; }
                    else if (i === n - 1) { rot = Math.PI; ox = -surf; }
                    else if (j === 0) { rot = Math.PI / 2; oy = surf; }
                    else { rot = -Math.PI / 2; oy = -surf; }
                    drawSprite('water', cx + ox, cy + oy, TILE_SIZE + 0.6, TILE_SIZE + 0.6, rot);
                }
            }
        }

        function renderEmptyIsland() {
            if (!spritesReady()) {
                ctx.fillStyle = '#f6dca3';
                ctx.fillRect(0, 0, GRID_SIZE * TILE_SIZE, GRID_SIZE * TILE_SIZE);
                return;
            }
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    drawSprite('sand', x * TILE_SIZE + TILE_SIZE / 2, y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE + 0.5);
                }
            }
        }

        // Cases inondées par la marée : eau pleine, liseré d'écume côté
        // île, et clignotement bleu sur les cases qui vont être englouties
        function renderTide() {
            if (tideStart() === Infinity) return;
            const now = serverNow();
            const T = TILE_SIZE;
            const flooded = (x, y) => x < 0 || y < 0 || x >= GRID_SIZE || y >= GRID_SIZE || now >= floodTime(x, y);
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const left = floodTime(x, y) - now;
                    if (left <= 0) {
                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(x * T, y * T, T, T);
                        ctx.clip();
                        if (spritesReady()) {
                            // sprite décalé pour garder l'écume (bord droit) hors de la case
                            drawSprite('water', x * T + T / 2 + T * 0.3, y * T + T / 2, T * 1.6);
                        } else {
                            ctx.fillStyle = '#3ec6cf';
                            ctx.fillRect(x * T, y * T, T, T);
                        }
                        ctx.restore();
                        // écume là où l'eau touche encore le sable
                        ctx.fillStyle = 'rgba(232, 251, 255, 0.85)';
                        const f = 3 + Math.sin(Date.now() / 300 + x + y) * 1;
                        if (!flooded(x, y - 1)) ctx.fillRect(x * T, y * T, T, f);
                        if (!flooded(x, y + 1)) ctx.fillRect(x * T, (y + 1) * T - f, T, f);
                        if (!flooded(x - 1, y)) ctx.fillRect(x * T, y * T, f, T);
                        if (!flooded(x + 1, y)) ctx.fillRect((x + 1) * T - f, y * T, f, T);
                    } else if (left < TIDE_WARNING_MS) {
                        const blink = 0.25 + 0.2 * Math.sin(Date.now() / 90);
                        ctx.fillStyle = `rgba(62, 198, 207, ${blink})`;
                        ctx.fillRect(x * T, y * T, T, T);
                    }
                }
            }
        }

        // Plateau de jeu (coordonnées plateau)
        function renderBoard() {
            // Dessiner la carte
            if (spritesReady()) renderMapSprites();
            else for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tileType = gameState.map[y][x];
                    const tileX = x * TILE_SIZE;
                    const tileY = y * TILE_SIZE;
                    
                    // Couleur selon le type de case
                    if (tileType === TILE_TYPES.WALL) {
                        // Mur solide (style palmier)
                        ctx.fillStyle = '#006633';
                    } else if (tileType === TILE_TYPES.BRICK) {
                        // Briques destructibles (tonneaux)
                        ctx.fillStyle = '#993300';
                    } else {
                        // Cases vides (sable)
                        ctx.fillStyle = '#f9e8b0';
                    }
                    
                    // Dessiner la case
                    ctx.fillRect(tileX, tileY, TILE_SIZE, TILE_SIZE);
                    
                    // Ajouter une bordure
                    ctx.strokeStyle = '#111';
                    ctx.strokeRect(tileX, tileY, TILE_SIZE, TILE_SIZE);
                    
                    // Ajouter des détails selon le type
                    if (tileType === TILE_TYPES.WALL) {
                        // Dessiner un petit palmier
                        ctx.fillStyle = '#004d00';
                        ctx.fillRect(tileX + 5, tileY + 15, 8, 12);
                        ctx.beginPath();
                        ctx.moveTo(tileX + 9, tileY + 15);
                        ctx.lineTo(tileX + 3, tileY + 5);
                        ctx.lineTo(tileX + 15, tileY + 8);
                        ctx.lineTo(tileX + 9, tileY + 15);
                        ctx.fill();
                    } else if (tileType === TILE_TYPES.BRICK) {
                        // Dessiner les lignes du tonneau
                        ctx.strokeStyle = '#cc6600';
                        ctx.beginPath();
                        ctx.moveTo(tileX, tileY + 10);
                        ctx.lineTo(tileX + TILE_SIZE, tileY + 10);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(tileX, tileY + 20);
                        ctx.lineTo(tileX + TILE_SIZE, tileY + 20);
                        ctx.stroke();
                    }
                }
            }
            
            // Dessiner les bonus
            renderBonuses();

            // Marée montante (recouvre les bonus engloutis)
            renderTide();
            
            // Dessiner les explosions
            renderExplosions();
            
            // Dessiner les bombes
            renderBombs();
            
            // Dessiner les joueurs (du haut vers le bas de l'écran, pour
            // qu'un personnage plus bas passe devant l'autre)
            const nowRender = Date.now();
            const visiblePlayers = Object.keys(gameState.players)
                .filter(id => gameState.players[id] && gameState.players[id].alive)
                .map(id => ({ id, pos: getDisplayPosition(id, gameState.players[id]) }))
                .sort((a, b) => a.pos.y - b.pos.y);
            if (spritesReady()) {
                for (const p of visiblePlayers) renderPlayerSprite(p.id, p.pos.x, p.pos.y, nowRender);
            } else for (const { id: playerId, pos } of visiblePlayers) {
                const rawPlayer = gameState.players[playerId];
                {
                    const playerData = { ...rawPlayer, ...pos };
                    // Fond du joueur
                    ctx.fillStyle = playerData.color;
                    ctx.beginPath();
                    ctx.arc(playerData.x, playerData.y, playerData.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Visage du personnage
                    ctx.fillStyle = 'white';
                    // Yeux
                    ctx.beginPath();
                    ctx.arc(playerData.x - 5, playerData.y - 3, 3, 0, Math.PI * 2);
                    ctx.arc(playerData.x + 5, playerData.y - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Pupilles
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(playerData.x - 5, playerData.y - 3, 1.5, 0, Math.PI * 2);
                    ctx.arc(playerData.x + 5, playerData.y - 3, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Sourire
                    ctx.beginPath();
                    ctx.arc(playerData.x, playerData.y + 2, 5, 0, Math.PI);
                    ctx.stroke();
                }
            }

            // Dessiner les textes flottants (ex: "+1 Bombe" à la collecte d'un bonus)
            renderFloatingTexts();
        }

        // Position à dessiner pour un joueur. Entités locales : position réelle.
        // Joueur distant : sa position n'arrive que toutes les
        // POSITION_SYNC_INTERVAL ms, l'afficher telle quelle le faisait avancer
        // par sauts. On fait glisser un point d'affichage vers la dernière
        // position reçue, à sa vitesse de marche (un peu plus vite pour
        // rattraper le retard), et on téléporte si l'écart est aberrant
        // (spawn, nouvelle partie). Purement visuel : aucune logique de jeu
        // ne lit ces positions (chaque onglet n'a autorité que sur les siennes).
        function getDisplayPosition(playerId, player) {
            if (localEntityIds().includes(playerId)) {
                return { x: player.x, y: player.y };
            }

            const now = performance.now();
            let d = remoteDisplay[playerId];
            const dx = player.x - (d ? d.x : player.x);
            const dy = player.y - (d ? d.y : player.y);
            const dist = Math.hypot(dx, dy);

            if (!d || dist > REMOTE_SNAP_DISTANCE) {
                d = remoteDisplay[playerId] = { x: player.x, y: player.y, t: now };
                return { x: d.x, y: d.y };
            }

            const speed = TILE_SIZE / (MOVE_DURATION / (player.speedMultiplier || 1)) * REMOTE_CATCHUP;
            const stepLen = Math.min(dist, speed * (now - d.t));
            if (dist > 0) {
                d.x += dx / dist * stepLen;
                d.y += dy / dist * stepLen;
            }
            d.t = now;
            return { x: d.x, y: d.y };
        }

        // Dessiner les textes flottants : montent et s'estompent avec le temps
        function renderFloatingTexts() {
            if (!gameState.floatingTexts || gameState.floatingTexts.length === 0) return;

            const now = Date.now();

            for (const ft of gameState.floatingTexts) {
                const elapsed = now - ft.startTime;
                const t = Math.min(1, elapsed / FLOATING_TEXT_DURATION);

                const riseOffset = 20 * t; // monte de 20px sur la durée
                const opacity = 1 - t;

                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.fillStyle = '#ffd700';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.font = 'bold 14px "Comic Sans MS"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeText(ft.text, ft.x, ft.y - riseOffset);
                ctx.fillText(ft.text, ft.x, ft.y - riseOffset);
                ctx.restore();
            }
        }

        //--------------------------------------------------
        // LOGIQUE DE L'IA AMÉLIORÉE
        //--------------------------------------------------

        // Démarrer la boucle de déplacement de l'IA
        function startAI() {
            // Éviter les doublons si l'IA était déjà démarrée
            if (aiMoveInterval) {
                clearInterval(aiMoveInterval);
            }

            aiMoveInterval = setInterval(() => {
                if (!aiMode || !gameState.gameStarted || countdownActive()) return;
                if (gameState.match && gameState.match.roundOver) return;

                const aiPlayer = gameState.players[aiPlayerId];
                if (!aiPlayer || !aiPlayer.alive) return;

                moveAI(aiPlayer);
            }, aiSettings().moveDelay);
        }

        // Déplacer l'IA - comportement reconstruit : décision de bombe et
        // décision de déplacement sont maintenant deux étapes indépendantes,
        // exécutées à chaque tick de décision (AI_MOVE_DELAY), qu'un pas de
        // grille soit en cours ou non.
        function moveAI(aiPlayer) {
            // Ne rien décider tant que l'IA est en train de traverser une case :
            // le pas en cours doit finir avant d'en démarrer un autre.
            if (aiPlayer.moving) return;

            // Obtenir la position actuelle de l'IA sur la grille
            const gridX = Math.floor(aiPlayer.x / TILE_SIZE);
            const gridY = Math.floor(aiPlayer.y / TILE_SIZE);

            // Ramasser un bonus présent sur la case actuelle
            const bonusHere = getBonusAt(gridX, gridY);
            if (bonusHere) {
                collectBonus(aiPlayerId, bonusHere);
                updateDebugInfo("Bonus collecté!");
            }

            // Directions possibles: haut, bas, gauche, droite
            const directions = [
                { dx: 0, dy: -1, name: 'haut' },
                { dx: 0, dy: 1, name: 'bas' },
                { dx: -1, dy: 0, name: 'gauche' },
                { dx: 1, dy: 0, name: 'droite' }
            ];

            // Filtrer les directions valides (sans obstacle, sans bombe)
            const validDirections = directions.filter(dir => {
                const newGridX = gridX + dir.dx;
                const newGridY = gridY + dir.dy;
                return isGridAccessible(newGridX, newGridY) && !hasBomb(newGridX, newGridY);
            });

            let nearbyBomb = isNearExplosion(gridX, gridY);

            //--------------------------------------------------
            // ÉTAPE 1 : décider de poser une bombe (indépendant du mouvement)
            //--------------------------------------------------
            // Ne jamais poser si on est déjà en train de fuir un danger, ou si
            // une bombe est déjà présente sous nos pieds.
            if (!nearbyBomb && !hasBomb(gridX, gridY)) {
                const placed = tryPlaceAIBomb(aiPlayer);
                // On vient de poser une bombe sous ses propres pieds : il faut
                // repasser en mode fuite dès ce tick-ci, pas attendre le
                // prochain cycle de décision 300ms plus tard.
                if (placed) {
                    nearbyBomb = true;
                }
            }

            //--------------------------------------------------
            // ÉTAPE 2 : décider de la direction de déplacement
            //--------------------------------------------------
            if (validDirections.length === 0) {
                updateDebugInfo("Bloqué");
                return;
            }

            let chosenDirection;

            // N'envisager que les directions qui ne mènent PAS dans une zone
            // dangereuse : sinon l'IA, une fois à l'abri, repart vers le joueur
            // en retraversant le rayon de sa propre bombe encore active.
            let safeDirections = validDirections.filter(dir =>
                !isCellDangerous(gridX + dir.dx, gridY + dir.dy)
            );
            // Hors niveau facile, elle contourne la noix de coco pourrie
            if (aiLevel !== 'facile') {
                const clean = safeDirections.filter(dir => {
                    const b = getBonusAt(gridX + dir.dx, gridY + dir.dy);
                    return !b || b.type !== BONUS_TYPES.MALUS;
                });
                if (clean.length > 0) safeDirections = clean;
            }

            // Priorité absolue : fuir si une bombe/explosion menace la case actuelle
            if (nearbyBomb) {
                // En fuite, traverser le RAYON d'une bombe pas encore explosée
                // est permis (c'est souvent la seule sortie), mais jamais une
                // flamme active : elle tue sur place.
                const fireFreeDirections = validDirections.filter(dir =>
                    !isCellOnFire(gridX + dir.dx, gridY + dir.dy)
                );
                if (fireFreeDirections.length === 0) {
                    updateDebugInfo("Coincé par les flammes");
                    return;
                }
                chosenDirection = getBestEscapeDirection(gridX, gridY, fireFreeDirections);
                updateDebugInfo("Fuite de bombe");
            } else if (safeDirections.length === 0) {
                // À l'abri, mais toute case adjacente est menacée : ne pas bouger,
                // attendre que la bombe explose plutôt que de jouer avec le feu.
                updateDebugInfo("Attend (à l'abri)");
                return;
            } else {
                // Sinon, aller chercher un bonus proche
                const nearestBonus = findNearestBonus(gridX, gridY);

                if (nearestBonus && nearestBonus.distance <= aiSettings().bonusRadius) {
                    safeDirections.sort((a, b) => {
                        const distA = Math.abs((gridX + a.dx) - nearestBonus.bonus.x) +
                                      Math.abs((gridY + a.dy) - nearestBonus.bonus.y);
                        const distB = Math.abs((gridX + b.dx) - nearestBonus.bonus.x) +
                                      Math.abs((gridY + b.dy) - nearestBonus.bonus.y);
                        return distA - distB;
                    });

                    chosenDirection = safeDirections[0];
                    updateDebugInfo("Vers bonus");
                } else {
                    // Comportement normal: se diriger vers le joueur humain
                    const player = gameState.players['player1'];

                    if (player && player.alive && Math.random() < aiSettings().wander) {
                        // Niveaux faciles : flâne de temps en temps au lieu de chasser
                        chosenDirection = safeDirections[Math.floor(Math.random() * safeDirections.length)];
                        updateDebugInfo("Flâne");
                    } else if (player && player.alive) {
                        // Éviter les mouvements d'aller-retour
                        const nonBacktrackingMoves = safeDirections.filter(dir =>
                            !(dir.dx === -aiLastMove.dx && dir.dy === -aiLastMove.dy)
                        );

                        const movesToConsider = nonBacktrackingMoves.length > 0 ?
                                               nonBacktrackingMoves : safeDirections;

                        // IA agressive : toujours foncer vers le joueur, jamais
                        // de fuite par timidité quand il est proche (l'ancien
                        // comportement "évite joueur" la rendait molle).
                        movesToConsider.sort((a, b) => {
                            const distA = Math.abs((gridX + a.dx) - Math.floor(player.x / TILE_SIZE)) +
                                         Math.abs((gridY + a.dy) - Math.floor(player.y / TILE_SIZE));
                            const distB = Math.abs((gridX + b.dx) - Math.floor(player.x / TILE_SIZE)) +
                                         Math.abs((gridY + b.dy) - Math.floor(player.y / TILE_SIZE));
                            return distA - distB;
                        });

                        // Toujours prendre la meilleure direction vers le joueur
                        // (plus d'aléatoire ici : elle ne doit plus temporiser)
                        chosenDirection = movesToConsider[0];

                        updateDebugInfo("Vers joueur");
                    } else {
                        // Si pas de joueur, déplacement aléatoire
                        chosenDirection = safeDirections[Math.floor(Math.random() * safeDirections.length)];
                        updateDebugInfo("Aléatoire");
                    }
                }
            }

            // Lancer le pas de grille dans la direction choisie (une case, comme le joueur)
            if (chosenDirection) {
                const started = stepEntityOnGrid(aiPlayer, chosenDirection.dx, chosenDirection.dy, Date.now());

                if (started) {
                    // Mémoriser le dernier mouvement pour éviter les aller-retours
                    aiLastMove = { dx: chosenDirection.dx, dy: chosenDirection.dy };
                }
            }
        }

        // Vérifier si l'IA est près d'une explosion imminente ou en cours.
        // Danger pris en compte dès qu'une bombe menace la case, quel que soit
        // son temps restant : avec un timer de 3s et une décision toutes les
        // 300ms, attendre la dernière seconde pour fuir ne laisse pas assez de
        // pas de grille pour sortir de la zone si le chemin est encombré.
        function isNearExplosion(gridX, gridY) {
            const dangerBombs = gameState.bombs.filter(bomb => {
                const distX = Math.abs(bomb.x - gridX);
                const distY = Math.abs(bomb.y - gridY);
                // Si dans la portée potentielle de la bombe (ligne ou colonne)
                return (distX <= bomb.range && distY === 0) ||
                       (distY <= bomb.range && distX === 0);
            });

            // Vérifier les explosions actives
            const inExplosion = gameState.explosions.some(explosion => {
                return explosion.cells.some(cell => cell.x === gridX && cell.y === gridY);
            });

            return dangerBombs.length > 0 || inExplosion || floodsSoon(gridX, gridY);
        }

        // La marée arrive sur cette case dans moins de AI_TIDE_MARGIN ms ?
        const AI_TIDE_MARGIN = 2500;
        function floodsSoon(x, y) {
            return floodTime(x, y) - serverNow() < AI_TIDE_MARGIN;
        }

        // Une case est-elle dans le rayon d'explosion d'une bombe, ou dans une
        // explosion active ? Utilisé pour écarter STRICTEMENT ces cases de la
        // fuite plutôt que de simplement les pénaliser par un score.
        function isCellDangerous(x, y) {
            if (floodsSoon(x, y)) return true;
            const inBombRange = gameState.bombs.some(bomb => {
                const distX = Math.abs(bomb.x - x);
                const distY = Math.abs(bomb.y - y);
                return (distX === 0 && distY <= bomb.range) ||
                       (distY === 0 && distX <= bomb.range);
            });
            if (inBombRange) return true;

            return gameState.explosions.some(explosion => {
                return explosion.cells.some(cell => cell.x === x && cell.y === y);
            });
        }

        // Obtenir la meilleure direction pour fuir un danger.
        // Un choix "gourmand" à 1 seule case ne suffit pas : avec bombRange >= 2,
        // toutes les cases adjacentes peuvent rester alignées avec la bombe
        // (même ligne/colonne), ce qui faisait tourner l'IA en boucle entre
        // quelques cases toujours dangereuses. On fait donc un BFS pour trouver
        // la case sûre la plus proche, puis on renvoie le premier pas du chemin.
        function getBestEscapeDirection(gridX, gridY, validDirections) {
            const directions = [
                { dx: 0, dy: -1 },
                { dx: 0, dy: 1 },
                { dx: -1, dy: 0 },
                { dx: 1, dy: 0 }
            ];

            const startKey = `${gridX},${gridY}`;
            const visited = new Set([startKey]);
            // Chaque entrée de la file mémorise le premier pas effectué depuis
            // le départ, pour pouvoir le renvoyer dès qu'on trouve une case sûre.
            let queue = validDirections.map(dir => ({
                x: gridX + dir.dx,
                y: gridY + dir.dy,
                firstStep: dir
            }));
            queue.forEach(node => visited.add(`${node.x},${node.y}`));

            const MAX_DEPTH = 12; // largement suffisant pour sortir d'une portée de bombe usuelle

            for (let depth = 0; depth < MAX_DEPTH && queue.length > 0; depth++) {
                for (const node of queue) {
                    if (!isCellDangerous(node.x, node.y)) {
                        return node.firstStep;
                    }
                }

                const nextQueue = [];
                for (const node of queue) {
                    for (const dir of directions) {
                        const nx = node.x + dir.dx;
                        const ny = node.y + dir.dy;
                        const key = `${nx},${ny}`;
                        if (visited.has(key)) continue;
                        if (!isGridAccessible(nx, ny) || hasBomb(nx, ny) || isCellOnFire(nx, ny)) continue;

                        visited.add(key);
                        nextQueue.push({ x: nx, y: ny, firstStep: node.firstStep });
                    }
                }
                queue = nextQueue;
            }

            // Aucune case sûre trouvée à portée de recherche : repli sur l'ancien
            // comportement (s'éloigner autant que possible de la bombe la plus proche).
            // Repère de debug : si ce message apparaît en boucle, c'est que
            // isCellDangerous() considère trop de cases comme dangereuses
            // (bombes/explosions fantômes jamais purgées de gameState).
            log(`IA fuite: aucune case sure trouvee depuis (${gridX},${gridY}) - ` +
                `bombes=${gameState.bombs.length} explosions=${gameState.explosions.length}`);

            const directionScores = validDirections.map(dir => {
                const newGridX = gridX + dir.dx;
                const newGridY = gridY + dir.dy;

                let minDistToBomb = Infinity;
                gameState.bombs.forEach(bomb => {
                    const dist = Math.abs(bomb.x - newGridX) + Math.abs(bomb.y - newGridY);
                    if (dist < minDistToBomb) minDistToBomb = dist;
                });

                return { direction: dir, score: minDistToBomb === Infinity ? 0 : minDistToBomb };
            });

            directionScores.sort((a, b) => b.score - a.score);

            return directionScores[0].direction;
        }

        // Trouver le bonus le plus proche
        function findNearestBonus(gridX, gridY) {
            let nearestBonus = null;
            let minDistance = Infinity;
            
            for (const bonus of gameState.bonuses) {
                if (bonus.type === BONUS_TYPES.MALUS) continue; // jamais un objectif
                const distance = Math.abs(bonus.x - gridX) + Math.abs(bonus.y - gridY);
                
                if (distance < minDistance) {
                    minDistance = distance;
                    nearestBonus = bonus;
                }
            }
            
            if (nearestBonus) {
                return {
                    bonus: nearestBonus,
                    distance: minDistance
                };
            }
            
            return null;
        }

        // L'IA place une bombe
        function tryPlaceAIBomb(aiPlayer) {
            // Obtenir la position de la grille
            const gridX = Math.floor(aiPlayer.x / TILE_SIZE);
            const gridY = Math.floor(aiPlayer.y / TILE_SIZE);
            
            // Vérifier si une bombe est déjà présente à cet endroit
            const bombsAtPosition = gameState.bombs.filter(bomb => 
                bomb.x === gridX && bomb.y === gridY
            );
            
            // Compte le nombre de bombes actives de l'IA
            const activeBombs = gameState.bombs.filter(bomb => 
                bomb.playerId === aiPlayerId
            );
            
            // Placer la bombe si possible
            if (bombsAtPosition.length === 0 && activeBombs.length < aiPlayer.maxBombs) {
                // Vérifier s'il est stratégique de poser une bombe ici
                const isStrategic = isStrategicToBomb(gridX, gridY, aiPlayer.bombRange);
                if (!isStrategic) return false;

                // Vérifier qu'une vraie case sûre est atteignable avant l'explosion
                const hasEscape = hasEscapeRoute(gridX, gridY, aiPlayer.bombRange);
                if (!hasEscape) return false;

                // Chance de base de poser la bombe même quand c'est stratégique,
                // pour ne pas être 100% déterministe/prévisible
                if (Math.random() > aiSettings().bombChance) return false;

                // Créer la référence d'abord pour connaître la vraie clé Firebase
                const bombRef = database.ref(`games/${gameState.roomId}/bombs`).push();
                // L'IA garde toujours une mèche normale (même avec le
                // détonateur) : toute sa logique de fuite repose sur le délai
                const newBomb = {
                    id: bombRef.key,
                    playerId: aiPlayerId,
                    x: gridX,
                    y: gridY,
                    range: aiPlayer.bombRange,
                    pierce: !!aiPlayer.pierce,
                    timer: Date.now() + BOMB_TIMER
                };

                // Ajouter la bombe à Firebase avec son id qui correspond à la clé Firebase
                bombRef.set(newBomb);
                updateDebugInfo("Bombe posée");
                return true;
            }
            
            return false;
        }

        // Vérifier s'il est stratégique de poser une bombe (utilise la vraie
        // portée de l'IA, pas une valeur fixe, pour rester cohérent avec les
        // bonus de puissance ramassés)
        function isStrategicToBomb(gridX, gridY, bombRange) {
            // Si près du joueur et dans la portée réelle de la bombe, c'est stratégique
            const player = gameState.players['player1'];
            if (player && player.alive) {
                const playerGridX = Math.floor(player.x / TILE_SIZE);
                const playerGridY = Math.floor(player.y / TILE_SIZE);

                const distX = Math.abs(playerGridX - gridX);
                const distY = Math.abs(playerGridY - gridY);

                if ((distX === 0 && distY <= bombRange) || (distY === 0 && distX <= bombRange)) {
                    return true;
                }
            }

            // Si des briques peuvent être détruites, c'est aussi stratégique
            const directions = [
                { dx: 0, dy: -1 }, // haut
                { dx: 0, dy: 1 },  // bas
                { dx: -1, dy: 0 }, // gauche
                { dx: 1, dy: 0 }   // droite
            ];

            return directions.some(dir => {
                const x = gridX + dir.dx;
                const y = gridY + dir.dy;

                return (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE &&
                       gameState.map[y][x] === TILE_TYPES.BRICK);
            });
        }

        // Vérifier qu'une vraie case sûre (hors de portée de TOUTE bombe, y
        // compris celle qu'on s'apprête à poser) est atteignable depuis
        // (gridX, gridY). Une simple case adjacente libre ne suffit pas : avec
        // bombRange >= 2 elle peut rester alignée avec la bombe. On simule la
        // bombe à poser et on réutilise le même BFS que la fuite réelle.
        function hasEscapeRoute(gridX, gridY, bombRange) {
            const simulatedBomb = { x: gridX, y: gridY, range: bombRange };
            const bombsBackup = gameState.bombs;
            gameState.bombs = [...bombsBackup, simulatedBomb];

            try {
                const directions = [
                    { dx: 0, dy: -1 },
                    { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 },
                    { dx: 1, dy: 0 }
                ];

                const visited = new Set([`${gridX},${gridY}`]);
                let queue = [{ x: gridX, y: gridY }];

                for (let depth = 0; depth < aiEscapeMaxSteps() && queue.length > 0; depth++) {
                    const nextQueue = [];
                    for (const node of queue) {
                        for (const dir of directions) {
                            const nx = node.x + dir.dx;
                            const ny = node.y + dir.dy;
                            const key = `${nx},${ny}`;
                            if (visited.has(key)) continue;
                            if (!isGridAccessible(nx, ny)) continue;
                            // Les flammes actives tuent : pas de chemin à travers
                            if (isCellOnFire(nx, ny)) continue;
                            // On ignore la bombe simulée elle-même pour le blocage de case
                            if (hasBomb(nx, ny) && !(nx === gridX && ny === gridY)) continue;

                            if (!isCellDangerous(nx, ny)) {
                                return true;
                            }

                            visited.add(key);
                            nextQueue.push({ x: nx, y: ny });
                        }
                    }
                    queue = nextQueue;
                }

                return false;
            } finally {
                gameState.bombs = bombsBackup;
            }
        }

        // Mettre à jour les infos de debug
        function updateDebugInfo(action = "") {
            if (!debugDiv) return;
            
            // Mettre à jour l'action de l'IA
            const aiActionSpan = document.getElementById('aiAction');
            if (aiActionSpan) {
                aiActionSpan.textContent = action;
            }

            const aiForHistory = gameState.players && gameState.players[aiPlayerId];
            if (action && aiForHistory) {
                aiHistory.push(`${new Date().toISOString().slice(17, 23)}s ` +
                    `(${Math.floor(aiForHistory.x / TILE_SIZE)},${Math.floor(aiForHistory.y / TILE_SIZE)}) ${action}`);
                if (aiHistory.length > AI_HISTORY_SIZE) aiHistory.shift();
            }
            
            // Mettre à jour les positions et stats
            if (gameState.players) {
                // IA
                const ai = gameState.players[aiPlayerId];
                if (ai) {
                    const aiGridX = Math.floor(ai.x / TILE_SIZE);
                    const aiGridY = Math.floor(ai.y / TILE_SIZE);
                    
                    const aiGridXSpan = document.getElementById('aiGridX');
