<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Bomber</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        /* Styles pour le jeu Island Bomber */
        body {
            background: linear-gradient(135deg, #0099cc, #006699);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            color: white;
            background-image: url('https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/svg/palm-tree.svg');
            background-repeat: repeat;
            background-size: 100px;
            background-blend-mode: soft-light;
        }

        #gameContainer {
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border: 3px solid #ffd700;
        }

        canvas {
            border: 4px solid #ffd700;
            background-color: #f9e8b0; /* Sand color */
            image-rendering: pixelated;
            border-radius: 8px;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 36px;
            color: #ffd700; /* Gold color for reggae vibe */
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #000, 4px 4px 0px #006699;
            font-weight: bold;
        }

        #roomControls {
            margin: 20px 0;
            padding: 15px;
            background-color: rgba(34, 139, 34, 0.7); /* Forest green with opacity */
            border-radius: 10px;
            border: 2px dashed #ffd700;
        }

        button {
            background: linear-gradient(to bottom, #ff9900, #ff6600);
            color: white;
            border: none;
            padding: 10px 18px;
            margin: 0 8px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #cc5200;
            transition: all 0.2s;
        }

        button:hover {
            background: linear-gradient(to bottom, #ffaa33, #ff7722);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #cc5200;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cc5200;
        }

        input {
            background-color: #ffe6cc;
            color: #663300;
            border: 2px solid #ff9900;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 14px;
            width: 150px;
        }

        input::placeholder {
            color: #cc8800;
        }

        /* Styles pour les explosions */
        .explosion-animation {
            position: absolute;
            background-color: rgba(255, 165, 0, 0.7);
            border-radius: 50%;
            animation: explode 0.5s ease-out;
        }

        @keyframes explode {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .gameButton {
            background: linear-gradient(to bottom, #ff9900, #ff6600);
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            margin: 8px;
            cursor: pointer;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            box-shadow: 0 4px 0 #cc5200;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gameButton:hover {
            background: linear-gradient(to bottom, #ffaa33, #ff7722);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #cc5200;
        }

        .gameButton:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #cc5200;
        }

        #gameInfo {
            background-color: rgba(255, 215, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 1px 1px 0px #000;
            letter-spacing: 1px;
        }

        /* Styles pour les bonus */
        .bonus {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.1); }
        }

        /* Styles pour le panneau de debug (optionnel) */
        #debug {
            display: none;
            margin-top: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            text-align: left;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>Island Bomber</h1>
        
        <div id="roomControls">
            <input type="text" id="roomInput" placeholder="Code de partie">
            <button id="createBtn">Créer partie</button>
            <button id="joinBtn">Rejoindre partie</button>
            <button id="singlePlayerBtn">Affronter le Pirate IA</button>
        </div>
        
        <div id="gameInfo">Bienvenue sur l'île ! Prêt à exploser des noix de coco ?</div>
        <canvas id="gameCanvas" width="480" height="480"></canvas>
    </div>

    <div id="gameControls" style="display: none; margin-top: 10px;">
        <button id="restartBtn" class="gameButton">Nouvelle Partie</button>
        <button id="homeBtn" class="gameButton">Retour à l'île</button>
    </div>

    <!-- Optionnel: Panneau de debug -->
    <div id="debug" style="display: none;">
        <div>IA - Position: <span id="aiGridX">0</span>, <span id="aiGridY">0</span> | Bombes: <span id="aiBombs">1</span> | Puissance: <span id="aiPower">2</span></div>
        <div>Joueur - Position: <span id="playerGridX">0</span>, <span id="playerGridY">0</span> | Bombes: <span id="playerBombs">1</span> | Puissance: <span id="playerPower">2</span></div>
        <div>Action IA: <span id="aiAction">-</span></div>
    </div>

    <!-- Import Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.9.0/firebase-app-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.9.0/firebase-database-compat.js"></script>

    <script>
        // Ajout d'un système de journalisation simple
        function log(message) {
            console.log(`[${new Date().toISOString()}] ${message}`);
        }

        log("Script démarré");

        //--------------------------------------------------
        // CONFIGURATION DU JEU
        //--------------------------------------------------
        const GRID_SIZE = 15;
        const TILE_SIZE = 32;

        // Déplacement case par case (grille classique). MOVE_DURATION = temps
        // pour traverser une case à vitesse normale (speedMultiplier = 1).
        const MOVE_DURATION = 200; // ms par case

        // Définir les types de cases
        const TILE_TYPES = {
            EMPTY: 0,  // Sable
            WALL: 1,   // Palmiers
            BRICK: 2   // Tonneaux
        };

        // Configuration des bombes
        const BOMB_TIMER = 3000; // Délai avant explosion (ms)
        const EXPLOSION_DURATION = 1000; // Durée d'affichage de l'explosion (ms)
        const BOMB_OWNER_GRACE = 500; // Retard toléré avant qu'un autre onglet explose la bombe à la place de son propriétaire (ms)

        // Configuration de l'IA
        const AI_MOVE_DELAY = 200; // Délai entre les décisions de l'IA (ms) - aligné sur MOVE_DURATION pour réagir dès qu'un pas se termine
        const AI_BOMB_PROBABILITY = 0.6; // Probabilité de poser une bombe stratégique (agressive)
        // Nombre de pas que l'IA peut GARANTIR avant l'explosion de sa bombe.
        // Pire cas par pas : la case se traverse en MOVE_DURATION, mais le tick
        // de décision suivant peut tomber juste avant la fin du pas → un tick
        // perdu. L'ancien BFS acceptait 12 pas, impossibles à faire en 3s.
        const AI_ESCAPE_MAX_STEPS = Math.floor(
            (BOMB_TIMER - AI_MOVE_DELAY) / (MOVE_DURATION + AI_MOVE_DELAY)
        ); // = 7

        // Champs de déplacement gérés localement pour les entités simulées dans
        // cet onglet (jamais réécrits par le retour Firebase, voir joinGame)
        const LOCAL_MOVEMENT_KEYS = ['x', 'y', 'moving', 'fromX', 'fromY', 'toX', 'toY', 'moveStart'];

        // Fréquence d'envoi de la position du joueur vers Firebase (ms).
        // On bouge localement à chaque frame, mais on ne synchronise le réseau
        // qu'à cet intervalle pour éviter un déplacement saccadé.
        const POSITION_SYNC_INTERVAL = 100;
        let lastPositionSync = 0;
        let lastAiPositionSync = 0;

        // Configuration des bonus
        const BONUS_PROBABILITY = 0.5; // 50% de chance qu'un tonneau détruit laisse un bonus
        const BONUS_DURATION = 15000; // Les bonus restent 15 secondes sur la carte

        // Types de bonus
        const BONUS_TYPES = {
            BOMB: 0,    // Bombe supplémentaire
            POWER: 1,   // Augmente la portée des bombes
            SPEED: 2    // Augmente la vitesse de déplacement
        };

        // Configuration Firebase
        // databaseURL explicite obligatoire : la base vit en europe-west1, pas
        // dans la région US par défaut que le SDK devine depuis projectId seul.
        // Sans cette ligne, le SDK affiche un warning et le comportement de
        // secours dépend de la version du SDK — les écritures peuvent échouer
        // silencieusement plutôt que d'être redirigées vers la bonne région.
        const firebaseConfig = {
            apiKey: "AIzaSyDEDfD0gETLAra2wu9e0V8YVECdshVWAEc",
            authDomain: "bomberman-10e44.firebaseapp.com",
            databaseURL: "https://bomberman-10e44-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bomberman-10e44",
            storageBucket: "bomberman-10e44.firebasestorage.app",
            messagingSenderId: "734188613745",
            appId: "1:734188613745:web:96b85d282821b3613d2bd0"
        };

        // Initialiser Firebase
        log("Initialisation de Firebase");
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // État du jeu global
        const gameState = {
            roomId: null,
            playerId: null,
            map: [],
            players: {},
            bombs: [],
            explosions: [],
            bonuses: [],
            gameStarted: false,
            keys: {},
            lastKeys: {}, // Pour détecter les nouvelles pressions
            aiActive: true,
            // Textes flottants affichés localement (ex: nom du bonus ramassé).
            // Purement visuel, jamais synchronisé sur Firebase.
            floatingTexts: []
        };

        // Libellés affichés quand un bonus est ramassé
        const BONUS_LABELS = {
            0: '+1 Bombe',      // BONUS_TYPES.BOMB
            1: '+1 Puissance',  // BONUS_TYPES.POWER
            2: '+Vitesse'       // BONUS_TYPES.SPEED
        };
        const FLOATING_TEXT_DURATION = 1200; // ms

        // Variables de l'IA
        let aiMode = false;
        let aiPlayerId = 'playerAI';
        let aiMoveInterval;
        let aiLastMove = { dx: 0, dy: 0 };
        // Repère de debug : dernières décisions de l'IA (case + action), vidées
        // dans la console à la mort d'un joueur pour comprendre comment c'est arrivé
        const AI_HISTORY_SIZE = 15;
        let aiHistory = [];
        let aiLastTargetUpdate = 0;

        // Références DOM
        log("Récupération des références DOM");
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameInfo = document.getElementById('gameInfo');
        const roomInput = document.getElementById('roomInput');
        const debugDiv = document.getElementById('debug');

        //--------------------------------------------------
        // FONCTIONS DE BASE DU JEU
        //--------------------------------------------------

        // Générer une carte aléatoire avec des chemins garantis
        function generateMap() {
            const map = [];
            
            // Initialiser la carte avec des murs fixes et le reste vide
            for (let y = 0; y < GRID_SIZE; y++) {
                const row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (x % 2 === 0 && y % 2 === 0) {
                        // Murs fixes qui ne peuvent pas être détruits (palmiers)
                        row.push(TILE_TYPES.WALL);
                    } else {
                        // Tout le reste est vide au départ (sable)
                        row.push(TILE_TYPES.EMPTY);
                    }
                }
                map.push(row);
            }
            
            // Garantir des zones de départ vides pour les joueurs
            // Pour le joueur 1 (coin supérieur gauche)
            map[0][0] = TILE_TYPES.EMPTY;
            map[0][1] = TILE_TYPES.EMPTY;
            map[1][0] = TILE_TYPES.EMPTY;
            
            // Pour l'IA ou le joueur 2 (coin inférieur droit)
            map[GRID_SIZE-1][GRID_SIZE-1] = TILE_TYPES.EMPTY;
            map[GRID_SIZE-1][GRID_SIZE-2] = TILE_TYPES.EMPTY;
            map[GRID_SIZE-2][GRID_SIZE-1] = TILE_TYPES.EMPTY;
            
            // Ajouter des briques destructibles de manière aléatoire (tonneaux)
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Si c'est un emplacement vide (pas un palmier) et pas dans les zones de départ
                    if (map[y][x] === TILE_TYPES.EMPTY && 
                        !((x <= 1 && y <= 1) || (x >= GRID_SIZE-2 && y >= GRID_SIZE-2))) {
                        
                        // Probabilité de 60% d'avoir un tonneau
                        if (Math.random() < 0.6) {
                            map[y][x] = TILE_TYPES.BRICK;
                        }
                    }
                }
            }
            
            // Garantir un chemin entre le coin supérieur gauche et le coin inférieur droit
            
            // Chemin horizontal
            for (let x = 2; x < GRID_SIZE - 2; x += 2) {
                map[1][x] = TILE_TYPES.EMPTY;
            }
            
            // Chemin vertical
            for (let y = 3; y < GRID_SIZE - 1; y += 2) {
                map[y][GRID_SIZE - 2] = TILE_TYPES.EMPTY;
            }
            
            return map;
        }

        // Créer un joueur
        function createPlayer(x, y, color) {
            const px = x * TILE_SIZE + TILE_SIZE / 2;
            const py = y * TILE_SIZE + TILE_SIZE / 2;
            return {
                x: px,
                y: py,
                radius: TILE_SIZE / 2 - 4,
                color: color,
                maxBombs: 1,
                bombRange: 2,
                speedMultiplier: 1,
                alive: true,
                // État de déplacement grille : tant que moving = true, l'entité
                // interpole de (fromX,fromY) vers (toX,toY), sans pouvoir dévier.
                moving: false,
                fromX: px,
                fromY: py,
                toX: px,
                toY: py,
                moveStart: 0
            };
        }

        // Avancer une entité d'une case dans la direction (dx, dy), en grille.
        // Ne fait rien si l'entité est déjà en train de se déplacer entre deux
        // cases, ou si la case cible n'est pas libre. `now` = Date.now() courant.
        function stepEntityOnGrid(entity, dx, dy, now) {
            if (entity.moving) return false;
            if (dx === 0 && dy === 0) return false;

            const gridX = Math.floor(entity.x / TILE_SIZE);
            const gridY = Math.floor(entity.y / TILE_SIZE);
            const targetGridX = gridX + dx;
            const targetGridY = gridY + dy;

            if (!isGridAccessible(targetGridX, targetGridY) || hasBomb(targetGridX, targetGridY)) {
                return false;
            }

            entity.moving = true;
            entity.fromX = entity.x;
            entity.fromY = entity.y;
            entity.toX = targetGridX * TILE_SIZE + TILE_SIZE / 2;
            entity.toY = targetGridY * TILE_SIZE + TILE_SIZE / 2;
            entity.moveStart = now;
            return true;
        }

        // Faire progresser l'interpolation de mouvement d'une entité. Renvoie
        // true si la position a changé (donc à synchroniser sur Firebase).
        function advanceEntityMovement(entity, now) {
            if (!entity.moving) return false;

            const speedMultiplier = entity.speedMultiplier || 1;
            const duration = MOVE_DURATION / speedMultiplier;
            const elapsed = now - entity.moveStart;
            const t = Math.min(1, elapsed / duration);

            entity.x = entity.fromX + (entity.toX - entity.fromX) * t;
            entity.y = entity.fromY + (entity.toY - entity.fromY) * t;

            if (t >= 1) {
                entity.x = entity.toX;
                entity.y = entity.toY;
                entity.moving = false;
            }

            return true;
        }

        // Générer un ID unique
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        // Vérifier si une grille est accessible
        function isGridAccessible(gridX, gridY) {
            if (gridX < 0 || gridX >= GRID_SIZE || gridY < 0 || gridY >= GRID_SIZE) {
                return false;
            }
            
            return gameState.map[gridY][gridX] === TILE_TYPES.EMPTY;
        }
        
        // Entités simulées par CET onglet : son joueur, plus l'IA en solo. En
        // multi, chaque onglet n'a autorité que sur les siennes (mort, bonus,
        // explosion de ses bombes) : les positions distantes ont du retard, et
        // si les deux onglets traitaient tout, chaque bombe explosait deux fois
        // et un joueur pouvait être tué sur une position déjà quittée.
        function localEntityIds() {
            const ids = [gameState.playerId];
            if (aiMode) ids.push(aiPlayerId);
            return ids;
        }

        // Vérifier si une case contient une bombe
        function hasBomb(gridX, gridY) {
            return gameState.bombs.some(bomb => bomb.x === gridX && bomb.y === gridY);
        }

        // Vérifier fin de partie
        function checkGameOver() {
            if (!gameState.gameStarted) return false;
            
            // En mode IA
            if (aiMode) {
                const player = gameState.players['player1'];
                const ai = gameState.players[aiPlayerId];
                
                // Si le joueur est mort
                if (player && !player.alive) {
                    if (aiMoveInterval) clearInterval(aiMoveInterval);
                    gameInfo.textContent = `Game Over - Le pirate a gagné !`;
                    document.getElementById('gameControls').style.display = 'block';
                    return true;
                }
                
                // Si l'IA est morte
                if (ai && !ai.alive) {
                    if (aiMoveInterval) clearInterval(aiMoveInterval);
                    gameInfo.textContent = `Victoire - Vous avez battu le pirate !`;
                    document.getElementById('gameControls').style.display = 'block';
                    return true;
                }
            } 
            // En mode multijoueur
            else {
                const player1 = gameState.players['player1'];
                const player2 = gameState.players['player2'];
                
                // Si les deux joueurs sont présents et que l'un est mort
                if (player1 && player2) {
                    if (!player1.alive) {
                        gameInfo.textContent = gameState.playerId === 'player1' ? 
                            `Game Over - Le Surfeur Bleu a gagné !` : 
                            `Victoire - Vous avez gagné !`;
                        document.getElementById('gameControls').style.display = 'block';
                        return true;
                    }
                    
                    if (!player2.alive) {
                        gameInfo.textContent = gameState.playerId === 'player2' ? 
                            `Game Over - Le Rasta Rouge a gagné !` : 
                            `Victoire - Vous avez gagné !`;
                        document.getElementById('gameControls').style.display = 'block';
                        return true;
                    }
                }
            }
            
            return false;
        }

        // Mettre à jour l'état du jeu
        function update() {
            if (!gameState.roomId || !gameState.playerId || !gameState.gameStarted) return;
            
            // Vérifier si le jeu est terminé
            if (checkGameOver()) return;
            
            const player = gameState.players[gameState.playerId];
            if (!player || !player.alive) return;

            const now = Date.now();

            // Démarrer un nouveau pas de grille si le joueur n'est pas déjà en train
            // d'en traverser un (une touche = une case, pas de mouvement libre)
            if (gameState.keys['ArrowUp']) {
                stepEntityOnGrid(player, 0, -1, now);
            } else if (gameState.keys['ArrowDown']) {
                stepEntityOnGrid(player, 0, 1, now);
            } else if (gameState.keys['ArrowLeft']) {
                stepEntityOnGrid(player, -1, 0, now);
            } else if (gameState.keys['ArrowRight']) {
                stepEntityOnGrid(player, 1, 0, now);
            }

            // Faire avancer l'interpolation en cours (si le joueur est entre deux cases)
            const playerMoved = advanceEntityMovement(player, now);

            // Mettre à jour la position sur Firebase si le joueur a bougé
            // (throttlée pour ne pas envoyer une écriture réseau à chaque frame,
            // ce qui rendait le déplacement saccadé)
            if (playerMoved && now - lastPositionSync >= POSITION_SYNC_INTERVAL) {
                lastPositionSync = now;
                database.ref(`games/${gameState.roomId}/players/${gameState.playerId}`).update({
                    x: player.x,
                    y: player.y,
                    moving: player.moving,
                    fromX: player.fromX,
                    fromY: player.fromY,
                    toX: player.toX,
                    toY: player.toY,
                    moveStart: player.moveStart
                });
            }
            
            // Faire avancer l'interpolation de l'IA (elle décide toutes les
            // AI_MOVE_DELAY ms via startAI, mais doit avancer chaque frame comme
            // le joueur pour que sa vitesse affichée soit comparable)
            if (aiMode) {
                const aiPlayer = gameState.players[aiPlayerId];
                if (aiPlayer && aiPlayer.alive) {
                    const aiMoved = advanceEntityMovement(aiPlayer, now);
                    if (aiMoved && now - lastAiPositionSync >= POSITION_SYNC_INTERVAL) {
                        lastAiPositionSync = now;
                        database.ref(`games/${gameState.roomId}/players/${aiPlayerId}`).update({
                            x: aiPlayer.x,
                            y: aiPlayer.y,
                            moving: aiPlayer.moving,
                            fromX: aiPlayer.fromX,
                            fromY: aiPlayer.fromY,
                            toX: aiPlayer.toX,
                            toY: aiPlayer.toY,
                            moveStart: aiPlayer.moveStart
                        });
                    }
                }
            }

            // Mettre à jour les explosions
            updateExplosions();

            // Les flammes tuent pendant toute leur durée, pas seulement à
            // l'instant de l'explosion (entrer dans une flamme active = mort)
            checkPlayersInFlames();

            // Mettre à jour les bonus (expiration)
            updateBonuses();

            // Vérifier les bonus collectés
            checkBonusCollection();

            // Purger les textes flottants expirés (ex: "+1 Bombe" affiché à la
            // collecte d'un bonus)
            gameState.floatingTexts = gameState.floatingTexts.filter(
                ft => now - ft.startTime < FLOATING_TEXT_DURATION
            );
        }

        // Dessiner le jeu
        function render() {
            // Effacer le canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Si pas de jeu en cours, afficher un écran d'attente
            if (!gameState.map || gameState.map.length === 0) {
                ctx.fillStyle = '#006699';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '16px "Comic Sans MS"';
                ctx.textAlign = 'center';
                ctx.fillText('En attente de la création/connexion à une partie...', canvas.width/2, canvas.height/2);
                return;
            }
            
            // Dessiner la carte
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tileType = gameState.map[y][x];
                    const tileX = x * TILE_SIZE;
                    const tileY = y * TILE_SIZE;
                    
                    // Couleur selon le type de case
                    if (tileType === TILE_TYPES.WALL) {
                        // Mur solide (style palmier)
                        ctx.fillStyle = '#006633';
                    } else if (tileType === TILE_TYPES.BRICK) {
                        // Briques destructibles (tonneaux)
                        ctx.fillStyle = '#993300';
                    } else {
                        // Cases vides (sable)
                        ctx.fillStyle = '#f9e8b0';
                    }
                    
                    // Dessiner la case
                    ctx.fillRect(tileX, tileY, TILE_SIZE, TILE_SIZE);
                    
                    // Ajouter une bordure
                    ctx.strokeStyle = '#111';
                    ctx.strokeRect(tileX, tileY, TILE_SIZE, TILE_SIZE);
                    
                    // Ajouter des détails selon le type
                    if (tileType === TILE_TYPES.WALL) {
                        // Dessiner un petit palmier
                        ctx.fillStyle = '#004d00';
                        ctx.fillRect(tileX + 5, tileY + 15, 8, 12);
                        ctx.beginPath();
                        ctx.moveTo(tileX + 9, tileY + 15);
                        ctx.lineTo(tileX + 3, tileY + 5);
                        ctx.lineTo(tileX + 15, tileY + 8);
                        ctx.lineTo(tileX + 9, tileY + 15);
                        ctx.fill();
                    } else if (tileType === TILE_TYPES.BRICK) {
                        // Dessiner les lignes du tonneau
                        ctx.strokeStyle = '#cc6600';
                        ctx.beginPath();
                        ctx.moveTo(tileX, tileY + 10);
                        ctx.lineTo(tileX + TILE_SIZE, tileY + 10);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(tileX, tileY + 20);
                        ctx.lineTo(tileX + TILE_SIZE, tileY + 20);
                        ctx.stroke();
                    }
                }
            }
            
            // Dessiner les bonus
            renderBonuses();
            
            // Dessiner les explosions
            renderExplosions();
            
            // Dessiner les bombes
            renderBombs();
            
            // Dessiner les joueurs
            for (const playerId in gameState.players) {
                const playerData = gameState.players[playerId];
                if (playerData && playerData.alive) {
                    // Fond du joueur
                    ctx.fillStyle = playerData.color;
                    ctx.beginPath();
                    ctx.arc(playerData.x, playerData.y, playerData.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Visage du personnage
                    ctx.fillStyle = 'white';
                    // Yeux
                    ctx.beginPath();
                    ctx.arc(playerData.x - 5, playerData.y - 3, 3, 0, Math.PI * 2);
                    ctx.arc(playerData.x + 5, playerData.y - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Pupilles
                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(playerData.x - 5, playerData.y - 3, 1.5, 0, Math.PI * 2);
                    ctx.arc(playerData.x + 5, playerData.y - 3, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Sourire
                    ctx.beginPath();
                    ctx.arc(playerData.x, playerData.y + 2, 5, 0, Math.PI);
                    ctx.stroke();
                }
            }

            // Dessiner les textes flottants (ex: "+1 Bombe" à la collecte d'un bonus)
            renderFloatingTexts();
        }

        // Dessiner les textes flottants : montent et s'estompent avec le temps
        function renderFloatingTexts() {
            if (!gameState.floatingTexts || gameState.floatingTexts.length === 0) return;

            const now = Date.now();

            for (const ft of gameState.floatingTexts) {
                const elapsed = now - ft.startTime;
                const t = Math.min(1, elapsed / FLOATING_TEXT_DURATION);

                const riseOffset = 20 * t; // monte de 20px sur la durée
                const opacity = 1 - t;

                ctx.save();
                ctx.globalAlpha = opacity;
                ctx.fillStyle = '#ffd700';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.font = 'bold 14px "Comic Sans MS"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeText(ft.text, ft.x, ft.y - riseOffset);
                ctx.fillText(ft.text, ft.x, ft.y - riseOffset);
                ctx.restore();
            }
        }

        //--------------------------------------------------
        // LOGIQUE DE L'IA AMÉLIORÉE
        //--------------------------------------------------

        // Démarrer la boucle de déplacement de l'IA
        function startAI() {
            // Éviter les doublons si l'IA était déjà démarrée
            if (aiMoveInterval) {
                clearInterval(aiMoveInterval);
            }

            aiMoveInterval = setInterval(() => {
                if (!aiMode || !gameState.gameStarted) return;

                const aiPlayer = gameState.players[aiPlayerId];
                if (!aiPlayer || !aiPlayer.alive) return;

                moveAI(aiPlayer);
            }, AI_MOVE_DELAY);
        }

        // Déplacer l'IA - comportement reconstruit : décision de bombe et
        // décision de déplacement sont maintenant deux étapes indépendantes,
        // exécutées à chaque tick de décision (AI_MOVE_DELAY), qu'un pas de
        // grille soit en cours ou non.
        function moveAI(aiPlayer) {
            // Ne rien décider tant que l'IA est en train de traverser une case :
            // le pas en cours doit finir avant d'en démarrer un autre.
            if (aiPlayer.moving) return;

            // Obtenir la position actuelle de l'IA sur la grille
            const gridX = Math.floor(aiPlayer.x / TILE_SIZE);
            const gridY = Math.floor(aiPlayer.y / TILE_SIZE);

            // Ramasser un bonus présent sur la case actuelle
            const bonusHere = getBonusAt(gridX, gridY);
            if (bonusHere) {
                collectBonus(aiPlayerId, bonusHere);
                updateDebugInfo("Bonus collecté!");
            }

            // Directions possibles: haut, bas, gauche, droite
            const directions = [
                { dx: 0, dy: -1, name: 'haut' },
                { dx: 0, dy: 1, name: 'bas' },
                { dx: -1, dy: 0, name: 'gauche' },
                { dx: 1, dy: 0, name: 'droite' }
            ];

            // Filtrer les directions valides (sans obstacle, sans bombe)
            const validDirections = directions.filter(dir => {
                const newGridX = gridX + dir.dx;
                const newGridY = gridY + dir.dy;
                return isGridAccessible(newGridX, newGridY) && !hasBomb(newGridX, newGridY);
            });

            let nearbyBomb = isNearExplosion(gridX, gridY);

            //--------------------------------------------------
            // ÉTAPE 1 : décider de poser une bombe (indépendant du mouvement)
            //--------------------------------------------------
            // Ne jamais poser si on est déjà en train de fuir un danger, ou si
            // une bombe est déjà présente sous nos pieds.
            if (!nearbyBomb && !hasBomb(gridX, gridY)) {
                const placed = tryPlaceAIBomb(aiPlayer);
                // On vient de poser une bombe sous ses propres pieds : il faut
                // repasser en mode fuite dès ce tick-ci, pas attendre le
                // prochain cycle de décision 300ms plus tard.
                if (placed) {
                    nearbyBomb = true;
                }
            }

            //--------------------------------------------------
            // ÉTAPE 2 : décider de la direction de déplacement
            //--------------------------------------------------
            if (validDirections.length === 0) {
                updateDebugInfo("Bloqué");
                return;
            }

            let chosenDirection;

            // N'envisager que les directions qui ne mènent PAS dans une zone
            // dangereuse : sinon l'IA, une fois à l'abri, repart vers le joueur
            // en retraversant le rayon de sa propre bombe encore active.
            const safeDirections = validDirections.filter(dir =>
                !isCellDangerous(gridX + dir.dx, gridY + dir.dy)
            );

            // Priorité absolue : fuir si une bombe/explosion menace la case actuelle
            if (nearbyBomb) {
                // En fuite, traverser le RAYON d'une bombe pas encore explosée
                // est permis (c'est souvent la seule sortie), mais jamais une
                // flamme active : elle tue sur place.
                const fireFreeDirections = validDirections.filter(dir =>
                    !isCellOnFire(gridX + dir.dx, gridY + dir.dy)
                );
                if (fireFreeDirections.length === 0) {
                    updateDebugInfo("Coincé par les flammes");
                    return;
                }
                chosenDirection = getBestEscapeDirection(gridX, gridY, fireFreeDirections);
                updateDebugInfo("Fuite de bombe");
            } else if (safeDirections.length === 0) {
                // À l'abri, mais toute case adjacente est menacée : ne pas bouger,
                // attendre que la bombe explose plutôt que de jouer avec le feu.
                updateDebugInfo("Attend (à l'abri)");
                return;
            } else {
                // Sinon, aller chercher un bonus proche
                const nearestBonus = findNearestBonus(gridX, gridY);

                if (nearestBonus && nearestBonus.distance < 5) {
                    safeDirections.sort((a, b) => {
                        const distA = Math.abs((gridX + a.dx) - nearestBonus.bonus.x) +
                                      Math.abs((gridY + a.dy) - nearestBonus.bonus.y);
                        const distB = Math.abs((gridX + b.dx) - nearestBonus.bonus.x) +
                                      Math.abs((gridY + b.dy) - nearestBonus.bonus.y);
                        return distA - distB;
                    });

                    chosenDirection = safeDirections[0];
                    updateDebugInfo("Vers bonus");
                } else {
                    // Comportement normal: se diriger vers le joueur humain
                    const player = gameState.players['player1'];

                    if (player && player.alive) {
                        // Éviter les mouvements d'aller-retour
                        const nonBacktrackingMoves = safeDirections.filter(dir =>
                            !(dir.dx === -aiLastMove.dx && dir.dy === -aiLastMove.dy)
                        );

                        const movesToConsider = nonBacktrackingMoves.length > 0 ?
                                               nonBacktrackingMoves : safeDirections;

                        // IA agressive : toujours foncer vers le joueur, jamais
                        // de fuite par timidité quand il est proche (l'ancien
                        // comportement "évite joueur" la rendait molle).
                        movesToConsider.sort((a, b) => {
                            const distA = Math.abs((gridX + a.dx) - Math.floor(player.x / TILE_SIZE)) +
                                         Math.abs((gridY + a.dy) - Math.floor(player.y / TILE_SIZE));
                            const distB = Math.abs((gridX + b.dx) - Math.floor(player.x / TILE_SIZE)) +
                                         Math.abs((gridY + b.dy) - Math.floor(player.y / TILE_SIZE));
                            return distA - distB;
                        });

                        // Toujours prendre la meilleure direction vers le joueur
                        // (plus d'aléatoire ici : elle ne doit plus temporiser)
                        chosenDirection = movesToConsider[0];

                        updateDebugInfo("Vers joueur");
                    } else {
                        // Si pas de joueur, déplacement aléatoire
                        chosenDirection = safeDirections[Math.floor(Math.random() * safeDirections.length)];
                        updateDebugInfo("Aléatoire");
                    }
                }
            }

            // Lancer le pas de grille dans la direction choisie (une case, comme le joueur)
            if (chosenDirection) {
                const started = stepEntityOnGrid(aiPlayer, chosenDirection.dx, chosenDirection.dy, Date.now());

                if (started) {
                    // Mémoriser le dernier mouvement pour éviter les aller-retours
                    aiLastMove = { dx: chosenDirection.dx, dy: chosenDirection.dy };
                }
            }
        }

        // Vérifier si l'IA est près d'une explosion imminente ou en cours.
        // Danger pris en compte dès qu'une bombe menace la case, quel que soit
        // son temps restant : avec un timer de 3s et une décision toutes les
        // 300ms, attendre la dernière seconde pour fuir ne laisse pas assez de
        // pas de grille pour sortir de la zone si le chemin est encombré.
        function isNearExplosion(gridX, gridY) {
            const dangerBombs = gameState.bombs.filter(bomb => {
                const distX = Math.abs(bomb.x - gridX);
                const distY = Math.abs(bomb.y - gridY);
                // Si dans la portée potentielle de la bombe (ligne ou colonne)
                return (distX <= bomb.range && distY === 0) ||
                       (distY <= bomb.range && distX === 0);
            });

            // Vérifier les explosions actives
            const inExplosion = gameState.explosions.some(explosion => {
                return explosion.cells.some(cell => cell.x === gridX && cell.y === gridY);
            });

            return dangerBombs.length > 0 || inExplosion;
        }

        // Une case est-elle dans le rayon d'explosion d'une bombe, ou dans une
        // explosion active ? Utilisé pour écarter STRICTEMENT ces cases de la
        // fuite plutôt que de simplement les pénaliser par un score.
        function isCellDangerous(x, y) {
            const inBombRange = gameState.bombs.some(bomb => {
                const distX = Math.abs(bomb.x - x);
                const distY = Math.abs(bomb.y - y);
                return (distX === 0 && distY <= bomb.range) ||
                       (distY === 0 && distX <= bomb.range);
            });
            if (inBombRange) return true;

            return gameState.explosions.some(explosion => {
                return explosion.cells.some(cell => cell.x === x && cell.y === y);
            });
        }

        // Obtenir la meilleure direction pour fuir un danger.
        // Un choix "gourmand" à 1 seule case ne suffit pas : avec bombRange >= 2,
        // toutes les cases adjacentes peuvent rester alignées avec la bombe
        // (même ligne/colonne), ce qui faisait tourner l'IA en boucle entre
        // quelques cases toujours dangereuses. On fait donc un BFS pour trouver
        // la case sûre la plus proche, puis on renvoie le premier pas du chemin.
        function getBestEscapeDirection(gridX, gridY, validDirections) {
            const directions = [
                { dx: 0, dy: -1 },
                { dx: 0, dy: 1 },
                { dx: -1, dy: 0 },
                { dx: 1, dy: 0 }
            ];

            const startKey = `${gridX},${gridY}`;
            const visited = new Set([startKey]);
            // Chaque entrée de la file mémorise le premier pas effectué depuis
            // le départ, pour pouvoir le renvoyer dès qu'on trouve une case sûre.
            let queue = validDirections.map(dir => ({
                x: gridX + dir.dx,
                y: gridY + dir.dy,
                firstStep: dir
            }));
            queue.forEach(node => visited.add(`${node.x},${node.y}`));

            const MAX_DEPTH = 12; // largement suffisant pour sortir d'une portée de bombe usuelle

            for (let depth = 0; depth < MAX_DEPTH && queue.length > 0; depth++) {
                for (const node of queue) {
                    if (!isCellDangerous(node.x, node.y)) {
                        return node.firstStep;
                    }
                }

                const nextQueue = [];
                for (const node of queue) {
                    for (const dir of directions) {
                        const nx = node.x + dir.dx;
                        const ny = node.y + dir.dy;
                        const key = `${nx},${ny}`;
                        if (visited.has(key)) continue;
                        if (!isGridAccessible(nx, ny) || hasBomb(nx, ny) || isCellOnFire(nx, ny)) continue;

                        visited.add(key);
                        nextQueue.push({ x: nx, y: ny, firstStep: node.firstStep });
                    }
                }
                queue = nextQueue;
            }

            // Aucune case sûre trouvée à portée de recherche : repli sur l'ancien
            // comportement (s'éloigner autant que possible de la bombe la plus proche).
            // Repère de debug : si ce message apparaît en boucle, c'est que
            // isCellDangerous() considère trop de cases comme dangereuses
            // (bombes/explosions fantômes jamais purgées de gameState).
            log(`IA fuite: aucune case sure trouvee depuis (${gridX},${gridY}) - ` +
                `bombes=${gameState.bombs.length} explosions=${gameState.explosions.length}`);

            const directionScores = validDirections.map(dir => {
                const newGridX = gridX + dir.dx;
                const newGridY = gridY + dir.dy;

                let minDistToBomb = Infinity;
                gameState.bombs.forEach(bomb => {
                    const dist = Math.abs(bomb.x - newGridX) + Math.abs(bomb.y - newGridY);
                    if (dist < minDistToBomb) minDistToBomb = dist;
                });

                return { direction: dir, score: minDistToBomb === Infinity ? 0 : minDistToBomb };
            });

            directionScores.sort((a, b) => b.score - a.score);

            return directionScores[0].direction;
        }

        // Trouver le bonus le plus proche
        function findNearestBonus(gridX, gridY) {
            let nearestBonus = null;
            let minDistance = Infinity;
            
            for (const bonus of gameState.bonuses) {
                const distance = Math.abs(bonus.x - gridX) + Math.abs(bonus.y - gridY);
                
                if (distance < minDistance) {
                    minDistance = distance;
                    nearestBonus = bonus;
                }
            }
            
            if (nearestBonus) {
                return {
                    bonus: nearestBonus,
                    distance: minDistance
                };
            }
            
            return null;
        }

        // L'IA place une bombe
        function tryPlaceAIBomb(aiPlayer) {
            // Obtenir la position de la grille
            const gridX = Math.floor(aiPlayer.x / TILE_SIZE);
            const gridY = Math.floor(aiPlayer.y / TILE_SIZE);
            
            // Vérifier si une bombe est déjà présente à cet endroit
            const bombsAtPosition = gameState.bombs.filter(bomb => 
                bomb.x === gridX && bomb.y === gridY
            );
            
            // Compte le nombre de bombes actives de l'IA
            const activeBombs = gameState.bombs.filter(bomb => 
                bomb.playerId === aiPlayerId
            );
            
            // Placer la bombe si possible
            if (bombsAtPosition.length === 0 && activeBombs.length < aiPlayer.maxBombs) {
                // Vérifier s'il est stratégique de poser une bombe ici
                const isStrategic = isStrategicToBomb(gridX, gridY, aiPlayer.bombRange);
                if (!isStrategic) return false;

                // Vérifier qu'une vraie case sûre est atteignable avant l'explosion
                const hasEscape = hasEscapeRoute(gridX, gridY, aiPlayer.bombRange);
                if (!hasEscape) return false;

                // Chance de base de poser la bombe même quand c'est stratégique,
                // pour ne pas être 100% déterministe/prévisible
                if (Math.random() > AI_BOMB_PROBABILITY) return false;

                // Créer la référence d'abord pour connaître la vraie clé Firebase
                const bombRef = database.ref(`games/${gameState.roomId}/bombs`).push();
                const newBomb = {
                    id: bombRef.key,
                    playerId: aiPlayerId,
                    x: gridX,
                    y: gridY,
                    range: aiPlayer.bombRange,
                    timer: Date.now() + BOMB_TIMER
                };

                // Ajouter la bombe à Firebase avec son id qui correspond à la clé Firebase
                bombRef.set(newBomb);
                updateDebugInfo("Bombe posée");
                return true;
            }
            
            return false;
        }

        // Vérifier s'il est stratégique de poser une bombe (utilise la vraie
        // portée de l'IA, pas une valeur fixe, pour rester cohérent avec les
        // bonus de puissance ramassés)
        function isStrategicToBomb(gridX, gridY, bombRange) {
            // Si près du joueur et dans la portée réelle de la bombe, c'est stratégique
            const player = gameState.players['player1'];
            if (player && player.alive) {
                const playerGridX = Math.floor(player.x / TILE_SIZE);
                const playerGridY = Math.floor(player.y / TILE_SIZE);

                const distX = Math.abs(playerGridX - gridX);
                const distY = Math.abs(playerGridY - gridY);

                if ((distX === 0 && distY <= bombRange) || (distY === 0 && distX <= bombRange)) {
                    return true;
                }
            }

            // Si des briques peuvent être détruites, c'est aussi stratégique
            const directions = [
                { dx: 0, dy: -1 }, // haut
                { dx: 0, dy: 1 },  // bas
                { dx: -1, dy: 0 }, // gauche
                { dx: 1, dy: 0 }   // droite
            ];

            return directions.some(dir => {
                const x = gridX + dir.dx;
                const y = gridY + dir.dy;

                return (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE &&
                       gameState.map[y][x] === TILE_TYPES.BRICK);
            });
        }

        // Vérifier qu'une vraie case sûre (hors de portée de TOUTE bombe, y
        // compris celle qu'on s'apprête à poser) est atteignable depuis
        // (gridX, gridY). Une simple case adjacente libre ne suffit pas : avec
        // bombRange >= 2 elle peut rester alignée avec la bombe. On simule la
        // bombe à poser et on réutilise le même BFS que la fuite réelle.
        function hasEscapeRoute(gridX, gridY, bombRange) {
            const simulatedBomb = { x: gridX, y: gridY, range: bombRange };
            const bombsBackup = gameState.bombs;
            gameState.bombs = [...bombsBackup, simulatedBomb];

            try {
                const directions = [
                    { dx: 0, dy: -1 },
                    { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 },
                    { dx: 1, dy: 0 }
                ];

                const visited = new Set([`${gridX},${gridY}`]);
                let queue = [{ x: gridX, y: gridY }];

                for (let depth = 0; depth < AI_ESCAPE_MAX_STEPS && queue.length > 0; depth++) {
                    const nextQueue = [];
                    for (const node of queue) {
                        for (const dir of directions) {
                            const nx = node.x + dir.dx;
                            const ny = node.y + dir.dy;
                            const key = `${nx},${ny}`;
                            if (visited.has(key)) continue;
                            if (!isGridAccessible(nx, ny)) continue;
                            // Les flammes actives tuent : pas de chemin à travers
                            if (isCellOnFire(nx, ny)) continue;
                            // On ignore la bombe simulée elle-même pour le blocage de case
                            if (hasBomb(nx, ny) && !(nx === gridX && ny === gridY)) continue;

                            if (!isCellDangerous(nx, ny)) {
                                return true;
                            }

                            visited.add(key);
                            nextQueue.push({ x: nx, y: ny });
                        }
                    }
                    queue = nextQueue;
                }

                return false;
            } finally {
                gameState.bombs = bombsBackup;
            }
        }

        // Mettre à jour les infos de debug
        function updateDebugInfo(action = "") {
            if (!debugDiv) return;
            
            // Mettre à jour l'action de l'IA
            const aiActionSpan = document.getElementById('aiAction');
            if (aiActionSpan) {
                aiActionSpan.textContent = action;
            }

            const aiForHistory = gameState.players && gameState.players[aiPlayerId];
            if (action && aiForHistory) {
                aiHistory.push(`${new Date().toISOString().slice(17, 23)}s ` +
                    `(${Math.floor(aiForHistory.x / TILE_SIZE)},${Math.floor(aiForHistory.y / TILE_SIZE)}) ${action}`);
                if (aiHistory.length > AI_HISTORY_SIZE) aiHistory.shift();
            }
            
            // Mettre à jour les positions et stats
            if (gameState.players) {
                // IA
                const ai = gameState.players[aiPlayerId];
                if (ai) {
                    const aiGridX = Math.floor(ai.x / TILE_SIZE);
                    const aiGridY = Math.floor(ai.y / TILE_SIZE);
                    
                    const aiGridXSpan = document.getElementById('aiGridX');
                    const aiGridYSpan = document.getElementById('aiGridY');
                    const aiBombsSpan = document.getElementById('aiBombs');
                    const aiPowerSpan = document.getElementById('aiPower');
                    
                    if (aiGridXSpan) aiGridXSpan.textContent = aiGridX;
                    if (aiGridYSpan) aiGridYSpan.textContent = aiGridY;
                    if (aiBombsSpan) aiBombsSpan.textContent = ai.maxBombs;
                    if (aiPowerSpan) aiPowerSpan.textContent = ai.bombRange;
                }
                
                // Joueur
                const player = gameState.players['player1'];
                if (player) {
                    const playerGridX = Math.floor(player.x / TILE_SIZE);
                    const playerGridY = Math.floor(player.y / TILE_SIZE);
                    
                    const playerGridXSpan = document.getElementById('playerGridX');
                    const playerGridYSpan = document.getElementById('playerGridY');
                    const playerBombsSpan = document.getElementById('playerBombs');
                    const playerPowerSpan = document.getElementById('playerPower');
                    
                    if (playerGridXSpan) playerGridXSpan.textContent = playerGridX;
                    if (playerGridYSpan) playerGridYSpan.textContent = playerGridY;
                    if (playerBombsSpan) playerBombsSpan.textContent = player.maxBombs;
                    if (playerPowerSpan) playerPowerSpan.textContent = player.bombRange;
                }
            }
        }

        //--------------------------------------------------
        // GESTION DES BOMBES ET EXPLOSIONS
        //--------------------------------------------------

        // Placer une bombe
        function placeBomb() {
            if (!gameState.roomId || !gameState.playerId || !gameState.gameStarted) return;
            
            const player = gameState.players[gameState.playerId];
            if (!player || !player.alive) return;
            
            // Obtenir la position de la grille
            const gridX = Math.floor(player.x / TILE_SIZE);
            const gridY = Math.floor(player.y / TILE_SIZE);
            
            // Vérifier si une bombe est déjà présente à cet endroit
            const bombsAtPosition = gameState.bombs.filter(bomb => 
                bomb.x === gridX && bomb.y === gridY
            );
            
            // Compte le nombre de bombes actives de ce joueur
            const activeBombs = gameState.bombs.filter(bomb => 
                bomb.playerId === gameState.playerId
            );
            
            // Placer la bombe si possible
            if (bombsAtPosition.length === 0 && activeBombs.length < player.maxBombs) {
                // Créer la référence d'abord pour connaître la vraie clé Firebase
                const bombRef = database.ref(`games/${gameState.roomId}/bombs`).push();
                const newBomb = {
                    id: bombRef.key,
                    playerId: gameState.playerId,
                    x: gridX,
                    y: gridY,
                    range: player.bombRange,
                    timer: Date.now() + BOMB_TIMER // Timestamp pour l'explosion
                };

                // Ajouter la bombe au jeu avec son id qui correspond à la clé Firebase
                bombRef.set(newBomb);
            }
        }

        // Déclencher l'explosion d'une bombe
        function explodeBomb(bomb) {
            if (!gameState.map || !bomb) return;

            const explosionCells = [];
            const pendingBonusSpawns = [];
            const { x, y, range } = bomb;
            
            // Ajouter la cellule centrale
            explosionCells.push({ x, y });
            
            // Explorer les 4 directions (haut, droite, bas, gauche)
            const directions = [
                { dx: 0, dy: -1 }, // haut
                { dx: 1, dy: 0 },  // droite
                { dx: 0, dy: 1 },  // bas
                { dx: -1, dy: 0 }  // gauche
            ];
            
            // Pour chaque direction, étendre jusqu'à rencontrer un obstacle ou atteindre la portée
            directions.forEach(dir => {
                for (let i = 1; i <= range; i++) {
                    const newX = x + dir.dx * i;
                    const newY = y + dir.dy * i;
                    
                    // Vérifier si on est toujours dans les limites de la carte
                    if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                        break;
                    }
                    
                    // Si on rencontre un mur, arrêter dans cette direction
                    if (gameState.map[newY][newX] === TILE_TYPES.WALL) {
                        break;
                    }
                    
                    // Ajouter cette cellule à l'explosion
                    explosionCells.push({ x: newX, y: newY });
                    
                    // Si on rencontre une brique, la détruire et arrêter dans cette direction
                    if (gameState.map[newY][newX] === TILE_TYPES.BRICK) {
                        // Case libérée localement tout de suite, sans dépendre du
                        // retour Firebase (isGridAccessible lit gameState.map)
                        gameState.map[newY][newX] = TILE_TYPES.EMPTY;
                        database.ref(`games/${gameState.roomId}/map/${newY}/${newX}`).set(TILE_TYPES.EMPTY);

                        // Possibilité de créer un bonus. Le spawn est différé après
                        // la fin de l'explosion en cours (voir plus bas dans cette
                        // fonction) : cette case fait partie de explosionCells, donc
                        // si on le créait ici, checkBonusesInExplosion() pourrait le
                        // supprimer immédiatement selon le timing du round-trip
                        // Firebase (ça marchait par chance, pas par garantie).
                        if (Math.random() < BONUS_PROBABILITY) {
                            pendingBonusSpawns.push({ x: newX, y: newY });
                        }

                        break;
                    }
                }
            });
            
            // Créer l'explosion dans Firebase
            const explosion = {
                cells: explosionCells,
                timestamp: Date.now(),
                duration: EXPLOSION_DURATION
            };
            
            // Ajouter l'explosion à Firebase en conservant la vraie clé comme id,
            // sinon elle ne pourra jamais être supprimée (Object.values() perd la clé)
            const explosionRef = database.ref(`games/${gameState.roomId}/explosions`).push();
            explosion.id = explosionRef.key;
            explosionRef.set(explosion);
            
            // Supprimer la bombe de Firebase
            if (bomb.id) {
                database.ref(`games/${gameState.roomId}/bombs/${bomb.id}`).remove();
            } else {
                // Si pas d'ID (parce que ça vient d'être ajouté et pas encore synchronisé)
                const bombRef = database.ref(`games/${gameState.roomId}/bombs`);
                bombRef.once('value', snapshot => {
                    snapshot.forEach(childSnapshot => {
                        const b = childSnapshot.val();
                        if (b.x === bomb.x && b.y === bomb.y && b.playerId === bomb.playerId) {
                            childSnapshot.ref.remove();
                        }
                    });
                });
            }
            
            // Vérifier si des joueurs sont touchés par l'explosion
            checkPlayersInExplosion(explosionCells, bomb);

            // Vérifier si des bonus existants sont touchés par l'explosion
            checkBonusesInExplosion(explosionCells);

            // Vérifier si d'autres bombes sont touchées par l'explosion (réaction en chaîne)
            checkBombsInExplosion(explosionCells, bomb.id);

            // Faire apparaître les nouveaux bonus maintenant que la vérification
            // "bonus touchés par CETTE explosion" est passée : ils ne peuvent
            // plus être supprimés par erreur par l'explosion qui vient de les créer.
            for (const spawn of pendingBonusSpawns) {
                spawnBonus(spawn.x, spawn.y);
            }
        }

        // Vérifier si des joueurs sont touchés par l'explosion
        // Seulement les entités locales : un joueur distant est tué par son
        // propre onglet (checkPlayersInFlames), qui connaît sa vraie position.
        function checkPlayersInExplosion(explosionCells, bomb) {
            for (const playerId of localEntityIds()) {
                const player = gameState.players[playerId];
                if (!player || !player.alive) continue;
                
                // Obtenir la position du joueur sur la grille
                const playerGridX = Math.floor(player.x / TILE_SIZE);
                const playerGridY = Math.floor(player.y / TILE_SIZE);
                
                // Vérifier si le joueur est dans une cellule touchée par l'explosion
                const isHit = explosionCells.some(cell => cell.x === playerGridX && cell.y === playerGridY);
                
                if (isHit) {
                    // Repère de debug : qui est mort, où, tué par quelle bombe
                    log(`MORT de ${playerId} en (${playerGridX},${playerGridY}) ` +
                        `[x=${Math.round(player.x)} y=${Math.round(player.y)} moving=${player.moving}] ` +
                        `- bombe de ${bomb.playerId} en (${bomb.x},${bomb.y}) portée ${bomb.range}`);
                    if (aiMode) {
                        log(`Dernières décisions IA :\n  ${aiHistory.join('\n  ')}`);
                    }

                    // Marquer le joueur comme mort
                    database.ref(`games/${gameState.roomId}/players/${playerId}/alive`).set(false);
                }
            }
        }

        // Une case est-elle couverte par une flamme encore active ?
        function isCellOnFire(x, y) {
            return gameState.explosions.some(explosion =>
                explosion.cells.some(cell => cell.x === x && cell.y === y)
            );
        }

        // Tuer les joueurs qui se trouvent dans une flamme active. Chaque onglet
        // ne vérifie que les entités qu'il simule (son joueur, et l'IA en solo) :
        // en multi, les positions distantes ont du retard et chaque client
        // écrirait la mort de l'autre sur une position périmée.
        function checkPlayersInFlames() {
            if (gameState.explosions.length === 0) return;

            for (const id of localEntityIds()) {
                const player = gameState.players[id];
                if (!player || !player.alive) continue;

                const gridX = Math.floor(player.x / TILE_SIZE);
                const gridY = Math.floor(player.y / TILE_SIZE);
                if (!isCellOnFire(gridX, gridY)) continue;

                log(`MORT de ${id} en (${gridX},${gridY}) [x=${Math.round(player.x)} ` +
                    `y=${Math.round(player.y)} moving=${player.moving}] - entré dans une flamme active`);
                if (aiMode) {
                    log(`Dernières décisions IA :\n  ${aiHistory.join('\n  ')}`);
                }

                // Mort locale immédiate : sinon on réécrirait alive=false à
                // chaque frame jusqu'au retour Firebase
                player.alive = false;
                database.ref(`games/${gameState.roomId}/players/${id}/alive`).set(false);
            }
        }

        // Vérifier si des bonus sont touchés par l'explosion
        function checkBonusesInExplosion(explosionCells) {
            const bonusesToRemove = [];
            
            // Parcourir tous les bonus
            for (const bonus of gameState.bonuses) {
                // Vérifier si ce bonus est touché par l'explosion
                if (explosionCells.some(cell => cell.x === bonus.x && cell.y === bonus.y)) {
                    bonusesToRemove.push(bonus.id);
                }
            }
            
            // Supprimer les bonus touchés
            for (const bonusId of bonusesToRemove) {
                database.ref(`games/${gameState.roomId}/bonuses/${bonusId}`).remove();
            }
        }

        // Vérifier si d'autres bombes sont touchées par l'explosion
        function checkBombsInExplosion(explosionCells, excludeBombId) {
            // Retirer les bombes touchées de l'état local AVANT de les faire
            // exploser : sans ça, la récursion des réactions en chaîne peut
            // repasser sur la même bombe indéfiniment.
            const chained = gameState.bombs.filter(bomb =>
                bomb.id !== excludeBombId &&
                explosionCells.some(cell => cell.x === bomb.x && cell.y === bomb.y)
            );

            if (chained.length === 0) return;

            gameState.bombs = gameState.bombs.filter(bomb => !chained.includes(bomb));

            for (const bomb of chained) {
                // Exploser cette bombe immédiatement (réaction en chaîne)
                explodeBomb(bomb);
            }
        }

        // Mettre à jour les explosions
        function updateExplosions() {
            const currentTime = Date.now();

            // Vérifier si des bombes doivent exploser.
            // On retire la bombe de l'état LOCAL immédiatement : sinon elle reste
            // présente jusqu'au prochain aller-retour Firebase (50-150 ms) et
            // explodeBomb() est rappelée à chaque frame sur la même bombe.
            // Seul l'onglet du propriétaire fait exploser sa bombe (sinon double
            // explosion, double tirage de bonus). Filet de sécurité : si le
            // propriétaire ne l'a pas fait après BOMB_OWNER_GRACE (onglet en
            // arrière-plan, déconnecté…), n'importe quel onglet s'en charge.
            const ownIds = localEntityIds();
            const bombsToExplode = gameState.bombs.filter(bomb =>
                bomb.timer && (
                    (ownIds.includes(bomb.playerId) && bomb.timer <= currentTime) ||
                    bomb.timer + BOMB_OWNER_GRACE <= currentTime
                )
            );
            if (bombsToExplode.length > 0) {
                gameState.bombs = gameState.bombs.filter(bomb => !bombsToExplode.includes(bomb));
                for (const bomb of bombsToExplode) {
                    explodeBomb(bomb);
                }
            }

            // Supprimer les explosions terminées, localement aussi : sans ça
            // gameState.explosions grossit indéfiniment et isCellDangerous()
            // finit par considérer toute la carte comme dangereuse (l'IA ne
            // trouve plus aucune case sûre et tourne en rond).
            const expired = gameState.explosions.filter(
                explosion => explosion.timestamp + explosion.duration <= currentTime
            );
            if (expired.length > 0) {
                gameState.explosions = gameState.explosions.filter(
                    explosion => !expired.includes(explosion)
                );
                for (const explosion of expired) {
                    if (explosion.id) {
                        database.ref(`games/${gameState.roomId}/explosions/${explosion.id}`).remove();
                    }
                }
            }
        }

        // Dessiner les bombes
        function renderBombs() {
            if (!gameState.bombs) return;
            
            for (const bomb of gameState.bombs) {
                // Calculer l'animation de la bombe (pulsation)
                const timeLeft = bomb.timer - Date.now();
                const scale = 1 + 0.2 * Math.sin(timeLeft / 200);
                
                // Dessiner une noix de coco comme bombe
                ctx.fillStyle = '#654321'; // Marron pour la noix de coco
                ctx.beginPath();
                ctx.arc(
                    bomb.x * TILE_SIZE + TILE_SIZE/2, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2, 
                    TILE_SIZE/3 * scale, 
                    0, 
                    Math.PI * 2
                );
                ctx.fill();
                
                // Ajouter des détails à la noix de coco
                ctx.fillStyle = '#543210';
                ctx.beginPath();
                ctx.arc(
                    bomb.x * TILE_SIZE + TILE_SIZE/2 - 3, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 - 3, 
                    2, 
                    0, 
                    Math.PI * 2
                );
                ctx.arc(
                    bomb.x * TILE_SIZE + TILE_SIZE/2 + 3, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 - 3, 
                    2, 
                    0, 
                    Math.PI * 2
                );
                ctx.arc(
                    bomb.x * TILE_SIZE + TILE_SIZE/2, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 + 3, 
                    2, 
                    0, 
                    Math.PI * 2
                );
                ctx.fill();
                
                // Ajouter une petite feuille comme mèche
                ctx.fillStyle = '#00AA00';
                ctx.beginPath();
                ctx.moveTo(
                    bomb.x * TILE_SIZE + TILE_SIZE/2, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 - TILE_SIZE/3
                );
                ctx.lineTo(
                    bomb.x * TILE_SIZE + TILE_SIZE/2 + 5, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 - TILE_SIZE/2
                );
                ctx.lineTo(
                    bomb.x * TILE_SIZE + TILE_SIZE/2 - 5, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 - TILE_SIZE/2 - 2
                );
                ctx.fill();
            }
        }

        // Dessiner les explosions
        function renderExplosions() {
            if (!gameState.explosions) return;
            
            const currentTime = Date.now();
            
            for (const explosion of gameState.explosions) {
                // Calculer l'opacité en fonction du temps écoulé
                const timeElapsed = currentTime - explosion.timestamp;
                const opacity = 1 - (timeElapsed / explosion.duration);
                
                if (opacity <= 0) continue;
                
                // Dessiner chaque cellule de l'explosion
                for (const cell of explosion.cells) {
                    // Utiliser un dégradé pour l'effet d'explosion tropicale
                    try {
                        const gradient = ctx.createRadialGradient(
                            cell.x * TILE_SIZE + TILE_SIZE/2,
                            cell.y * TILE_SIZE + TILE_SIZE/2,
                            0,
                            cell.x * TILE_SIZE + TILE_SIZE/2,
                            cell.y * TILE_SIZE + TILE_SIZE/2,
                            TILE_SIZE/2
                        );
                        
                        // Couleurs chaudes pour une explosion tropicale - jaune, orange, rouge
                        gradient.addColorStop(0, `rgba(255, 255, 0, ${opacity})`);
                        gradient.addColorStop(0.6, `rgba(255, 165, 0, ${opacity * 0.9})`);
                        gradient.addColorStop(1, `rgba(255, 69, 0, ${opacity * 0.7})`);
                        
                        ctx.fillStyle = gradient;
                        ctx.fillRect(
                            cell.x * TILE_SIZE, 
                            cell.y * TILE_SIZE, 
                            TILE_SIZE, 
                            TILE_SIZE
                        );
                        
                        // Ajouter des particules façon "confettis" pour effet reggae
                        if (Math.random() < 0.4) {
                            const particleColors = ['#00FF00', '#FFFF00', '#FF0000']; // Vert, jaune, rouge (couleurs reggae)
                            const color = particleColors[Math.floor(Math.random() * particleColors.length)];
                            
                            ctx.fillStyle = color;
                            ctx.fillRect(
                                cell.x * TILE_SIZE + Math.random() * TILE_SIZE, 
                                cell.y * TILE_SIZE + Math.random() * TILE_SIZE, 
                                3, 
                                3
                            );
                        }
                    } catch (e) {
                        console.error("Erreur lors du rendu d'explosion:", e);
                    }
                }
            }
        }

        //--------------------------------------------------
        // SYSTÈME DE BONUS
        //--------------------------------------------------

        // Faire apparaître un bonus
        function spawnBonus(x, y) {
            // Choisir un type de bonus aléatoire
            const bonusType = Math.floor(Math.random() * 3); // 0 = bombe+, 1 = puissance+, 2 = vitesse+
            
            const bonusId = generateId();
            
            // Créer le bonus
            const bonus = {
                id: bonusId,
                type: bonusType,
                x: x,
                y: y,
                expireTime: Date.now() + BONUS_DURATION
            };
            
            // Ajouter le bonus à Firebase
            database.ref(`games/${gameState.roomId}/bonuses/${bonusId}`).set(bonus);
        }

        // Obtenir un bonus à une position
        function getBonusAt(x, y) {
            return gameState.bonuses.find(bonus => bonus.x === x && bonus.y === y);
        }

        // Collecter un bonus
        function collectBonus(playerId, bonus) {
            if (!bonus) return;
            
            const player = gameState.players[playerId];
            if (!player) return;
            
            // Appliquer l'effet du bonus
            switch (bonus.type) {
                case BONUS_TYPES.BOMB:
                    player.maxBombs++;
                    break;
                case BONUS_TYPES.POWER:
                    player.bombRange++;
                    break;
                case BONUS_TYPES.SPEED:
                    player.speedMultiplier = (player.speedMultiplier || 1) + 0.2;
                    break;
            }

            // Afficher un texte flottant à l'écran pour indiquer au joueur ce
            // qui vient de se passer. Purement local : on ne l'affiche que pour
            // le joueur humain, pas pour l'IA, pour ne pas polluer l'écran.
            if (playerId === gameState.playerId) {
                gameState.floatingTexts.push({
                    text: BONUS_LABELS[bonus.type] || 'Bonus !',
                    x: bonus.x * TILE_SIZE + TILE_SIZE / 2,
                    y: bonus.y * TILE_SIZE + TILE_SIZE / 2,
                    startTime: Date.now()
                });
            }

            // Mettre à jour le joueur dans Firebase
            database.ref(`games/${gameState.roomId}/players/${playerId}`).update({
                maxBombs: player.maxBombs,
                bombRange: player.bombRange,
                speedMultiplier: player.speedMultiplier
            });
            
            // Supprimer le bonus
            database.ref(`games/${gameState.roomId}/bonuses/${bonus.id}`).remove();
        }

        // Vérifier les bonus collectés
        function checkBonusCollection() {
            // Seulement les entités locales (l'autre onglet ramasse pour son joueur)
            for (const playerId of localEntityIds()) {
                const player = gameState.players[playerId];
                if (!player || !player.alive) continue;
                
                // Obtenir la position du joueur sur la grille
                const playerGridX = Math.floor(player.x / TILE_SIZE);
                const playerGridY = Math.floor(player.y / TILE_SIZE);
                
                // Vérifier s'il y a un bonus à cette position
                const bonus = getBonusAt(playerGridX, playerGridY);
                if (bonus) {
                    collectBonus(playerId, bonus);
                }
            }
        }

        // Mettre à jour les bonus (expiration)
        function updateBonuses() {
            const currentTime = Date.now();
            
            // Supprimer les bonus expirés
            for (const bonus of gameState.bonuses) {
                if (bonus.expireTime && bonus.expireTime <= currentTime) {
                    database.ref(`games/${gameState.roomId}/bonuses/${bonus.id}`).remove();
                }
            }
        }

        // Dessiner les bonus
        function renderBonuses() {
            if (!gameState.bonuses || gameState.bonuses.length === 0) return;
            
            for (const bonus of gameState.bonuses) {
                // Position du bonus
                const x = bonus.x * TILE_SIZE + TILE_SIZE/2;
                const y = bonus.y * TILE_SIZE + TILE_SIZE/2;
                
                // Animation de pulsation
                const scale = 1 + 0.1 * Math.sin(Date.now() / 300);
                const size = TILE_SIZE * 0.6 * scale;
                
                // Couleur selon le type
                let color;
                let symbol;
                
                switch (bonus.type) {
                    case BONUS_TYPES.BOMB:
                        color = '#f5a623'; // Orange
                        symbol = 'B';
                        break;
                    case BONUS_TYPES.POWER:
                        color = '#ff5252'; // Rouge
                        symbol = 'P';
                        break;
                    case BONUS_TYPES.SPEED:
                        color = '#7ed321'; // Vert
                        symbol = 'S';
                        break;
                }
                
                // Dessiner le cercle du bonus
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, size/2, 0, Math.PI * 2);
                ctx.fill();
                
                // Bordure
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, size/2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.lineWidth = 1;
                
                // Symbole
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px Comic Sans MS';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(symbol, x, y);
            }
        }

        //--------------------------------------------------
        // GESTION DU MULTIJOUEUR
