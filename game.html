                    const aiGridYSpan = document.getElementById('aiGridY');
                    const aiBombsSpan = document.getElementById('aiBombs');
                    const aiPowerSpan = document.getElementById('aiPower');
                    
                    if (aiGridXSpan) aiGridXSpan.textContent = aiGridX;
                    if (aiGridYSpan) aiGridYSpan.textContent = aiGridY;
                    if (aiBombsSpan) aiBombsSpan.textContent = ai.maxBombs;
                    if (aiPowerSpan) aiPowerSpan.textContent = ai.bombRange;
                }
                
                // Joueur
                const player = gameState.players['player1'];
                if (player) {
                    const playerGridX = Math.floor(player.x / TILE_SIZE);
                    const playerGridY = Math.floor(player.y / TILE_SIZE);
                    
                    const playerGridXSpan = document.getElementById('playerGridX');
                    const playerGridYSpan = document.getElementById('playerGridY');
                    const playerBombsSpan = document.getElementById('playerBombs');
                    const playerPowerSpan = document.getElementById('playerPower');
                    
                    if (playerGridXSpan) playerGridXSpan.textContent = playerGridX;
                    if (playerGridYSpan) playerGridYSpan.textContent = playerGridY;
                    if (playerBombsSpan) playerBombsSpan.textContent = player.maxBombs;
                    if (playerPowerSpan) playerPowerSpan.textContent = player.bombRange;
                }
            }
        }

        //--------------------------------------------------
        // GESTION DES BOMBES ET EXPLOSIONS
        //--------------------------------------------------

        // Placer une bombe
        function placeBomb() {
            if (!gameState.roomId || !gameState.playerId || !gameState.gameStarted) return;
            if (countdownActive()) return;
            if (gameState.match && gameState.match.roundOver) return;
            
            const player = gameState.players[gameState.playerId];
            if (!player || !player.alive) return;
            if (isFlooded(Math.floor(player.x / TILE_SIZE), Math.floor(player.y / TILE_SIZE))) return;
            
            // Obtenir la position de la grille
            const gridX = Math.floor(player.x / TILE_SIZE);
            const gridY = Math.floor(player.y / TILE_SIZE);
            
            // Vérifier si une bombe est déjà présente à cet endroit
            const bombsAtPosition = gameState.bombs.filter(bomb => 
                bomb.x === gridX && bomb.y === gridY
            );
            
            // Compte le nombre de bombes actives de ce joueur
            const activeBombs = gameState.bombs.filter(bomb => 
                bomb.playerId === gameState.playerId
            );
            
            // Placer la bombe si possible
            if (bombsAtPosition.length === 0 && activeBombs.length < player.maxBombs) {
                // Créer la référence d'abord pour connaître la vraie clé Firebase
                const bombRef = database.ref(`games/${gameState.roomId}/bombs`).push();
                const newBomb = {
                    id: bombRef.key,
                    playerId: gameState.playerId,
                    x: gridX,
                    y: gridY,
                    range: player.bombRange,
                    pierce: !!player.pierce,
                    // Détonateur : pas de mèche, déclenchée avec Entrée (filet :
                    // explose seule au bout de DETONATOR_FUSE)
                    remote: !!player.hasDetonator,
                    timer: Date.now() + (player.hasDetonator ? DETONATOR_FUSE : BOMB_TIMER)
                };

                // Ajouter la bombe au jeu avec son id qui correspond à la clé Firebase
                bombRef.set(newBomb);
            }
        }

        // Détonateur : fait exploser toutes les bombes télécommandées du joueur
        function detonateRemoteBombs() {
            const mine = gameState.bombs.filter(b => b.remote && b.playerId === gameState.playerId);
            if (mine.length === 0) return;
            gameState.bombs = gameState.bombs.filter(b => !mine.includes(b));
            for (const bomb of mine) explodeBomb(bomb);
        }

        // Coup de pied : la bombe en (x, y) glisse dans la direction (dx, dy)
        // jusqu'au premier obstacle (mur, tonneau, bombe, joueur, eau, bord).
        // Sa position FINALE est écrite tout de suite (c'est là qu'elle
        // explosera) ; le glissement n'est qu'une animation (slideFrom*).
        function kickBomb(x, y, dx, dy) {
            const bomb = gameState.bombs.find(b => b.x === x && b.y === y);
            if (!bomb || bomb.slideUntil > Date.now()) return;
            const occupied = (cx, cy) => Object.values(gameState.players).some(p =>
                p && p.alive && Math.floor(p.x / TILE_SIZE) === cx && Math.floor(p.y / TILE_SIZE) === cy);
            let tx = x, ty = y;
            while (isGridAccessible(tx + dx, ty + dy) && !hasBomb(tx + dx, ty + dy) && !occupied(tx + dx, ty + dy)) {
                tx += dx;
                ty += dy;
            }
            if (tx === x && ty === y) return;
            const now = Date.now();
            const update = {
                x: tx, y: ty,
                slideFromX: x, slideFromY: y,
                slideStart: now,
                slideUntil: now + (Math.abs(tx - x) + Math.abs(ty - y)) * KICK_SLIDE_MS
            };
            Object.assign(bomb, update);
            database.ref(`games/${gameState.roomId}/bombs/${bomb.id}`).update(update);
            sfx('kick');
        }

        // Déclencher l'explosion d'une bombe
        function explodeBomb(bomb) {
            if (!gameState.map || !bomb) return;

            const explosionCells = [];
            const pendingBonusSpawns = [];
            const { x, y, range } = bomb;
            
            // Ajouter la cellule centrale
            explosionCells.push({ x, y });
            
            // Explorer les 4 directions (haut, droite, bas, gauche)
            const directions = [
                { dx: 0, dy: -1 }, // haut
                { dx: 1, dy: 0 },  // droite
                { dx: 0, dy: 1 },  // bas
                { dx: -1, dy: 0 }  // gauche
            ];
            
            // Pour chaque direction, étendre jusqu'à rencontrer un obstacle ou atteindre la portée
            directions.forEach(dir => {
                for (let i = 1; i <= range; i++) {
                    const newX = x + dir.dx * i;
                    const newY = y + dir.dy * i;
                    
                    // Vérifier si on est toujours dans les limites de la carte
                    if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                        break;
                    }
                    
                    // Si on rencontre un mur (ou la mer montée), arrêter dans cette direction
                    if (gameState.map[newY][newX] === TILE_TYPES.WALL || isFlooded(newX, newY)) {
                        break;
                    }
                    
                    // Ajouter cette cellule à l'explosion
                    explosionCells.push({ x: newX, y: newY });
                    
                    // Si on rencontre une brique, la détruire et arrêter dans cette
                    // direction (sauf flamme perçante : elle continue)
                    if (gameState.map[newY][newX] === TILE_TYPES.BRICK) {
                        // Case libérée localement tout de suite, sans dépendre du
                        // retour Firebase (isGridAccessible lit gameState.map)
                        gameState.map[newY][newX] = TILE_TYPES.EMPTY;
                        database.ref(`games/${gameState.roomId}/map/${newY}/${newX}`).set(TILE_TYPES.EMPTY);

                        // Possibilité de créer un bonus. Le spawn est différé après
                        // la fin de l'explosion en cours (voir plus bas dans cette
                        // fonction) : cette case fait partie de explosionCells, donc
                        // si on le créait ici, checkBonusesInExplosion() pourrait le
                        // supprimer immédiatement selon le timing du round-trip
                        // Firebase (ça marchait par chance, pas par garantie).
                        if (Math.random() < BONUS_PROBABILITY) {
                            pendingBonusSpawns.push({ x: newX, y: newY });
                        }

                        if (!bomb.pierce) break;
                    }
                }
            });
            
            // Créer l'explosion dans Firebase
            const explosion = {
                cells: explosionCells,
                timestamp: Date.now(),
                duration: EXPLOSION_DURATION
            };
            
            // Ajouter l'explosion à Firebase en conservant la vraie clé comme id,
            // sinon elle ne pourra jamais être supprimée (Object.values() perd la clé)
            const explosionRef = database.ref(`games/${gameState.roomId}/explosions`).push();
            explosion.id = explosionRef.key;
            explosionRef.set(explosion);
            
            // Supprimer la bombe de Firebase
            if (bomb.id) {
                database.ref(`games/${gameState.roomId}/bombs/${bomb.id}`).remove();
            } else {
                // Si pas d'ID (parce que ça vient d'être ajouté et pas encore synchronisé)
                const bombRef = database.ref(`games/${gameState.roomId}/bombs`);
                bombRef.once('value', snapshot => {
                    snapshot.forEach(childSnapshot => {
                        const b = childSnapshot.val();
                        if (b.x === bomb.x && b.y === bomb.y && b.playerId === bomb.playerId) {
                            childSnapshot.ref.remove();
                        }
                    });
                });
            }
            
            // Vérifier si des joueurs sont touchés par l'explosion
            checkPlayersInExplosion(explosionCells, bomb);

            // Vérifier si des bonus existants sont touchés par l'explosion
            checkBonusesInExplosion(explosionCells);

            // Vérifier si d'autres bombes sont touchées par l'explosion (réaction en chaîne)
            checkBombsInExplosion(explosionCells, bomb.id);

            // Faire apparaître les nouveaux bonus maintenant que la vérification
            // "bonus touchés par CETTE explosion" est passée : ils ne peuvent
            // plus être supprimés par erreur par l'explosion qui vient de les créer.
            for (const spawn of pendingBonusSpawns) {
                spawnBonus(spawn.x, spawn.y);
            }
        }

        // Vérifier si des joueurs sont touchés par l'explosion
        // Seulement les entités locales : un joueur distant est tué par son
        // propre onglet (checkPlayersInFlames), qui connaît sa vraie position.
        function checkPlayersInExplosion(explosionCells, bomb) {
            for (const playerId of localEntityIds()) {
                const player = gameState.players[playerId];
                if (!player || !player.alive) continue;
                
                // Obtenir la position du joueur sur la grille
                const playerGridX = Math.floor(player.x / TILE_SIZE);
                const playerGridY = Math.floor(player.y / TILE_SIZE);
                
                // Vérifier si le joueur est dans une cellule touchée par l'explosion
                const isHit = explosionCells.some(cell => cell.x === playerGridX && cell.y === playerGridY);
                
                if (isHit) {
                    // Repère de debug : qui est mort, où, tué par quelle bombe
                    log(`MORT de ${playerId} en (${playerGridX},${playerGridY}) ` +
                        `[x=${Math.round(player.x)} y=${Math.round(player.y)} moving=${player.moving}] ` +
                        `- bombe de ${bomb.playerId} en (${bomb.x},${bomb.y}) portée ${bomb.range}`);
                    if (aiMode) {
                        log(`Dernières décisions IA :\n  ${aiHistory.join('\n  ')}`);
                    }

                    // Marquer le joueur comme mort
                    database.ref(`games/${gameState.roomId}/players/${playerId}/alive`).set(false);
                }
            }
        }

        // Une case est-elle couverte par une flamme encore active ?
        function isCellOnFire(x, y) {
            return gameState.explosions.some(explosion =>
                explosion.cells.some(cell => cell.x === x && cell.y === y)
            );
        }

        // Tuer les joueurs qui se trouvent dans une flamme active. Chaque onglet
        // ne vérifie que les entités qu'il simule (son joueur, et l'IA en solo) :
        // en multi, les positions distantes ont du retard et chaque client
        // écrirait la mort de l'autre sur une position périmée.
        // Même règle pour la marée : une entité sur une case inondée est noyée.
        function checkPlayersInFlames() {
            for (const id of localEntityIds()) {
                const player = gameState.players[id];
                if (!player || !player.alive) continue;

                const gridX = Math.floor(player.x / TILE_SIZE);
                const gridY = Math.floor(player.y / TILE_SIZE);
                const onFire = gameState.explosions.length > 0 && isCellOnFire(gridX, gridY);
                const drowned = isFlooded(gridX, gridY);
                if (!onFire && !drowned) continue;

                log(`MORT de ${id} en (${gridX},${gridY}) [x=${Math.round(player.x)} ` +
                    `y=${Math.round(player.y)} moving=${player.moving}] - ` +
                    (drowned ? 'noyé par la marée' : 'entré dans une flamme active'));
                if (aiMode) {
                    log(`Dernières décisions IA :\n  ${aiHistory.join('\n  ')}`);
                }

                // Mort locale immédiate : sinon on réécrirait alive=false à
                // chaque frame jusqu'au retour Firebase
                player.alive = false;
                database.ref(`games/${gameState.roomId}/players/${id}/alive`).set(false);
            }
        }

        // Vérifier si des bonus sont touchés par l'explosion
        function checkBonusesInExplosion(explosionCells) {
            const bonusesToRemove = [];
            
            // Parcourir tous les bonus
            for (const bonus of gameState.bonuses) {
                // Vérifier si ce bonus est touché par l'explosion
                if (explosionCells.some(cell => cell.x === bonus.x && cell.y === bonus.y)) {
                    bonusesToRemove.push(bonus.id);
                }
            }
            
            // Supprimer les bonus touchés
            for (const bonusId of bonusesToRemove) {
                database.ref(`games/${gameState.roomId}/bonuses/${bonusId}`).remove();
            }
        }

        // Vérifier si d'autres bombes sont touchées par l'explosion
        function checkBombsInExplosion(explosionCells, excludeBombId) {
            // Retirer les bombes touchées de l'état local AVANT de les faire
            // exploser : sans ça, la récursion des réactions en chaîne peut
            // repasser sur la même bombe indéfiniment.
            const chained = gameState.bombs.filter(bomb =>
                bomb.id !== excludeBombId &&
                explosionCells.some(cell => cell.x === bomb.x && cell.y === bomb.y)
            );

            if (chained.length === 0) return;

            gameState.bombs = gameState.bombs.filter(bomb => !chained.includes(bomb));

            for (const bomb of chained) {
                // Exploser cette bombe immédiatement (réaction en chaîne)
                explodeBomb(bomb);
            }
        }

        // Mettre à jour les explosions
        function updateExplosions() {
            const currentTime = Date.now();

            // Vérifier si des bombes doivent exploser.
            // On retire la bombe de l'état LOCAL immédiatement : sinon elle reste
            // présente jusqu'au prochain aller-retour Firebase (50-150 ms) et
            // explodeBomb() est rappelée à chaque frame sur la même bombe.
            // Seul l'onglet du propriétaire fait exploser sa bombe (sinon double
            // explosion, double tirage de bonus). Filet de sécurité : si le
            // propriétaire ne l'a pas fait après BOMB_OWNER_GRACE (onglet en
            // arrière-plan, déconnecté…), n'importe quel onglet s'en charge.
            const ownIds = localEntityIds();

            // Bombe engloutie par la marée : elle s'éteint sans exploser
            const drowned = gameState.bombs.filter(bomb =>
                ownIds.includes(bomb.playerId) && isFlooded(bomb.x, bomb.y));
            if (drowned.length > 0) {
                gameState.bombs = gameState.bombs.filter(bomb => !drowned.includes(bomb));
                for (const bomb of drowned) {
                    database.ref(`games/${gameState.roomId}/bombs/${bomb.id}`).remove();
                }
            }

            const bombsToExplode = gameState.bombs.filter(bomb =>
                bomb.timer && (
                    (ownIds.includes(bomb.playerId) && bomb.timer <= currentTime) ||
                    bomb.timer + BOMB_OWNER_GRACE <= currentTime
                )
            );
            if (bombsToExplode.length > 0) {
                gameState.bombs = gameState.bombs.filter(bomb => !bombsToExplode.includes(bomb));
                for (const bomb of bombsToExplode) {
                    explodeBomb(bomb);
                }
            }

            // Supprimer les explosions terminées, localement aussi : sans ça
            // gameState.explosions grossit indéfiniment et isCellDangerous()
            // finit par considérer toute la carte comme dangereuse (l'IA ne
            // trouve plus aucune case sûre et tourne en rond).
            const expired = gameState.explosions.filter(
                explosion => explosion.timestamp + explosion.duration <= currentTime
            );
            if (expired.length > 0) {
                gameState.explosions = gameState.explosions.filter(
                    explosion => !expired.includes(explosion)
                );
                for (const explosion of expired) {
                    if (explosion.id) {
                        database.ref(`games/${gameState.roomId}/explosions/${explosion.id}`).remove();
                    }
                }
            }
        }

        //--------------------------------------------------
        // RENDU PAR SPRITES (assets/sprites.png, généré par tools/build_sprites.py)
        // Si l'atlas n'est pas chargé, chaque fonction retombe sur l'ancien
        // dessin en formes simples.
        //--------------------------------------------------
        const spriteSheet = new Image();
        let spritesLoaded = false;
        spriteSheet.onload = () => { spritesLoaded = true; };
        spriteSheet.onerror = () => log('Sprites introuvables : rendu simplifié');
        spriteSheet.src = 'assets/sprites.png';

        function spritesReady() {
            return spritesLoaded && window.SPRITE_ATLAS;
        }

        // Dessine le sprite `name` centré en (cx, cy), taille w x h, avec
        // rotation optionnelle (radians)
        function drawSprite(name, cx, cy, w, h = w, rotation = 0) {
            const pos = SPRITE_ATLAS.frames[name];
            if (!pos) return;
            const s = SPRITE_ATLAS.size;
            ctx.save();
            ctx.translate(cx, cy);
            if (rotation) ctx.rotate(rotation);
            ctx.drawImage(spriteSheet, pos[0], pos[1], s, s, -w / 2, -h / 2, w, h);
            ctx.restore();
        }

        // Variante de sable pseudo-aléatoire mais stable pour une case donnée
        function sandVariant(x, y) {
            return ((x * 73856093) ^ (y * 19349663)) % 7 === 0 ? 'sand2' : 'sand';
        }

        function renderMapSprites() {
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cx = x * TILE_SIZE + TILE_SIZE / 2;
                    const cy = y * TILE_SIZE + TILE_SIZE / 2;
                    drawSprite('sand', cx, cy, TILE_SIZE + 0.5);
                    // Variante foncée en léger voile : en plein, elle faisait des taches
                    if (sandVariant(x, y) === 'sand2') {
                        ctx.globalAlpha = 0.3;
                        drawSprite('sand2', cx, cy, TILE_SIZE + 0.5);
                        ctx.globalAlpha = 1;
                    }
                }
            }
            // Obstacles après le sol : un palmier peut déborder un peu sur ses voisins
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const tile = gameState.map[y][x];
                    const cx = x * TILE_SIZE + TILE_SIZE / 2;
                    const cy = y * TILE_SIZE + TILE_SIZE / 2;
                    if (tile === TILE_TYPES.WALL) {
                        drawSprite('palm', cx, cy, TILE_SIZE * 1.1);
                    } else if (tile === TILE_TYPES.BRICK) {
                        drawSprite('barrel', cx, cy, TILE_SIZE * 0.95);
                    }
                }
            }
        }

        function renderBombsSprites() {
            const now = Date.now();
            for (const bomb of gameState.bombs) {
                // Pulsation qui s'accélère à l'approche de l'explosion
                const timeLeft = Math.max(0, bomb.timer - now);
                const speed = timeLeft < 1000 ? 60 : 160;
                const scale = 1 + 0.08 * Math.sin(now / speed);
                // Bombe poussée : interpolation entre départ et arrivée
                let bx = bomb.x, by = bomb.y;
                if (bomb.slideUntil && now < bomb.slideUntil) {
                    const k = (now - bomb.slideStart) / (bomb.slideUntil - bomb.slideStart);
                    bx = bomb.slideFromX + (bomb.x - bomb.slideFromX) * k;
                    by = bomb.slideFromY + (bomb.y - bomb.slideFromY) * k;
                }
                // Télécommandée : pas de pulsation qui s'accélère (pas de mèche)
                const s = bomb.remote ? 1 + 0.04 * Math.sin(now / 200) : scale;
                drawSprite(bomb.remote ? 'bomb_remote' : 'bomb', bx * TILE_SIZE + TILE_SIZE / 2,
                    by * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE * 0.9 * s);
            }
        }

        function renderExplosionsSprites() {
            const now = Date.now();
            for (const explosion of gameState.explosions) {
                const t = (now - explosion.timestamp) / explosion.duration;
                if (t >= 1) continue;
                const center = explosion.cells[0];
                const inExplosion = (x, y) => explosion.cells.some(c => c.x === x && c.y === y);

                // Grossit vite puis s'estompe sur la fin
                ctx.save();
                ctx.globalAlpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
                const grow = Math.min(1, t * 6);
                const flicker = 1 + 0.06 * Math.sin(now / 40);

                for (const cell of explosion.cells) {
                    const cx = cell.x * TILE_SIZE + TILE_SIZE / 2;
                    const cy = cell.y * TILE_SIZE + TILE_SIZE / 2;
                    if (cell.x === center.x && cell.y === center.y) {
                        drawSprite('flame_center', cx, cy, TILE_SIZE * 1.15 * grow * flicker);
                        continue;
                    }
                    const dx = Math.sign(cell.x - center.x);
                    const dy = Math.sign(cell.y - center.y);
                    // Le sprite de flamme pointe vers la droite
                    const rotation = Math.atan2(dy, dx);
                    const isEnd = !inExplosion(cell.x + dx, cell.y + dy);
                    drawSprite(isEnd ? 'flame_end' : 'flame_mid', cx, cy,
                        TILE_SIZE + 1, TILE_SIZE * 0.9 * grow * flicker, rotation);
                }
                ctx.restore();
            }
        }

        const BONUS_SPRITES = {
            [BONUS_TYPES.BOMB]: 'bonus_bomb',
            [BONUS_TYPES.POWER]: 'bonus_power',
            [BONUS_TYPES.SPEED]: 'bonus_speed',
            [BONUS_TYPES.KICK]: 'bonus_kick',
            [BONUS_TYPES.DETONATOR]: 'bonus_detonator',
            [BONUS_TYPES.PIERCE]: 'bonus_pierce',
            [BONUS_TYPES.MALUS]: 'bonus_malus'
        };

        function renderBonusesSprites() {
            const now = Date.now();
            for (const bonus of gameState.bonuses) {
                const bob = Math.sin(now / 250 + bonus.x) * 2;
                drawSprite(BONUS_SPRITES[bonus.type], bonus.x * TILE_SIZE + TILE_SIZE / 2,
                    bonus.y * TILE_SIZE + TILE_SIZE / 2 + bob, TILE_SIZE * 0.8);
            }
        }

        // Tenue de chaque joueur
        function skinOf(playerId) {
            if (playerId === aiPlayerId) return 'ai';
            return playerId === 'player2' ? 'blue' : 'red';
        }

        // État d'animation par joueur, calculé à partir de la position
        // AFFICHÉE (marche aussi pour l'adversaire lissé) : direction et
        // « en marche » viennent du déplacement entre deux images.
        const playerAnim = {};
        const WALK_FRAME_MS = 110;

        function updatePlayerAnim(playerId, x, y, now) {
            let a = playerAnim[playerId];
            if (!a) a = playerAnim[playerId] = { x, y, dir: 'down', lastMove: 0 };
            const dx = x - a.x, dy = y - a.y;
            if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) {
                a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
                a.lastMove = now;
            }
            a.x = x; a.y = y;
            // petit délai : pas d'arrêt visuel entre deux cases enchaînées
            a.walking = now - a.lastMove < 80;
            return a;
        }

        function renderPlayerSprite(playerId, x, y, now) {
            const a = updatePlayerAnim(playerId, x, y, now);
            const count = SPRITE_ATLAS.walk[a.dir];
            const frame = a.walking ? Math.floor(now / WALK_FRAME_MS) % count : 0;

            // Ombre au sol : détache le personnage du sable clair
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.beginPath();
            ctx.ellipse(x, y + TILE_SIZE * 0.42, TILE_SIZE * 0.3, TILE_SIZE * 0.1, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Le personnage dépasse un peu de sa case vers le haut (vue 3/4)
            const size = TILE_SIZE * 1.25;
            drawSprite(`${skinOf(playerId)}_${a.dir}_${frame}`, x, y + TILE_SIZE / 2 - size / 2 + 1, size);

            // Malus : petit nuage vert qui flotte au-dessus de la tête
            const p = gameState.players[playerId];
            if (p && p.malus && now < (p.malusUntil || 0)) {
                const top = y + TILE_SIZE / 2 - size - 2;
                ctx.save();
                ctx.fillStyle = 'rgba(120, 170, 60, 0.75)';
                for (let i = 0; i < 3; i++) {
                    const ang = now / 400 + i * 2.1;
                    ctx.beginPath();
                    ctx.arc(x + Math.cos(ang) * 6, top + Math.sin(ang * 1.3) * 2, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Dessiner les bombes
        function renderBombs() {
            if (!gameState.bombs) return;
            if (spritesReady()) return renderBombsSprites();

            for (const bomb of gameState.bombs) {
                // Calculer l'animation de la bombe (pulsation)
                const timeLeft = bomb.timer - Date.now();
                const scale = 1 + 0.2 * Math.sin(timeLeft / 200);
                
                // Dessiner une noix de coco comme bombe
                ctx.fillStyle = '#654321'; // Marron pour la noix de coco
                ctx.beginPath();
                ctx.arc(
                    bomb.x * TILE_SIZE + TILE_SIZE/2, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2, 
                    TILE_SIZE/3 * scale, 
                    0, 
                    Math.PI * 2
                );
                ctx.fill();
                
                // Ajouter des détails à la noix de coco
                ctx.fillStyle = '#543210';
                ctx.beginPath();
                ctx.arc(
                    bomb.x * TILE_SIZE + TILE_SIZE/2 - 3, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 - 3, 
                    2, 
                    0, 
                    Math.PI * 2
                );
                ctx.arc(
                    bomb.x * TILE_SIZE + TILE_SIZE/2 + 3, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 - 3, 
                    2, 
                    0, 
                    Math.PI * 2
                );
                ctx.arc(
                    bomb.x * TILE_SIZE + TILE_SIZE/2, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 + 3, 
                    2, 
                    0, 
                    Math.PI * 2
                );
                ctx.fill();
                
                // Ajouter une petite feuille comme mèche
                ctx.fillStyle = '#00AA00';
                ctx.beginPath();
                ctx.moveTo(
                    bomb.x * TILE_SIZE + TILE_SIZE/2, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 - TILE_SIZE/3
                );
                ctx.lineTo(
                    bomb.x * TILE_SIZE + TILE_SIZE/2 + 5, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 - TILE_SIZE/2
                );
                ctx.lineTo(
                    bomb.x * TILE_SIZE + TILE_SIZE/2 - 5, 
                    bomb.y * TILE_SIZE + TILE_SIZE/2 - TILE_SIZE/2 - 2
                );
                ctx.fill();
            }
        }

        // Dessiner les explosions
        function renderExplosions() {
            if (!gameState.explosions) return;
            if (spritesReady()) return renderExplosionsSprites();

            const currentTime = Date.now();
            
            for (const explosion of gameState.explosions) {
                // Calculer l'opacité en fonction du temps écoulé
                const timeElapsed = currentTime - explosion.timestamp;
                const opacity = 1 - (timeElapsed / explosion.duration);
                
                if (opacity <= 0) continue;
                
                // Dessiner chaque cellule de l'explosion
                for (const cell of explosion.cells) {
                    // Utiliser un dégradé pour l'effet d'explosion tropicale
                    try {
                        const gradient = ctx.createRadialGradient(
                            cell.x * TILE_SIZE + TILE_SIZE/2,
                            cell.y * TILE_SIZE + TILE_SIZE/2,
                            0,
                            cell.x * TILE_SIZE + TILE_SIZE/2,
                            cell.y * TILE_SIZE + TILE_SIZE/2,
                            TILE_SIZE/2
                        );
                        
                        // Couleurs chaudes pour une explosion tropicale - jaune, orange, rouge
                        gradient.addColorStop(0, `rgba(255, 255, 0, ${opacity})`);
                        gradient.addColorStop(0.6, `rgba(255, 165, 0, ${opacity * 0.9})`);
                        gradient.addColorStop(1, `rgba(255, 69, 0, ${opacity * 0.7})`);
                        
                        ctx.fillStyle = gradient;
                        ctx.fillRect(
                            cell.x * TILE_SIZE, 
                            cell.y * TILE_SIZE, 
                            TILE_SIZE, 
                            TILE_SIZE
                        );
                        
                        // Ajouter des particules façon "confettis" pour effet reggae
                        if (Math.random() < 0.4) {
                            const particleColors = ['#00FF00', '#FFFF00', '#FF0000']; // Vert, jaune, rouge (couleurs reggae)
                            const color = particleColors[Math.floor(Math.random() * particleColors.length)];
                            
                            ctx.fillStyle = color;
                            ctx.fillRect(
                                cell.x * TILE_SIZE + Math.random() * TILE_SIZE, 
                                cell.y * TILE_SIZE + Math.random() * TILE_SIZE, 
                                3, 
                                3
                            );
                        }
                    } catch (e) {
                        console.error("Erreur lors du rendu d'explosion:", e);
                    }
                }
            }
        }

        //--------------------------------------------------
        // SYSTÈME DE BONUS
        //--------------------------------------------------

        // Faire apparaître un bonus
        function spawnBonus(x, y) {
            // Tirage pondéré (BONUS_WEIGHTS)
            const total = BONUS_WEIGHTS.reduce((sum, [, w]) => sum + w, 0);
            let roll = Math.random() * total;
            let bonusType = BONUS_TYPES.BOMB;
            for (const [type, w] of BONUS_WEIGHTS) {
                if ((roll -= w) < 0) { bonusType = type; break; }
            }
            
            const bonusId = generateId();
            
            // Créer le bonus
            const bonus = {
                id: bonusId,
                type: bonusType,
                x: x,
                y: y,
                expireTime: null
            };
            
            // Ajouter le bonus à Firebase
            database.ref(`games/${gameState.roomId}/bonuses/${bonusId}`).set(bonus);
        }

        // Malus actif sur cette entité ? (horloge de l'onglet qui la simule)
        function hasMalus(entity, type) {
            return !!entity && entity.malus === type && Date.now() < (entity.malusUntil || 0);
        }

        // Obtenir un bonus à une position
        function getBonusAt(x, y) {
            return gameState.bonuses.find(bonus => bonus.x === x && bonus.y === y && !isFlooded(x, y));
        }

        // Collecter un bonus
        function collectBonus(playerId, bonus) {
            if (!bonus) return;
            
            const player = gameState.players[playerId];
            if (!player) return;
            
            // Appliquer l'effet du bonus
            switch (bonus.type) {
                case BONUS_TYPES.BOMB:
                    player.maxBombs++;
                    break;
                case BONUS_TYPES.POWER:
                    player.bombRange++;
                    break;
                case BONUS_TYPES.SPEED:
                    player.speedMultiplier = (player.speedMultiplier || 1) + 0.2;
                    break;
                case BONUS_TYPES.KICK:
                    player.canKick = true;
                    break;
                case BONUS_TYPES.DETONATOR:
                    player.hasDetonator = true;
                    break;
                case BONUS_TYPES.PIERCE:
                    player.pierce = true;
                    break;
                case BONUS_TYPES.MALUS: {
                    // L'IA ne subit pas « bombes incontrôlables » (elle se
                    // suiciderait) : elle tire parmi les deux autres
                    const pool = Object.keys(MALUS_TYPES).filter(k => !(playerId === aiPlayerId && k === 'diarrhee'));
                    player.malus = pool[Math.floor(Math.random() * pool.length)];
                    player.malusUntil = Date.now() + MALUS_DURATION;
                    break;
                }
            }

            // Afficher un texte flottant à l'écran pour indiquer au joueur ce
            // qui vient de se passer. Purement local : on ne l'affiche que pour
            // le joueur humain, pas pour l'IA, pour ne pas polluer l'écran.
            if (playerId === gameState.playerId) {
                sfx(bonus.type === BONUS_TYPES.MALUS ? 'malus' : 'bonus');
                gameState.floatingTexts.push({
                    text: bonus.type === BONUS_TYPES.MALUS ? MALUS_TYPES[player.malus] : (BONUS_LABELS[bonus.type] || 'Bonus !'),
                    x: bonus.x * TILE_SIZE + TILE_SIZE / 2,
                    y: bonus.y * TILE_SIZE + TILE_SIZE / 2,
                    startTime: Date.now()
                });
            }

            // Mettre à jour le joueur dans Firebase
            database.ref(`games/${gameState.roomId}/players/${playerId}`).update({
                maxBombs: player.maxBombs,
                bombRange: player.bombRange,
                speedMultiplier: player.speedMultiplier,
                canKick: !!player.canKick,
                hasDetonator: !!player.hasDetonator,
                pierce: !!player.pierce,
                malus: player.malus || null,
                malusUntil: player.malusUntil || 0
            });
            
            // Supprimer le bonus
            database.ref(`games/${gameState.roomId}/bonuses/${bonus.id}`).remove();
        }

        // Vérifier les bonus collectés
        function checkBonusCollection() {
            // Seulement les entités locales (l'autre onglet ramasse pour son joueur)
            for (const playerId of localEntityIds()) {
                const player = gameState.players[playerId];
                if (!player || !player.alive) continue;
                
                // Obtenir la position du joueur sur la grille
                const playerGridX = Math.floor(player.x / TILE_SIZE);
                const playerGridY = Math.floor(player.y / TILE_SIZE);
                
                // Vérifier s'il y a un bonus à cette position
                const bonus = getBonusAt(playerGridX, playerGridY);
                if (bonus) {
                    collectBonus(playerId, bonus);
                }
            }
        }

        // Mettre à jour les bonus (expiration)
        function updateBonuses() {
            const currentTime = Date.now();
            
            // Supprimer les bonus expirés
            for (const bonus of gameState.bonuses) {
                if (bonus.expireTime && bonus.expireTime <= currentTime) {
                    database.ref(`games/${gameState.roomId}/bonuses/${bonus.id}`).remove();
                }
            }
        }

        // Dessiner les bonus
        function renderBonuses() {
            if (!gameState.bonuses || gameState.bonuses.length === 0) return;
            if (spritesReady()) return renderBonusesSprites();

            for (const bonus of gameState.bonuses) {
                // Position du bonus
                const x = bonus.x * TILE_SIZE + TILE_SIZE/2;
                const y = bonus.y * TILE_SIZE + TILE_SIZE/2;
                
                // Animation de pulsation
                const scale = 1 + 0.1 * Math.sin(Date.now() / 300);
                const size = TILE_SIZE * 0.6 * scale;
                
                // Couleur selon le type
                let color;
                let symbol;
                
                switch (bonus.type) {
                    case BONUS_TYPES.BOMB:
                        color = '#f5a623'; // Orange
                        symbol = 'B';
                        break;
                    case BONUS_TYPES.POWER:
                        color = '#ff5252'; // Rouge
                        symbol = 'P';
                        break;
                    case BONUS_TYPES.SPEED:
                        color = '#7ed321'; // Vert
                        symbol = 'S';
                        break;
                }
                
                // Dessiner le cercle du bonus
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, size/2, 0, Math.PI * 2);
                ctx.fill();
                
                // Bordure
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x, y, size/2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.lineWidth = 1;
                
                // Symbole
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px Comic Sans MS';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(symbol, x, y);
            }
        }

        //--------------------------------------------------
        // GESTION DU MULTIJOUEUR
        //--------------------------------------------------

        // Créer une nouvelle partie multijoueur
        function createGame() {
            log("Création d'une nouvelle partie multijoueur");
            // Générer un code de salle si non spécifié
            const roomId = roomInput.value || generateId();
            roomInput.value = roomId;
            gameState.roomId = roomId;
            gameState.playerId = 'player1';
            aiMode = false;
            
            // Créer la partie dans Firebase
            const gameRef = database.ref(`games/${roomId}`);
            gameRef.set({
                map: generateMap(),
                players: {
                    player1: spawnPlayer('player1')
                },
                bombs: {},
                explosions: {},
                bonuses: {},
                // la manche 1 démarre quand le joueur 2 arrive (roundStart)
                match: newMatch(['player1'], false),
                gameStarted: false
            });
            
            // Rejoindre la partie
            joinGame(roomId, 'player1');
            gameInfo.textContent = `Partie créée ! Code: ${roomId} - En attente d'un autre joueur...`;
        }

        // Rejoindre une partie existante
        function joinExistingGame() {
            log("Tentative de rejoindre une partie existante");
            const roomId = roomInput.value;
            if (!roomId) {
                alert('Veuillez entrer un code de partie');
                return;
            }
            
            // Vérifier si la partie existe
            const gameRef = database.ref(`games/${roomId}`);
            gameRef.once('value', (snapshot) => {
                const gameData = snapshot.val();
                if (!gameData) {
                    alert('Partie non trouvée');
                    return;
                }
                
                // Vérifier si la partie est complète
                if (gameData.players && gameData.players.player2) {
                    alert('Partie déjà complète');
                    return;
                }
                
                // Rejoindre en tant que joueur 2
                gameState.roomId = roomId;
                gameState.playerId = 'player2';
                aiMode = false;
                
                // Ajouter le joueur 2 à la partie
                gameRef.update({
                    'players/player2': spawnPlayer('player2'),
                    'match/scores/player2': 0,
                    'match/roundStart': firebase.database.ServerValue.TIMESTAMP,
                    gameStarted: true
                });
                
                // Rejoindre la partie
                // On vient de vérifier que player1 est là : pas seul dès le départ
                joinGame(roomId, 'player2', false);
            });
        }

        // Supprimer l'ancienne partie de Firebase avant d'en créer une nouvelle.
        // Sans ça, chaque "Nouvelle Partie"/"Jouer contre l'IA" laissait
        // le nœud `games/solo_xxx` précédent dans la base indéfiniment (le
        // redémarrage dans le même onglet ne déclenche pas onDisconnect()).
        function cleanupCurrentGame() {
            if (gameState.roomId) {
                database.ref(`games/${gameState.roomId}`).off();
                database.ref(`games/${gameState.roomId}`).remove();
            }

            // Réinitialiser l'état local des joueurs : sinon le listener de la
            // NOUVELLE partie voit encore l'ancien player1 (ex: mort au milieu
            // de la carte) dans gameState.players, et la protection anti-
            // écrasement de joinGame() réapplique cette vieille position par-
            // dessus le spawn frais (16,16) reçu de Firebase — le joueur
            // apparaissait alors au milieu de la carte au lieu du coin.
            gameState.players = {};
            aiHistory = [];
            gameState.gameStarted = false;
            gameState.match = null;
            lastRoundKey = null;
        }

        // Créer une partie solo contre l'IA
        function createSinglePlayerGame() {
            log("Création d'une partie solo contre l'IA");
            cleanupCurrentGame();

            // Générer un code de salle pour le mode solo
            const roomId = 'solo_' + generateId();
            roomInput.value = roomId;
            gameState.roomId = roomId;
            gameState.playerId = 'player1';
            aiMode = true;
            
            // Créer la partie dans Firebase avec le joueur humain et l'IA
            const gameRef = database.ref(`games/${roomId}`);
            gameRef.set({
                map: generateMap(),
                players: {
                    player1: spawnPlayer('player1'),
                    [aiPlayerId]: spawnPlayer(aiPlayerId)
                },
                bombs: {},
                explosions: {},
                bonuses: {},
                match: newMatch(['player1', aiPlayerId], true),
                gameStarted: true
            });
            
            // Rejoindre la partie
            joinGame(roomId, 'player1');
            gameInfo.textContent = `Partie solo contre l'IA (${aiSettings().label.toLowerCase()}) - Vous êtes le joueur rouge`;
            
            // Démarrer l'IA
            startAI();
        }

        // Ce qui arrive à la partie si CET onglet se déconnecte :
        // - seul humain présent → supprimer toute la partie (personne d'autre
        //   ne la nettoiera) ;
        // - sinon → retirer seulement son joueur, l'autre garde la partie et
        //   voit « l'adversaire a quitté ».
        // cancel() annule tous les onDisconnect de la partie ET de ses enfants,
        // d'où la reprogrammation complète à chaque changement.
        function applyDisconnectPolicy(gameRef, playerId, alone) {
            if (alone === disconnectAlone) return;
            disconnectAlone = alone;
            gameRef.onDisconnect().cancel();
            if (alone) {
                gameRef.onDisconnect().remove();
            } else {
                gameRef.child(`players/${playerId}`).onDisconnect().remove();
            }
        }

        // Rejoindre une partie et configurer les écouteurs
        // alone : suis-je le seul humain au moment de rejoindre ? Sert à
        // programmer la bonne suppression à la déconnexion AVANT le premier
        // retour Firebase (sinon un joueur qui rejoint puis part aussitôt
        // supprimait la partie de l'autre).
        function joinGame(roomId, playerId, alone = true) {
            log(`Rejoindre la partie ${roomId} en tant que ${playerId}`);
            const gameRef = database.ref(`games/${roomId}`);
            
            // Écouter les changements d'état du jeu
            gameRef.on('value', (snapshot) => {
                const gameData = snapshot.val();
                if (!gameData) return;

                // Manche : un nouveau numéro de manche = nouvelle carte et
                // joueurs replacés à leur coin. On jette alors l'état local de
                // déplacement (sinon la fusion ci-dessous réappliquerait les
                // positions de la manche précédente).
                gameState.match = gameData.match || null;
                const roundKey = gameData.gameStarted && gameState.match ? gameState.match.round : null;
                if (roundKey !== null && roundKey !== lastRoundKey) {
                    gameState.players = {};
                    for (const id in remoteDisplay) delete remoteDisplay[id];
                    document.getElementById('gameControls').style.display = 'none';
                    if (roundEndTimer) { clearTimeout(roundEndTimer); roundEndTimer = null; }
                    startCountdown();
                }
                lastRoundKey = roundKey;
                // Décompte calé sur l'heure serveur du début de manche (dès
                // que Firebase a remplacé le TIMESTAMP par sa vraie valeur)
                if (roundKey !== null && typeof gameState.match.roundStart === 'number') {
                    countdownEnd = gameState.match.roundStart - serverOffset + COUNTDOWN_MS;
                }

                // Mettre à jour l'état du jeu local
                gameState.map = gameData.map;

                // Ne pas écraser la position du joueur local avec les données reçues du
                // réseau : elle est déjà à jour localement et le round-trip Firebase
                // (latence réseau) rendrait le déplacement saccadé/lent si on attendait
                // la confirmation du serveur à chaque frame. On ne synchronise que les
                // autres entités (l'IA, l'autre joueur en multi, etc.).
                const newPlayers = gameData.players || {};
                // Entités simulées dans CET onglet : le joueur local, et l'IA en
                // solo. Pour elles, TOUT l'état de déplacement reste local (pas
                // seulement x/y) : la copie Firebase de moving/fromX/toX/moveStart
                // a jusqu'à POSITION_SYNC_INTERVAL de retard, et la réappliquer
                // pouvait faire « reculer » l'entité d'une case (l'IA revenait
                // ainsi sur sa propre bombe). On fusionne aussi DANS l'objet
                // existant au lieu de le remplacer : moveAI() tient une référence
                // sur cet objet, et le set() de sa bombe déclenche ce listener
                // en synchrone — un nouvel objet faisait perdre son pas de fuite.
                for (const id of localEntityIds()) {
                    const local = gameState.players[id];
                    const remote = newPlayers[id];
                    if (!local || !remote) continue;
                    const movement = {};
                    for (const key of LOCAL_MOVEMENT_KEYS) movement[key] = local[key];
                    newPlayers[id] = Object.assign(local, remote, movement);
                }
                gameState.players = newPlayers;

                // Suis-je le seul humain encore présent ? (solo = toujours seul)
                const humans = Object.keys(newPlayers).filter(id => id !== aiPlayerId);
                lastKnownAlone = aiMode || humans.length <= 1;
                applyDisconnectPolicy(gameRef, playerId, lastKnownAlone);

                // Convertir les objets en tableaux en conservant la clé Firebase
                // comme id : Object.values() seul la perdait, ce qui rendait
                // toute suppression ultérieure impossible.
                const toArray = (obj) => obj
                    ? Object.entries(obj).map(([key, value]) => ({ ...value, id: value.id || key }))
                    : [];

                const nowSync = Date.now();
                gameState.bombs = toArray(gameData.bombs);

                // Ignorer les explosions déjà expirées : sinon isCellDangerous()
                // les compte encore et l'IA ne trouve plus aucune case sûre.
                const allExplosions = toArray(gameData.explosions);
                gameState.explosions = allExplosions.filter(
                    explosion => explosion.timestamp + explosion.duration > nowSync
                );
                // Purger celles qui traînent côté Firebase (notamment les entrées
                // héritées, créées sans id exploitable)
                allExplosions
                    .filter(explosion => explosion.timestamp + explosion.duration <= nowSync)
                    .forEach(explosion => {
                        if (explosion.id) {
                            database.ref(`games/${roomId}/explosions/${explosion.id}`).remove();
                        }
                    });

                gameState.bonuses = toArray(gameData.bonuses);
                
                gameState.gameStarted = gameData.gameStarted;
                
                // Afficher un message quand le jeu commence
                if (gameState.gameStarted) {
                    if (aiMode) {
                        gameInfo.textContent = `Partie solo contre l'IA (${aiSettings().label.toLowerCase()}) - Vous êtes le joueur rouge`;
                    } else if (gameData.players.player1 && gameData.players.player2) {
                        gameInfo.textContent = `Partie en ligne - Vous êtes le joueur ${playerId === 'player1' ? 'rouge' : 'bleu'}`;
                    }
                }
            });
            
            // Configurer les déconnexions. Avant, CHAQUE joueur programmait la
            // suppression de toute la partie à sa déconnexion : il suffisait
            // qu'un seul parte pour que l'autre se retrouve sur une partie
            // effacée. Maintenant : on retire seulement son propre joueur, et
            // la partie entière n'est supprimée que par le DERNIER présent
            // (voir applyDisconnectPolicy, réévaluée à chaque arrivée/départ).
            if (connectedListener) {
                database.ref('.info/connected').off('value', connectedListener);
            }
            disconnectAlone = null;
            lastKnownAlone = alone;
            connectedListener = (snapshot) => {
                if (snapshot.val() === false) return;
                // Les onDisconnect sont consommés côté serveur à chaque
                // déconnexion : il faut les reprogrammer à chaque reconnexion.
                disconnectAlone = null;
                applyDisconnectPolicy(gameRef, playerId, lastKnownAlone);
            };
            database.ref('.info/connected').on('value', connectedListener);
            
            // Cacher les contrôles de salle et cacher les contrôles de jeu jusqu'à la fin
            document.getElementById('roomControls').style.display = 'none';
            document.getElementById('gameControls').style.display = 'none';
        }

        // Fonction pour redémarrer la partie
        function restartGame() {
            log("Redémarrage de la partie");
            // Si on est en mode solo avec IA
            if (aiMode) {
                // Nettoyer l'intervalle de l'IA pour éviter les doublons
                if (aiMoveInterval) {
                    clearInterval(aiMoveInterval);
                }

                cleanupCurrentGame();

                // Régénérer une carte et réinitialiser les joueurs
                const roomId = 'solo_' + generateId();
                gameState.roomId = roomId;
                
                // Créer une nouvelle partie
                const gameRef = database.ref(`games/${roomId}`);
                gameRef.set({
                    map: generateMap(),
                    players: {
                        player1: spawnPlayer('player1'),
                        [aiPlayerId]: spawnPlayer(aiPlayerId)
                    },
                    bombs: {},
                    explosions: {},
                    bonuses: {},
                    match: newMatch(['player1', aiPlayerId], true),
                    gameStarted: true
                });
                
                // Rejoindre la partie
                joinGame(roomId, 'player1');
                gameInfo.textContent = `Partie solo contre l'IA (${aiSettings().label.toLowerCase()}) - Vous êtes le joueur rouge`;
                
                // Démarrer l'IA
                startAI();
                
                // Cacher les contrôles de jeu jusqu'à la fin de partie
                document.getElementById('gameControls').style.display = 'none';
            } else if (gameState.match && gameState.match.matchWinner &&
                       matchIds().every(id => gameState.players[id])) {
                // Multijoueur, adversaire toujours là : revanche dans la même
                // salle (nouveau match, scores remis à zéro)
                startRound(true);
            } else {
                // Adversaire parti : revenir à l'écran de création de partie
                document.getElementById('roomControls').style.display = 'block';
                document.getElementById('gameControls').style.display = 'none';
                
                // Déconnecter la partie actuelle
                if (gameState.roomId) {
                    database.ref(`games/${gameState.roomId}`).off();
                }
                
                // Réinitialiser l'état
                gameState.roomId = null;
                gameState.playerId = null;
                gameState.map = [];
                gameState.players = {};
                gameState.bombs = [];
                gameState.explosions = [];
                gameState.bonuses = [];
                gameState.gameStarted = false;
                gameState.match = null;
                lastRoundKey = null;
            }
        }

        // Fonction pour revenir au menu principal
        function returnToHome() {
            log("Retour à l'accueil");
            // Rediriger vers la page d'accueil
            window.location.href = 'index.html';
        }

        //--------------------------------------------------
        // ÉCOUTEURS D'ÉVÉNEMENTS
        //--------------------------------------------------

        // Gérer les entrées clavier
        window.addEventListener('keydown', (e) => {
            gameState.keys[e.key] = true;
            
            // Touche espace pour poser une bombe
            if (e.key === ' ' && gameState.gameStarted) {
                placeBomb();
            }
            // Entrée : déclencher ses bombes télécommandées
            if (e.key === 'Enter' && gameState.gameStarted && !e.repeat &&
                document.activeElement !== roomInput) {
                const me = gameState.players[gameState.playerId];
                if (me && me.alive && !countdownActive()) detonateRemoteBombs();
            }
            
            // Éviter le scroll de la page avec les flèches
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            gameState.keys[e.key] = false;
        });

        // Nettoyage lors de la fermeture de la page
        window.addEventListener('beforeunload', () => {
            if (aiMoveInterval) {
                clearInterval(aiMoveInterval);
            }
        });

        // Ajout des écouteurs d'événements pour les boutons avec système de log
        log("Ajout des écouteurs d'événements pour les boutons");
        
        const createBtn = document.getElementById('createBtn');
        if (createBtn) {
            createBtn.addEventListener('click', function() {
                log("Bouton createBtn cliqué");
                createGame();
            });
            log("Écouteur ajouté pour createBtn");
        } else {
            console.error("Élément createBtn non trouvé");
        }
        
        const joinBtn = document.getElementById('joinBtn');
        if (joinBtn) {
            joinBtn.addEventListener('click', function() {
                log("Bouton joinBtn cliqué");
                joinExistingGame();
            });
            log("Écouteur ajouté pour joinBtn");
        } else {
            console.error("Élément joinBtn non trouvé");
        }
        
        const singlePlayerBtn = document.getElementById('singlePlayerBtn');
        if (singlePlayerBtn) {
            singlePlayerBtn.addEventListener('click', function() {
                log("Bouton singlePlayerBtn cliqué");
                createSinglePlayerGame();
            });
            log("Écouteur ajouté pour singlePlayerBtn");
        } else {
            console.error("Élément singlePlayerBtn non trouvé");
        }

        
        const restartBtn = document.getElementById('restartBtn');
        if (restartBtn) {
            restartBtn.addEventListener('click', function() {
                log("Bouton restartBtn cliqué");
                restartGame();
            });
            log("Écouteur ajouté pour restartBtn");
        } else {
            console.error("Élément restartBtn non trouvé");
        }
        
        const homeBtn = document.getElementById('homeBtn');
        if (homeBtn) {
            homeBtn.addEventListener('click', function() {
                log("Bouton homeBtn cliqué");
                returnToHome();
            });
            log("Écouteur ajouté pour homeBtn");
        } else {
            console.error("Élément homeBtn non trouvé");
        }

        // Boucle de jeu principale
        //--------------------------------------------------
        // SONS (générés par WebAudio, aucun fichier)
        //--------------------------------------------------
        let audioCtx = null;
        let soundOn = true;
        try { soundOn = localStorage.getItem('islandBomber.sound') !== 'off'; } catch (e) { /* défaut : activé */ }

        // Le navigateur n'autorise le son qu'après une action de l'utilisateur
        function unlockAudio() {
            if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                audioCtx = new Ctx();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        window.addEventListener('keydown', unlockAudio);
        window.addEventListener('pointerdown', unlockAudio);

        function tone(freq, start, duration, { type = 'sine', gain = 0.2, endFreq = null } = {}) {
            const t0 = audioCtx.currentTime + start;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + duration);
            g.gain.setValueAtTime(gain, t0);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
            osc.connect(g).connect(audioCtx.destination);
            osc.start(t0);
            osc.stop(t0 + duration + 0.02);
        }

        function noiseBurst(duration, gain) {
            const t0 = audioCtx.currentTime;
            const len = Math.floor(audioCtx.sampleRate * duration);
            const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1400, t0);
            filter.frequency.exponentialRampToValueAtTime(160, t0 + duration);
            const g = audioCtx.createGain();
            g.gain.setValueAtTime(gain, t0);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
            src.connect(filter).connect(g).connect(audioCtx.destination);
            src.start(t0);
        }

        const lastSfx = {};
        function sfx(name) {
            if (!soundOn || !audioCtx || audioCtx.state !== 'running') return;
            // Anti-rafale : une réaction en chaîne ne doit pas empiler 5 sons
            const now = performance.now();
            if (now - (lastSfx[name] || 0) < 60) return;
            lastSfx[name] = now;

            switch (name) {
                case 'place': tone(190, 0, 0.12, { gain: 0.3, endFreq: 90 }); break;
                case 'boom':
                    noiseBurst(0.55, 0.45);
                    tone(70, 0, 0.35, { gain: 0.4, endFreq: 35 });
                    break;
                case 'bonus':
                    [660, 880, 1320].forEach((f, i) => tone(f, i * 0.07, 0.12, { type: 'triangle', gain: 0.15 }));
                    break;
                case 'death': tone(620, 0, 0.55, { type: 'square', gain: 0.08, endFreq: 140 }); break;
                case 'kick': tone(260, 0, 0.18, { type: 'triangle', gain: 0.25, endFreq: 520 }); break;
                case 'malus': tone(300, 0, 0.45, { type: 'sawtooth', gain: 0.08, endFreq: 110 }); break;
                case 'beep': tone(440, 0, 0.12, { type: 'triangle', gain: 0.2 }); break;
                case 'go': tone(880, 0, 0.3, { type: 'triangle', gain: 0.22 }); break;
                case 'win':
                    [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.22, { type: 'triangle', gain: 0.18 }));
                    break;
                case 'lose':
                    [392, 330, 262].forEach((f, i) => tone(f, i * 0.18, 0.3, { type: 'triangle', gain: 0.18 }));
                    break;
            }
        }

        //--------------------------------------------------
        // ANIMATIONS : décompte, éclats de tonneau, mort, secousse
        //--------------------------------------------------
        const COUNTDOWN_MS = 3000;
        let countdownEnd = 0;
        let lastCountdownStep = null;

        function startCountdown() {
            countdownEnd = Date.now() + COUNTDOWN_MS;
            lastCountdownStep = null;
        }

        function countdownActive() {
            return Date.now() < countdownEnd;
        }

        // Événements déduits de l'état (marche pareil pour les actions
        // locales et distantes) : nouvelle bombe, nouvelle explosion, tonneau
        // détruit, joueur mort. Réinitialisé à chaque nouvelle partie pour ne
        // pas rejouer les sons de tout l'état initial.
        const fx = { roomId: null, bombs: new Set(), explosions: new Set(), map: null, alive: {}, particles: [], deaths: [], shakeUntil: 0 };

        function detectEvents(now) {
            const bombIds = new Set(gameState.bombs.map(b => b.id));
            const explosionIds = new Set(gameState.explosions.map(e => e.id));
            const key = gameState.roomId + '#' + (gameState.match ? gameState.match.round : 0);
            const fresh = fx.roomId !== key;

            if (!fresh) {
                if ([...bombIds].some(id => !fx.bombs.has(id))) sfx('place');
                if ([...explosionIds].some(id => !fx.explosions.has(id))) {
                    sfx('boom');
                    fx.shakeUntil = now + 180;
                }
                // Tonneaux détruits : éclats de bois
                if (fx.map && gameState.map) {
                    for (let y = 0; y < GRID_SIZE; y++) {
                        for (let x = 0; x < GRID_SIZE; x++) {
                            if (fx.map[y] && fx.map[y][x] === TILE_TYPES.BRICK && gameState.map[y][x] === TILE_TYPES.EMPTY) {
                                spawnDebris(x, y, now);
                            }
                        }
                    }
                }
                // Morts : le joueur s'envole en tourbillon
                for (const id in gameState.players) {
                    const p = gameState.players[id];
                    if (fx.alive[id] && p && !p.alive) {
                        const a = playerAnim[id] || { x: p.x, y: p.y, dir: 'down' };
                        fx.deaths.push({ id, x: a.x, y: a.y, dir: a.dir, start: now });
                        sfx('death');
                    }
                }
            } else {
                fx.particles = [];
                fx.deaths = [];
            }

            fx.roomId = key;
            fx.bombs = bombIds;
            fx.explosions = explosionIds;
            fx.map = gameState.map ? gameState.map.map(row => row.slice()) : null;
            fx.alive = {};
            for (const id in gameState.players) fx.alive[id] = !!(gameState.players[id] && gameState.players[id].alive);
        }

        function spawnDebris(x, y, now) {
            const cx = x * TILE_SIZE + TILE_SIZE / 2;
            const cy = y * TILE_SIZE + TILE_SIZE / 2;
            for (let i = 0; i < 7; i++) {
                const angle = (Math.PI * 2 * i) / 7 + Math.random() * 0.5;
                const speed = 40 + Math.random() * 50; // px/s
                fx.particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 10,
                    size: 4 + Math.random() * 4,
                    color: Math.random() < 0.3 ? '#9aa0a6' : (Math.random() < 0.5 ? '#a0652e' : '#7b4a1f'),
                    start: now, life: 550
                });
            }
        }

        function renderParticles(now) {
            fx.particles = fx.particles.filter(p => now - p.start < p.life);
            for (const p of fx.particles) {
                const t = (now - p.start) / 1000;
                const k = (now - p.start) / p.life;
                ctx.save();
                ctx.globalAlpha = 1 - k;
                ctx.translate(p.x + p.vx * t, p.y + p.vy * t);
                ctx.rotate(p.rot + p.vr * t);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
                ctx.restore();
            }
        }

        const DEATH_MS = 900;
        function renderDeaths(now) {
            fx.deaths = fx.deaths.filter(d => now - d.start < DEATH_MS);
            if (!spritesReady()) return;
            for (const d of fx.deaths) {
                const t = (now - d.start) / DEATH_MS;
                const size = TILE_SIZE * 1.25 * (1 - 0.5 * t);
                ctx.save();
                ctx.globalAlpha = 1 - t;
                // monte en tournant
                const rise = -TILE_SIZE * 0.9 * t;
                drawSprite(`${skinOf(d.id)}_${d.dir}_0`, d.x, d.y + rise, size, size, t * Math.PI * 4);
                ctx.restore();
            }
        }

        // Grand chiffre au centre pendant le décompte, puis « Go ! »
        function renderCountdown(now) {
            const remaining = countdownEnd - now;
            if (remaining < -600 || countdownEnd === 0) return;
            const step = remaining > 0 ? Math.ceil(remaining / 1000) : 0;
            if (step !== lastCountdownStep) {
                sfx(step > 0 ? 'beep' : 'go');
                lastCountdownStep = step;
            }
            const label = step > 0 ? String(step) : 'Go !';
            const phase = remaining > 0 ? 1 - ((remaining % 1000) / 1000) : (-remaining / 600);
            const scale = 1.4 - 0.4 * Math.min(1, phase * 3);
            ctx.save();
            ctx.globalAlpha = remaining > 0 ? 1 : 1 - phase;
            ctx.translate(VIEW_SIZE / 2, VIEW_SIZE / 2);
            ctx.scale(scale, scale);
            ctx.font = `${step > 0 ? 96 : 72}px Pacifico, cursive`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#8a5a2b';
            ctx.strokeText(label, 0, 0);
            ctx.fillStyle = '#fdf1d3';
            ctx.fillText(label, 0, 0);
            ctx.restore();
        }

        //--------------------------------------------------
        // INTERFACE : fiches joueurs + écran de fin
        //--------------------------------------------------

        // Style CSS affichant le sprite `name` de l'atlas à `size` px
        function spriteCss(name, size) {
            const atlas = window.SPRITE_ATLAS;
            if (!atlas || !atlas.frames[name]) return '';
            const k = size / atlas.size;
            const [x, y] = atlas.frames[name];
            return `background-image:url(assets/sprites.png);` +
                `background-size:${atlas.width * k}px ${atlas.height * k}px;` +
                `background-position:-${x * k}px -${y * k}px;`;
        }

        const PLAYER_LABELS = {
            player1: { name: 'Joueur rouge', accent: 'var(--red)' },
            player2: { name: 'Joueur bleu', accent: 'var(--blue)' },
            [aiPlayerId]: { name: "L'IA", accent: 'var(--ai)' }
        };

        let lastHudKey = '';

        // Pouvoirs spéciaux possédés (et malus en cours) sous les stats
        function powersHtml(p) {
            const icons = [];
            if (p.canKick) icons.push(['bonus_kick', 'Coup de pied']);
            if (p.hasDetonator) icons.push(['bonus_detonator', 'Détonateur (Entrée)']);
            if (p.pierce) icons.push(['bonus_pierce', 'Flamme perçante']);
            if (p.malus && Date.now() < (p.malusUntil || 0)) icons.push(['bonus_malus', MALUS_TYPES[p.malus]]);
            if (icons.length === 0) return '';
            return `<div class="powers">${icons.map(([name, title]) =>
                `<i class="sprite${name === 'bonus_malus' ? ' malus' : ''}" title="${title}" style="${spriteCss(name, 22)}"></i>`).join('')}</div>`;
        }
        let endScreenShown = false;

        // Mis à jour à chaque image, mais le DOM n'est réécrit que si
        // quelque chose a changé (stats, vivant/mort, partie en cours)
        function updateHud() {
            const hud = document.getElementById('hud');
            const ids = gameState.roomId ? Object.keys(gameState.players).sort((a, b) =>
                (a === gameState.playerId ? -1 : 0) - (b === gameState.playerId ? -1 : 0)) : [];
            const key = ids.map(id => {
                const p = gameState.players[id];
                const score = gameState.match && gameState.match.scores ? gameState.match.scores[id] : 0;
                const malus = p.malus && Date.now() < (p.malusUntil || 0) ? p.malus : '';
                return [id, p.alive, p.maxBombs, p.bombRange, p.speedMultiplier, score,
                        p.canKick, p.hasDetonator, p.pierce, malus].join(':');
            }).join('|') + (window.SPRITE_ATLAS ? 's' : '');
            if (key !== lastHudKey) {
                lastHudKey = key;
                hud.innerHTML = ids.map(id => {
                    const p = gameState.players[id];
                    const label = PLAYER_LABELS[id] || { name: id, accent: 'var(--wood)' };
                    const speed = Math.round(((p.speedMultiplier || 1) - 1) / 0.2);
                    const you = id === gameState.playerId ? '<small>vous</small>' : '<small>&nbsp;</small>';
                    const m = gameState.match;
                    const won = m && m.scores ? (m.scores[id] || 0) : 0;
                    const need = m ? m.roundsToWin : DEFAULT_ROUNDS_TO_WIN;
                    const pips = Array.from({ length: need }, (_, i) =>
                        `<span class="pip${i < won ? ' won' : ''}"></span>`).join('');
                    return `<div class="player-card${p.alive ? '' : ' dead'}" style="--accent:${label.accent}">
                        <span class="portrait sprite" style="${spriteCss(skinOf(id) + '_down_0', 52)}"></span>
                        <div class="name">${label.name}${you}<span class="pips" title="Manches gagnées : ${won}">${pips}</span></div>
                        <div class="stats">
                            <span class="stat" title="Bombes"><i class="sprite" style="${spriteCss('bonus_bomb', 20)}"></i>${p.maxBombs}</span>
                            <span class="stat" title="Portée"><i class="sprite" style="${spriteCss('bonus_power', 20)}"></i>${p.bombRange}</span>
                            <span class="stat" title="Vitesse"><i class="sprite" style="${spriteCss('bonus_speed', 20)}"></i>${speed}</span>
                        </div>
                        ${powersHtml(p)}
                    </div>`;
                }).join('');
            }

            // Barre de manche + chrono de la marée
            const bar = document.getElementById('roundBar');
            const m = gameState.match;
            let barText = '';
            if (m && gameState.gameStarted && !m.matchWinner && gameState.roomId) {
                const ts = tideStart();
                const left = ts - serverNow();
                let tide = '';
                if (ts !== Infinity) {
                    tide = left > 0
                        ? `Marée dans ${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')}`
                        : 'La marée monte !';
                }
                barText = `Manche ${m.round} · premier à ${m.roundsToWin}` + (tide ? ` · ${tide}` : '');
                bar.classList.toggle('tide', ts !== Infinity && left <= 10000);
            }
            if (bar.textContent !== barText) bar.textContent = barText;
            bar.hidden = !barText;

            // Écran de fin : titre et texte tirés du message de gameInfo
            // (« Victoire - … », « Défaite - … », « L'adversaire a quitté… »)
            const endScreen = document.getElementById('gameControls');
            // L'écran de fin attend la fin des animations de mort
            const endVisible = endScreen.style.display !== 'none' && fx.deaths.length === 0;
            endScreen.classList.toggle('ready', endVisible);
            if (endVisible && !endScreenShown) {
                sfx(gameInfo.textContent.startsWith('Victoire') ? 'win' : 'lose');
            }
            endScreenShown = endVisible;
            if (endVisible) {
                const msg = gameInfo.textContent;
                const [head, ...rest] = msg.split(' - ');
                const title = document.getElementById('endTitle');
                const win = head.startsWith('Victoire');
                const lose = head.startsWith('Défaite');
                title.textContent = win || lose ? head : 'Partie terminée';
                title.className = win ? 'win' : lose ? 'lose' : '';
                document.getElementById('endText').textContent = win || lose ? rest.join(' - ') : msg;
            }
        }

        function gameLoop() {
            update();
            detectEvents(Date.now());
            render();
            updateHud();
            requestAnimationFrame(gameLoop);
        }

        // Boutons son et niveau (après la déclaration de leur état plus haut)
        // Bouton son
        const soundBtn = document.getElementById('soundBtn');
        function showSound() {
            soundBtn.textContent = soundOn ? 'Son : oui' : 'Son : non';
            soundBtn.setAttribute('aria-pressed', String(soundOn));
        }
        soundBtn.addEventListener('click', () => {
            soundOn = !soundOn;
            try { localStorage.setItem('islandBomber.sound', soundOn ? 'on' : 'off'); } catch (e) { /* non bloquant */ }
            showSound();
            soundBtn.blur(); // sinon Espace re-cliquerait le bouton au lieu de poser une bombe
        });
        showSound();

        // Sélecteur de niveau de l'IA
        const levelButtons = document.querySelectorAll('.level-picker [data-level]');
        function showAiLevel() {
            levelButtons.forEach(b => b.setAttribute('aria-checked', String(b.dataset.level === aiLevel)));
        }
        levelButtons.forEach(b => b.addEventListener('click', () => {
            aiLevel = b.dataset.level;
            try { localStorage.setItem('islandBomber.aiLevel', aiLevel); } catch (e) { /* non bloquant */ }
            showAiLevel();
        }));
        showAiLevel();

        // Démarrer le jeu
        log("Démarrage de la boucle de jeu");
        gameLoop();
    </script>
</body>
</html>
