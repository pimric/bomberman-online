        //--------------------------------------------------

        // Créer une nouvelle partie multijoueur
        function createGame() {
            log("Création d'une nouvelle partie multijoueur");
            // Générer un code de salle si non spécifié
            const roomId = roomInput.value || generateId();
            roomInput.value = roomId;
            gameState.roomId = roomId;
            gameState.playerId = 'player1';
            aiMode = false;
            
            // Créer la partie dans Firebase
            const gameRef = database.ref(`games/${roomId}`);
            gameRef.set({
                map: generateMap(),
                players: {
                    player1: createPlayer(0, 0, '#ff6b6b')
                },
                bombs: {},
                explosions: {},
                bonuses: {},
                gameStarted: false
            });
            
            // Rejoindre la partie
            joinGame(roomId, 'player1');
            gameInfo.textContent = `Partie créée ! Code: ${roomId} - En attente d'un autre joueur...`;
        }

        // Rejoindre une partie existante
        function joinExistingGame() {
            log("Tentative de rejoindre une partie existante");
            const roomId = roomInput.value;
            if (!roomId) {
                alert('Veuillez entrer un code de partie');
                return;
            }
            
            // Vérifier si la partie existe
            const gameRef = database.ref(`games/${roomId}`);
            gameRef.once('value', (snapshot) => {
                const gameData = snapshot.val();
                if (!gameData) {
                    alert('Partie non trouvée');
                    return;
                }
                
                // Vérifier si la partie est complète
                if (gameData.players && gameData.players.player2) {
                    alert('Partie déjà complète');
                    return;
                }
                
                // Rejoindre en tant que joueur 2
                gameState.roomId = roomId;
                gameState.playerId = 'player2';
                aiMode = false;
                
                // Ajouter le joueur 2 à la partie
                gameRef.child('players/player2').set(createPlayer(GRID_SIZE - 1, GRID_SIZE - 1, '#4ecdc4'));
                gameRef.child('gameStarted').set(true);
                
                // Rejoindre la partie
                joinGame(roomId, 'player2');
            });
        }

        // Supprimer l'ancienne partie de Firebase avant d'en créer une nouvelle.
        // Sans ça, chaque "Nouvelle Partie"/"Affronter le Pirate IA" laissait
        // le nœud `games/solo_xxx` précédent dans la base indéfiniment (le
        // redémarrage dans le même onglet ne déclenche pas onDisconnect()).
        function cleanupCurrentGame() {
            if (gameState.roomId) {
                database.ref(`games/${gameState.roomId}`).off();
                database.ref(`games/${gameState.roomId}`).remove();
            }

            // Réinitialiser l'état local des joueurs : sinon le listener de la
            // NOUVELLE partie voit encore l'ancien player1 (ex: mort au milieu
            // de la carte) dans gameState.players, et la protection anti-
            // écrasement de joinGame() réapplique cette vieille position par-
            // dessus le spawn frais (16,16) reçu de Firebase — le joueur
            // apparaissait alors au milieu de la carte au lieu du coin.
            gameState.players = {};
            aiHistory = [];
        }

        // Créer une partie solo contre l'IA
        function createSinglePlayerGame() {
            log("Création d'une partie solo contre l'IA");
            cleanupCurrentGame();

            // Générer un code de salle pour le mode solo
            const roomId = 'solo_' + generateId();
            roomInput.value = roomId;
            gameState.roomId = roomId;
            gameState.playerId = 'player1';
            aiMode = true;
            
            // Créer la partie dans Firebase avec le joueur humain et l'IA
            const gameRef = database.ref(`games/${roomId}`);
            gameRef.set({
                map: generateMap(),
                players: {
                    player1: createPlayer(0, 0, '#ff6b6b'),
                    [aiPlayerId]: createPlayer(GRID_SIZE - 1, GRID_SIZE - 1, '#4ecdc4')
                },
                bombs: {},
                explosions: {},
                bonuses: {},
                gameStarted: true
            });
            
            // Rejoindre la partie
            joinGame(roomId, 'player1');
            gameInfo.textContent = `Survivez sur l'île contre le pirate IA - Vous êtes le Rasta Rouge`;
            
            // Démarrer l'IA
            startAI();
        }

        // Rejoindre une partie et configurer les écouteurs
        function joinGame(roomId, playerId) {
            log(`Rejoindre la partie ${roomId} en tant que ${playerId}`);
            const gameRef = database.ref(`games/${roomId}`);
            
            // Écouter les changements d'état du jeu
            gameRef.on('value', (snapshot) => {
                const gameData = snapshot.val();
                if (!gameData) return;

                // Mettre à jour l'état du jeu local
                gameState.map = gameData.map;

                // Ne pas écraser la position du joueur local avec les données reçues du
                // réseau : elle est déjà à jour localement et le round-trip Firebase
                // (latence réseau) rendrait le déplacement saccadé/lent si on attendait
                // la confirmation du serveur à chaque frame. On ne synchronise que les
                // autres entités (l'IA, l'autre joueur en multi, etc.).
                const newPlayers = gameData.players || {};
                // Entités simulées dans CET onglet : le joueur local, et l'IA en
                // solo. Pour elles, TOUT l'état de déplacement reste local (pas
                // seulement x/y) : la copie Firebase de moving/fromX/toX/moveStart
                // a jusqu'à POSITION_SYNC_INTERVAL de retard, et la réappliquer
                // pouvait faire « reculer » l'entité d'une case (l'IA revenait
                // ainsi sur sa propre bombe). On fusionne aussi DANS l'objet
                // existant au lieu de le remplacer : moveAI() tient une référence
                // sur cet objet, et le set() de sa bombe déclenche ce listener
                // en synchrone — un nouvel objet faisait perdre son pas de fuite.
                for (const id of localEntityIds()) {
                    const local = gameState.players[id];
                    const remote = newPlayers[id];
                    if (!local || !remote) continue;
                    const movement = {};
                    for (const key of LOCAL_MOVEMENT_KEYS) movement[key] = local[key];
                    newPlayers[id] = Object.assign(local, remote, movement);
                }
                gameState.players = newPlayers;

                // Convertir les objets en tableaux en conservant la clé Firebase
                // comme id : Object.values() seul la perdait, ce qui rendait
                // toute suppression ultérieure impossible.
                const toArray = (obj) => obj
                    ? Object.entries(obj).map(([key, value]) => ({ ...value, id: value.id || key }))
                    : [];

                const nowSync = Date.now();
                gameState.bombs = toArray(gameData.bombs);

                // Ignorer les explosions déjà expirées : sinon isCellDangerous()
                // les compte encore et l'IA ne trouve plus aucune case sûre.
                const allExplosions = toArray(gameData.explosions);
                gameState.explosions = allExplosions.filter(
                    explosion => explosion.timestamp + explosion.duration > nowSync
                );
                // Purger celles qui traînent côté Firebase (notamment les entrées
                // héritées, créées sans id exploitable)
                allExplosions
                    .filter(explosion => explosion.timestamp + explosion.duration <= nowSync)
                    .forEach(explosion => {
                        if (explosion.id) {
                            database.ref(`games/${roomId}/explosions/${explosion.id}`).remove();
                        }
                    });

                gameState.bonuses = toArray(gameData.bonuses);
                
                gameState.gameStarted = gameData.gameStarted;
                
                // Afficher un message quand le jeu commence
                if (gameState.gameStarted) {
                    if (aiMode) {
                        gameInfo.textContent = `Survivez sur l'île contre le pirate IA - Vous êtes le Rasta Rouge`;
                    } else if (gameData.players.player1 && gameData.players.player2) {
                        gameInfo.textContent = `Combat sur l'île - Vous êtes le ${playerId === 'player1' ? 'Rasta Rouge' : 'Surfeur Bleu'}`;
                    }
                }
            });
            
            // Configurer les déconnexions
            gameRef.child(`players/${playerId}`).onDisconnect().remove();
            database.ref(`.info/connected`).on('value', (snapshot) => {
                if (snapshot.val() === false) return;
                
                // Nettoyer la partie si tous les joueurs sont déconnectés
                gameRef.onDisconnect().remove();
            });
            
            // Cacher les contrôles de salle et cacher les contrôles de jeu jusqu'à la fin
            document.getElementById('roomControls').style.display = 'none';
            document.getElementById('gameControls').style.display = 'none';
        }

        // Fonction pour redémarrer la partie
        function restartGame() {
            log("Redémarrage de la partie");
            // Si on est en mode solo avec IA
            if (aiMode) {
                // Nettoyer l'intervalle de l'IA pour éviter les doublons
                if (aiMoveInterval) {
                    clearInterval(aiMoveInterval);
                }

                cleanupCurrentGame();

                // Régénérer une carte et réinitialiser les joueurs
                const roomId = 'solo_' + generateId();
                gameState.roomId = roomId;
                
                // Créer une nouvelle partie
                const gameRef = database.ref(`games/${roomId}`);
                gameRef.set({
                    map: generateMap(),
                    players: {
                        player1: createPlayer(0, 0, '#ff6b6b'),
                        [aiPlayerId]: createPlayer(GRID_SIZE - 1, GRID_SIZE - 1, '#4ecdc4')
                    },
                    bombs: {},
                    explosions: {},
                    bonuses: {},
                    gameStarted: true
                });
                
                // Rejoindre la partie
                joinGame(roomId, 'player1');
                gameInfo.textContent = `Survivez sur l'île contre le pirate IA - Vous êtes le Rasta Rouge`;
                
                // Démarrer l'IA
                startAI();
                
                // Cacher les contrôles de jeu jusqu'à la fin de partie
                document.getElementById('gameControls').style.display = 'none';
            } else {
                // Pour les parties multijoueur, revenir à l'écran de création de partie
                document.getElementById('roomControls').style.display = 'block';
                document.getElementById('gameControls').style.display = 'none';
                
                // Déconnecter la partie actuelle
                if (gameState.roomId) {
                    database.ref(`games/${gameState.roomId}`).off();
                }
                
                // Réinitialiser l'état
                gameState.roomId = null;
                gameState.playerId = null;
                gameState.map = [];
                gameState.players = {};
                gameState.bombs = [];
                gameState.explosions = [];
                gameState.bonuses = [];
                gameState.gameStarted = false;
            }
        }

        // Fonction pour revenir au menu principal
        function returnToHome() {
            log("Retour à l'accueil");
            // Rediriger vers la page d'accueil
            window.location.href = 'index.html';
        }

        //--------------------------------------------------
        // ÉCOUTEURS D'ÉVÉNEMENTS
        //--------------------------------------------------

        // Gérer les entrées clavier
        window.addEventListener('keydown', (e) => {
            gameState.keys[e.key] = true;
            
            // Touche espace pour poser une bombe
            if (e.key === ' ' && gameState.gameStarted) {
                placeBomb();
            }
            
            // Éviter le scroll de la page avec les flèches
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            gameState.keys[e.key] = false;
        });

        // Nettoyage lors de la fermeture de la page
        window.addEventListener('beforeunload', () => {
            if (aiMoveInterval) {
                clearInterval(aiMoveInterval);
            }
        });

        // Ajout des écouteurs d'événements pour les boutons avec système de log
        log("Ajout des écouteurs d'événements pour les boutons");
        
        const createBtn = document.getElementById('createBtn');
        if (createBtn) {
            createBtn.addEventListener('click', function() {
                log("Bouton createBtn cliqué");
                createGame();
            });
            log("Écouteur ajouté pour createBtn");
        } else {
            console.error("Élément createBtn non trouvé");
        }
        
        const joinBtn = document.getElementById('joinBtn');
        if (joinBtn) {
            joinBtn.addEventListener('click', function() {
                log("Bouton joinBtn cliqué");
                joinExistingGame();
            });
            log("Écouteur ajouté pour joinBtn");
        } else {
            console.error("Élément joinBtn non trouvé");
        }
        
        const singlePlayerBtn = document.getElementById('singlePlayerBtn');
        if (singlePlayerBtn) {
            singlePlayerBtn.addEventListener('click', function() {
                log("Bouton singlePlayerBtn cliqué");
                createSinglePlayerGame();
            });
            log("Écouteur ajouté pour singlePlayerBtn");
        } else {
            console.error("Élément singlePlayerBtn non trouvé");
        }
        
        const restartBtn = document.getElementById('restartBtn');
        if (restartBtn) {
            restartBtn.addEventListener('click', function() {
                log("Bouton restartBtn cliqué");
                restartGame();
            });
            log("Écouteur ajouté pour restartBtn");
        } else {
            console.error("Élément restartBtn non trouvé");
        }
        
        const homeBtn = document.getElementById('homeBtn');
        if (homeBtn) {
            homeBtn.addEventListener('click', function() {
                log("Bouton homeBtn cliqué");
                returnToHome();
            });
            log("Écouteur ajouté pour homeBtn");
        } else {
            console.error("Élément homeBtn non trouvé");
        }

        // Boucle de jeu principale
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Démarrer le jeu
        log("Démarrage de la boucle de jeu");
        gameLoop();
    </script>
</body>
</html>
